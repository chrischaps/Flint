# Graphite: a pencil study. Tone becomes cross-hatching on pale paper,
# the scene's silhouettes and creases become wobbling, doubled outlines.
#
#   flint render <scene> --look graphite -o graphite.png
#   flint render <scene> --look graphite --sweep pencil.spacing=4,6,9 -o graphite-spacing.png
#
# A look is a [post_process] block in the scene format, merged over the
# scene's own key by key (#279). `flint render --look help` lists them all.
# `flint render --list-styles` lists every style, its keys and their ranges.
# Until #273 this look was the ASCII style inverted (the glyphs cut out of
# a paper fill); since then it is the pencil sketch style itself.

[look]
name = "graphite"
description = "Pencil sketch: cross-hatched tone, wobbling contours, paper grain"
tune = [
    "pencil.spacing=4,6,9",
    "pencil.contrast=1,1.4,1.8",
    "pencil.direction=surface,screen,tensor",
    "pencil.wobble=0,1.5,4",
]
notes = """
Spacing is the pencil's sharpness: 4 points reads as a fine study, 9 as a
quick sketch. Contrast decides how much of the frame is hatched: stylize_props'
dark ground takes all three layers at 1.4, and the sky stays bare paper.
direction = screen is the most graphic (one hand, one angle); surface wraps
strokes round forms; tensor follows the picture's own edges and gets busy
round shadows. Wobble 0 is a technical drawing, 4 a nervous one.
"""

[post_process]
bloom_enabled = false
ssao_enabled = true
ssao_intensity = 1.2
exposure = 1.15
vignette_enabled = true
vignette_intensity = 0.2

[post_process.styles.pencil]
spacing = 5.0
contrast = 1.4
wobble = 1.8
sketchy = 0.7
grain = 0.55
