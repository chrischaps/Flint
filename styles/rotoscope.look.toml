# Rotoscope: the world traced in pencil on blank paper. Mostly line:
# silhouettes and creases in a soft black lead, one sparse layer of
# hatching at one angle only where the light falls off, and a white sheet
# where the sky and the ground were. The floor keeps one line, its
# horizon. In the player everything moves on twelve drawings a second: the
# lines boil and the poses hold on the same ticks, as a traced film is
# drawn frame by frame (#887).
#
#   flint render <scene> --look rotoscope -o rotoscope.png
#   flint render <scene> --look rotoscope --sweep pencil.contour_width=1,1.5,2.2 --sweep pencil.wobble=0.8,2,3.5 -o weight.png
#   flint render <scene> --look rotoscope --style pencil:layers=0 -o lines-only.png
#   flint render <scene> --look rotoscope --style-time 0.5 -o boiled.png
#   flint render <scene> --look rotoscope --time 0..1 --fps 24 -o held.gif   # on twos at 24 fps
#
# A look is a [post_process] block in the scene format, merged over the
# scene's own key by key (#279). `flint render --look help` lists them all.
# The first look of #402 (a rotoscoped sketch world), #404.

[look]
name = "rotoscope"
description = "Rotoscope: ink-forward pencil lines on a blank sheet, hatching only in the shadows, motion and lines on twelve drawings a second"
tune = [
    "pencil.contour_width=1,1.5,2.2",
    "pencil.wobble=0.8,2,3.5",
    "pencil.brightness=0,0.25,0.5",
    "pencil.layers=0,1,2",
    "pencil.grazing=0,0.5,1",
    "pencil.clutter=0,0.5,1",
    "pencil.tone=light,picture",
]
notes = """
tone = light (#869) takes the tone from the light, not the paint, so a dark
floor in the sun stays blank and only the shadows are hatched. Swept against
brightness 0, 0.25 and 0.5 on stylize_props and the darker ascii_dark_props,
every light cell kept both floors blank; brightness 0 hatched the cast
shadows most, so it ships at 0. Under tone = picture the brown floor was
hatched all over until brightness 0.5, and the dark one even then: that was
this look's setting before #887. layers = 0 with
shade = 0 is the line-only drawing (and skips the stroke flow, so it is the
cheapest pencil); layers = 2 crosses the barrels' strokes and leaves the
floor blank. grazing = 1 is what keeps the sheet blank: without it a
floor seen edge-on steps in depth from row to row like a silhouette and
inks a thick band along the horizon; at 1 the horizon is one line.
clutter = 1 (#883) is what keeps a meadow blank: every grass blade is a
depth step against the ground behind it, and at 1.5 points their lines
merged into one black band from the near edge to the horizon. At 1 a line
fades where the lines round it already cover most of a disc two outline
widths across, so the meadow is a sheet with its near edge's tufts and its
horizon; the props' outlines, which cover a fifth of that disc, stay.
direction = screen, one hand at one angle, read most like a traced frame:
surface and tensor both swirled round the barrels.
contour_width 1.5 and wobble 2 are the middle of the sweep: 1 looked like a
technical pen, 2.2 like a marker, and wobble 3.5 doubled every outline.
motion_hold = 12 (#405) draws poses and positions on the same 12 ticks a
second as boil = 12, so a figure's pose and its lines turn on one frame and
hold for the next: on twos at 24 fps. Physics and scripts still move
smoothly; only the drawing is held. On skeletal_test at 24 fps the frames
came in identical pairs; with motion_hold = 0 every frame differed (the pose
glides under lines that boil at 12). 8 puts it on threes, lines included: a
whole-frame hold holds the styles' clock too. Both clocks only move with
time (the player, --time, --style-time); a still at time 0 is
byte-identical run to run.
"""

[post_process]
motion_hold = 12
bloom_enabled = false
ssao_enabled = false
vignette_enabled = false

[post_process.styles.pencil]
layers = 1
shade = 0.0
tone = "light"
direction = "screen"
angle = 55.0
brightness = 0.0
contrast = 1.6
grazing = 1.0
clutter = 1.0
contour = 1.6
contour_width = 1.5
wobble = 2.0
sketchy = 0.5
detail = 0.3
grain = 0.15
paper = [0.97, 0.96, 0.93]
lead = [0.1, 0.1, 0.12]
boil = 12.0
