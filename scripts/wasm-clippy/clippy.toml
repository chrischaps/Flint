# Calls that compile for wasm32-unknown-unknown but panic there at run time
# ("time not implemented on this platform"). CI's wasm job denies them in
# every crate flint-player links (.github/workflows/ci.yml). #100 moved the
# sites that predated the check to web-time, so there are no time allows.
#
# File reads are denied too: `std::fs` fails on wasm32, so every runtime read
# goes through `flint_core::vfs` (#97), which the web player backs with its
# bundle. Writes, and hot reload's polling of the disk, stay native.
#
# winit's cursor grab is denied as well: on the web it calls the Pointer Lock
# API without asking whether the browser has one, and iOS WebKit hasn't, so
# it throws through the event loop and freezes the game (Float#3). The page
# asks for and lets go of the lock itself (player_app/web_page.rs).
#
# `toml::Value::as_float` is denied for a reason that has nothing to do with
# wasm (#685, ADR 0115): it reads a TOML integer as nothing, so `speed = 8`
# silently became the default. This check is where it lives because it is the
# one that walks exactly the runtime crates (everything flint-player links,
# libs and bins, no tests, no CLI) and fails a PR. Read a component through
# `FlintWorld::view`, any other table through `flint_core::toml_util`.
disallowed-methods = [
    { path = "toml::Value::as_float", reason = "reads an integer as nothing, so `speed = 8` falls back to the default; use FlintWorld::view / ComponentView for a component, flint_core::toml_util::toml_f64 otherwise (#685)" },
    { path = "winit::window::Window::set_cursor_grab", reason = "throws on iOS WebKit, which has no Pointer Lock API; use web_page's request_lock/exit_lock (Float#3)" },
    { path = "std::time::Instant::now", reason = "panics on wasm32; use web_time::Instant (#100)" },
    { path = "std::time::Instant::elapsed", reason = "calls Instant::now, which panics on wasm32; use web_time::Instant (#100)" },
    { path = "std::time::SystemTime::now", reason = "panics on wasm32; use web_time::SystemTime (#100)" },
    { path = "std::time::SystemTime::elapsed", reason = "calls SystemTime::now, which panics on wasm32; use web_time::SystemTime (#100)" },
    { path = "std::fs::read", reason = "no file system on wasm32; use flint_core::vfs::read (#97)" },
    { path = "std::fs::read_to_string", reason = "no file system on wasm32; use flint_core::vfs::read_to_string (#97)" },
    { path = "std::fs::read_dir", reason = "no file system on wasm32; use flint_core::vfs::read_dir (#97)" },
    { path = "std::fs::File::open", reason = "no file system on wasm32; read the bytes with flint_core::vfs::read (#97)" },
    { path = "std::path::Path::exists", reason = "no file system on wasm32; use flint_core::vfs::exists (#97)" },
    { path = "std::path::Path::is_file", reason = "no file system on wasm32; use flint_core::vfs::is_file (#97)" },
    { path = "std::path::Path::is_dir", reason = "no file system on wasm32; use flint_core::vfs::is_dir (#97)" },
    { path = "image::open", reason = "reads the disk; use flint_render::open_image (#97)" },
    { path = "gltf::import", reason = "reads the disk; use flint_import::import_gltf (#97)" },
]
