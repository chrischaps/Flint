# The engine checkout as a project (ADR 0114): what the test fixtures and
# anything else run from this tree resolve their schemas by, from any folder
# and with no --schemas flag:
#
#   flint render tests/fixtures/scenes/pbr_test.scene.toml -o pbr.png
#
# The examples are their own project (flint-examples, #984): a clone of it
# inside this checkout has its own flint.toml, which names its engine/
# subtree's schemas.
#
# A game that carries the engine as a subtree never reads this file: its own
# flint.toml names `engine/schemas`, the engine's set, and that set has no
# room-builder vocabulary in it (#681).

[project]
# The engine's components and archetypes, then the layer the examples (and
# the fixtures copied from them) are written in: `furniture`, `wall`,
# `floor`, `ceiling`, `pillar`, `room`, `door` and the `door` component.
#
# A --schemas flag is the whole list, so `--schemas schemas` alone is the
# engine's set and leaves the examples' archetypes unresolved.
schemas = ["schemas", "schemas/examples"]
