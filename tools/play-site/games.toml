# The games play.chaps.dev serves (#103, epic #94).
#
# The deploy (.github/workflows/play.yml, through build.py) fetches each repo
# at its pinned commit, packs it with `flint bundle --name <id>` into
# games/<id>/, and writes games.json, which the page reads for its chooser
# and its no-WebGPU fallback. `?game=<id>` plays one.
#
# A commit, not a branch: the site changes only when this file does, and a
# game's push can't break play.chaps.dev between Flint deploys.
#
#   id      the bundle name and the ?game= value: lowercase, digits, - and _
#   title   shown on the chooser and over the fallback film
#   line    one sentence under the title
#   controls  the gate's small line on how it's played (default: sound on ·
#           mouse to look · Esc frees the pointer)
#   page    the game's page on chaps.dev
#   video   a film of the game for browsers without WebGPU: any https URL,
#           or a path in the game's repo, copied beside its bundle
#   poster  that film's first frame, also the chooser's picture (URL or path)
#   film    a line under the film, saying what it shows

[[game]]
id = "float"
title = "SET + DRIFT"
line = "Sit at the edge of a raft at sea, from sunrise to stars. There is nothing to win."
repo = "chrischaps/Float"
# engine-catchup: the engine subtree at Flint main, bundle.toml (#102) and
# the sea and wind in an early ambience bundle (#124)
ref = "73cb26b52134632c2bcfd406e5300fed82eaa626"
page = "https://chaps.dev/projects/float/"
video = "https://chaps.dev/projects/float/a-day-at-sea.mp4"
poster = "https://chaps.dev/projects/float/poster-day.jpg"
film = "Meanwhile, one whole day at sea, filmed in the game."

[[game]]
id = "kart"
title = "Flint Kart"
line = "Six karts, three laps, one drift-boost at a time. Keys or a pad."
controls = "sound on · WASD or a pad · Shift or LB to drift · E or X for items"
repo = "chrischaps/FlintKart"
# engine-catchup: trike-backports, the engine subtree at Flint main, and
# bundle.toml with the film and poster under web/ (#104)
ref = "25029fbdf18cd6fa0844ebecad24b204d8a6db3c"
page = "https://chaps.dev/projects/flint-kart/"
# Paths, not URLs: build.py copies them from the repo beside the bundle.
video = "web/kart-race.mp4"
poster = "web/kart-poster.jpg"
film = "Meanwhile, the first lap of a race on Oval Plus, filmed in the game."
