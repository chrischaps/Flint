# Sun Prints on a phone or tablet (#430): a stick for the left thumb, the
# negative under the right, and the rest of the screen turns the view.
# The keyboard and pad keep the built-in bindings (E is `interact`).
# They appear once a finger touches, and hide when a key or pad is used.

version = 1

[touch_controls]
opacity = 0.85

[[touch_controls.sticks]]
anchor = "bottom_left"
offset = [130, 130]
radius = 64
up = "move_forward"
down = "move_backward"
left = "move_left"
right = "move_right"

[[touch_controls.buttons]]
action = "interact"
label = "turn"
anchor = "bottom_right"
offset = [100, 110]
radius = 40

[touch_controls.look]
sensitivity = 2.0
