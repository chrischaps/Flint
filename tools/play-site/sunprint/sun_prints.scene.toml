# Sun Prints (#430): a garden printed in sunlight, after Anna Atkins'
# "Photographs of British Algae" (1843), the first book of photographs.
#
# Everything you see is the game's own cyanotype (styles/cyanotype.*), a
# user-authored style: a .shader.toml and two WGSL functions, loaded at run
# time, which on play.chaps.dev the browser compiles. The sky is the light
# that reached the paper and turned it Prussian blue; the palms, the stones
# and their shadows are what lay on it and stayed white.
#
# The print develops as you stand in the sun (scripts/sun_prints.rhai
# eases the exposure up), and E turns the negative over.
#
#   flint render tools/play-site/sunprint/sun_prints.scene.toml --output print.png
#   flint render tools/play-site/sunprint/sun_prints.scene.toml --style cyanotype:strength=0
#   cargo run --bin flint -- play tools/play-site/sunprint/sun_prints.scene.toml
#   flint export web tools/play-site/sunprint     # the site's build: tools/play-site/games.toml

[scene]
name = "Sun Prints"
version = "1.0"
description = "A garden printed in sunlight by a user-authored cyanotype style"
# The touch layout: a stick and the negative's button
input_config = "config/input.toml"

[camera]
position = [0.0, 1.6, -9.0]
target = [0.0, 2.4, 0.0]
fov = 62.0

[post_process]
exposure = 1.05
bloom_enabled = false
vignette_enabled = false
ssao_enabled = true
ssao_radius = 0.8
ssao_intensity = 0.6

[post_process.styles.cyanotype]
process = "photogram"
exposure = 1.3
bleed = 0.45
coating = 0.07
grain = 0.55

[entities.darkroom]
[entities.darkroom.script]
source = "sun_prints.rhai"

# A pale sky: the light that prints
[entities.sky]
[entities.sky.sky]
zenith_color = [0.62, 0.72, 0.86, 1.0]
horizon_color = [0.98, 0.92, 0.84, 1.0]
haze_color = [1.0, 0.95, 0.88, 0.6]
cloud_coverage = 0.22
star_opacity = 0.0
ambient_sky = [0.16, 0.17, 0.20]
ambient_ground = [0.10, 0.09, 0.08]

# Low sun ahead, so the fronds stand against the bright sky and every shadow
# runs back toward the walker
[entities.sun]
[entities.sun.light]
type = "directional"
direction = [0.2, 0.42, 0.88]
color = [1.0, 0.93, 0.82]
intensity = 2.2

# A middling ground: it prints a pale blue, and the shadows on it stay paper
[entities.ground]
[entities.ground.transform]
position = [0, 0, 0]
[entities.ground.bounds]
min = [-40, -0.4, -40]
max = [40, 0, 40]
[entities.ground.material]
color = [0.42, 0.40, 0.36, 1.0]
roughness = 0.95
[entities.ground.rigidbody]
body_type = "static"
[entities.ground.collider]
shape = "box"
size = [80, 0.4, 80]
friction = 0.8

[entities.walker]
archetype = "player"
[entities.walker.transform]
position = [0.0, 1.0, -9.0]
[entities.walker.character_controller]
move_speed = 2.6
jump_force = 4.5
camera_mode = "first_person"

