# Cyanotype: a sun print, as a user-authored style (ADR 0112, #430).
#
# Paper brushed with iron salts turns Prussian blue where light reaches it
# and stays white where something lies on it. Anna Atkins printed her algae
# and ferns this way in the 1840s. This is the style of
# crates/flint-player/examples/cyanotype (#419) written again as a game's
# own .shader.toml and WGSL, with no Rust: what play.chaps.dev's Sun Prints
# draws in the browser, the browser compiling it (#430).
#
#   flint render tools/play-site/sunprint/scenes/sun_prints.scene.toml --output print.png
#   flint render tools/play-site/sunprint/scenes/sun_prints.scene.toml --style cyanotype:process=print
#   flint render tools/play-site/sunprint/scenes/sun_prints.scene.toml --gpu-time 120
version = 1
name = "cyanotype"
label = "Cyanotype (sun print)"
stage = "display"

[params.exposure]
default = 1.3
min = 0.2
max = 3.0
help = "Time in the sun: longer, and the same light prints a deeper blue"

[params.bleed]
default = 0.45
min = 0.0
max = 1.0
help = "Light creeping under an edge, up to 9 points across"

[params.coating]
default = 0.07
min = 0.0
max = 0.2
help = "Where the brushed coat stops short of the sheet's edge, as a share of its height"

[params.grain]
default = 0.55
min = 0.0
max = 1.0
help = "Paper fibres and tooth showing through the blue"

[params.strength]
default = 1.0
min = 0.0
max = 1.0
help = "The print over the picture: 0 is the picture as it was"

# photogram: light turns blue, what stands in front of it stays paper, as
# Atkins' plants do. print: from a negative, light stays paper, shade blues.
[options.process]
default = "photogram"
choices = ["photogram", "print"]

# 1. The dose: how much light reached each part of the paper, spread by the
# creep under edges. Half size: it's a blur, and half the pixels.
[[passes]]
name = "dose"
shader = "cyanotype_dose.wgsl"
target = "dose"
scale = 0.5

# 2. The print: the dose through the iron's tone curve, an uneven coat,
# paper fibres and the brushed border. Writes the stage's output.
[[passes]]
name = "print"
shader = "cyanotype.wgsl"
reads = ["dose"]
