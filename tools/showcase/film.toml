# The showcase film (#434, #435): one beat per stylize feature, each a
# scene in examples/film/ played with no hand on the controls and captured
# frame by frame. A shot list for `flint capture` (#722): each [[shot]] is
# a beat. The storyboard (what each beat shows, why it is cut the way it
# is) is docs/design/showcase-film.md.
#
#   python tools/showcase/build_scenes.py          # beats/*.toml + set.toml -> scenes
#   flint capture tools/showcase/film.toml         # every beat, every take
#   flint capture tools/showcase/film.toml --shot 02_type --scale 0.5
#   flint capture tools/showcase/film.toml --shot 02_type --verify   # twice, and compare
#   python tools/showcase/cut.py reel --capture    # what the vertical reel uses, at its size
#
# A beat's takes are the runs captured for it; most have one, `main`. A
# take may change the look (or add player `args`), so one camera path is
# shot several ways and cut together.

[capture]
title = "Many Hands"
# Frames a second of game time. Each frame steps the clock exactly 1/fps.
# 60 since #436: the 16:9 master is 60 fps, and a cut never resamples time.
fps = 60
# The master. Point-sized things (ASCII cells, egui) are laid out on a
# 1920x1080-point canvas whatever the resolution: pixels_per_point is
# width / 1920, so a 4K take and a 1080p preview frame alike, and the input
# scripts click in those points.
width = 3840
height = 2160
points_wide = 1920
# Frames go here unless --out says otherwise: outside the repo, since a 4K
# frame is ~7 MB (the whole film, 10,940 frames, was 77 GB).
out = "~/flint-film"

[[shot]]
id = "01_plain"
scene = "../../examples/film/01_plain.scene.toml"
title = "The clearing"
seconds = 6.0
notes = ["the unstyled render every style redraws"]

