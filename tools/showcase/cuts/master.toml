start_s = 0.2
bars = 4
caption = "Fade and dissolve"

[[shot]]
beat = "08_pencil"
take = "main"
start_s = 0.2          # the whole page at 5.0 s, on the shot's third bar
bars = 4
caption = "Pencil"

[[shot]]
beat = "09_watercolor"
take = "main"
start_s = 0.2          # the paint lifts at 5.0 s, on the shot's third bar
bars = 3
caption = "Watercolor"

# Looks: one orbit, a half bar per look, cut on the move.
