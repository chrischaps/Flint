# The 16:9 master's cut list (#436), shared with its music (#438).
#
# One [[shot]] per piece of a take, in screen order. The film's clock is the
# music's: 100 bpm in 4/4, so a bar is 2.4 s, 72 frames at 30 fps, 144 at
# 60. Every cut sits on a bar or half-bar line, so the music changes where
# the picture does. `bars` is the shot's length on screen; `start_s` is where
# in the take it starts (seconds of game time). The music
# (`python tools/showcase/music.py`, #438) is arranged to this list: each
# shot's instruments come in on its first bar, and the cues inside a shot
# (02's tables, 03's edges, 08/09's switches at 5.0 s, 05/12's clicks) are
# placed by `start_s`, so they follow an in-point when it moves. Rebuild the
# music after changing anything here.
#
# Drafted by #438 against the storyboard (docs/design/showcase-film.md);
# #436 owns the edit and may change any of it. 48 bars of picture and a
# 2-bar tail (the last frame held under the title as the music rings out):
# 50 bars, 120.0 s.

[cut]
name = "master"
bpm = 100
beats_per_bar = 4
width = 1920
height = 1080
# Bars after the last shot that hold its final frame (title card, end).
tail_bars = 2

[[shot]]
beat = "01_plain"
take = "main"
start_s = 1.2
bars = 2
caption = "Flint, as it renders"

[[shot]]
beat = "02_type"
take = "main"
start_s = 0.0          # its table changes every 2.4 s: each change on a bar line
bars = 5
caption = "The world in type"

[[shot]]
beat = "03_edges"
take = "main"
start_s = 0.1          # the edges come up at 2.5 s, the shot's second bar
bars = 3
caption = "Edges"

[[shot]]
