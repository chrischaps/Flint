take = "main"
start_s = 0.5
bars = 3.5
caption = "Some things in type"

[[shot]]
beat = "05_mask"
take = "main"
start_s = 1.6          # Style Mask goes on at 3.4 s and off at 7.1 s
bars = 3
caption = "The style mask"

[[shot]]
beat = "06_story"
take = "main"
start_s = 0.6
bars = 3.5
caption = "A story in styles"

[[shot]]
