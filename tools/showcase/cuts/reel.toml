# The vertical cut (#437): Many Hands for an Instagram reel and story.
#
#   python tools/showcase/capture.py --cut reel      # the takes it uses, 1080x1920
#   python tools/showcase/cut.py reel               # reel.mp4 + four story pieces
#
# One file per cut (the master is cuts/master.toml, #436). Shots are on the
# music's bar grid (#438): 100 bpm in 4/4, one bar = 2.4 s = 72 frames at
# 30 fps, every cut on a bar or half bar (the looks on quarter bars, one a
# beat). 24 bars = 57.6 s, which splits into four 6-bar stories of 14.4 s,
# each cut at a shot boundary. The music reads `beat` and `bars` only:
# moving a start_s or a caption never touches the track.
#
# A shot is `start_s` seconds into its take (the beat's own clock, as its
# script counts it) for `bars` bars. Its caption goes up on its first bar
# and comes down at its last; shots in a row with the same caption share
# one, and `label` (the small line under it) can change within it.

[cut]
name = "reel"
bpm = 100
beats_per_bar = 4
fps = 30
width = 1080
height = 1920
story_bars = 6
tail_bars = 0
# What #437 promises (Instagram takes longer reels); cut.py refuses past it
max_seconds = 90
# Point-sized things (ASCII cells, pencil spacing, outlines) are laid out on
# a canvas this many points wide: pixels_per_point = 1080 / 720 = 1.5. The
# master's 1920-point canvas would make an 8-point cell 4.5 px here, fine
# grain a phone shows as noise; at 1.5 a cell is 12 px, 90 across the frame
# (see the storyboard's "Vertical cut" for the sweep that chose it).
points_wide = 720
# Where key content and captions stay: x0, y0, x1, y1 in pixels. The
# intersection of Instagram's story safe area (central 1080x1420) and the
# reel's (clear of ~210 px of top bar, ~440 px of caption and buttons at
# the bottom, ~120 px of buttons down the right).
safe = [120, 250, 960, 1480]
# The captions' type: a serif italic over a monospaced line (Windows fonts;
# cut.py says what it couldn't find and which it used instead)
caption_font = ["georgiai.ttf", "DejaVuSerif-Italic.ttf"]
label_font = ["CascadiaMono.ttf", "consola.ttf", "DejaVuSansMono.ttf"]
# The soundtrack, written to this cut's bars by `python tools/showcase/music.py
# reel` (#438); cut.py cuts silent, and says so, until it exists
audio = "~/flint-film/music/many-hands-reel.wav"

# H.264 High, BT.709, a keyframe a second, under Instagram's bitrate
[encode]
crf = 16
preset = "slow"
gop_s = 1.0
maxrate = "24M"
bufsize = "48M"
audio_bitrate = "192k"

# The last shot ends on a card: the title over the evening, then black
[cut.end]
bars = 2.0
title = "Flint"
line = "a game engine built for AI agents"
# One line each, at the foot of the safe area
small = ["every frame captured from the engine", "chaps.dev/projects/flint"]
fade_out_s = 1.2

