# A brass coil: a smooth tube swept up a helix (sweep_v1, #750). The path
# is inline, written as a .spline.toml's control points are, so the spec is
# the whole input and `flint gen` makes the same bytes every time.
#
#   flint gen specs/examples/brass_coil.procgen.toml -o coil.glb
#   flint edit specs/examples/brass_coil.procgen.toml

