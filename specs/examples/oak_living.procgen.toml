# The English oak from oak_tree.procgen.toml, as a living prop: a tree that
# keeps drifting between versions of itself and stays the same tree.
#
# Two seeds do this. The *lineage* seed fixes the structure: the trunk, how
# many branches, where they attach, and every leaf card. It's the tree's
# identity. Each *shape* seed regrows only the branches on that same trunk,
# and since the L-system rewrites every branch the same way and draws only
# angles at random, all its branches line up one for one with the lineage's.
# So a pose is a small list of per-segment turns and scales, and poses can
# blend. Only the built-in L-system can do this: space colonization and text
# grammars report themselves unsupported.
#
#   flint gen specs/examples/oak_living.procgen.toml --dry-run    # checks [living], counts the skeleton
#   flint gen specs/examples/oak_living.procgen.toml -o oak.glb   # the skinned rest mesh
#   flint edit oak.glb --pose-bone seg_0001:0,0,55 --show-skeleton
#   flint gen specs/examples/oak_living.procgen.toml --strip -o strip.png   # 48 frames of it on one sheet
#   cargo run -p flint-procgen --example living_poses -- specs/examples/oak_living.procgen.toml --out poses
#
# `flint gen` bakes the lineage's rest mesh, skinned to a bone per segment. It
# grows from lineage_seed, so [seed] plays no part, and --seed or --batch pick
# the lineage instead. [[lod]] doesn't apply: a skinned rest is one level.
#
# In a scene, give an entity `model.asset = "oak_living"` and a `living_prop`
# component, as demo/living_props.scene.toml does. It stands in its rest pose
# with a ring of poses kept ready; blending them is coming through epic #206.

generator = "tree_v1"

[meta]
name = "oak_living"
description = "A broad oak that keeps drifting between versions of itself"
version = "1.0.0"
tags = ["tree", "vegetation", "deciduous", "oak", "living", "example"]

[seed]
mode = "fixed"
value = 42

[params]
# ── Trunk ────────────────────────────────────────────────────────────────
trunk_height = 4.5
trunk_radius_base = 0.38
trunk_radius_top = 0.13                  # the limbs off the tip start this thick
trunk_segments = 12
radial_segments = 10
trunk_curve_noise = 0.1                  # metres of sideways sway

# ── Bark ─────────────────────────────────────────────────────────────────
bark_color_base = "#4E3524"
bark_roughness = 0.92
bark_normal_strength = 1.2               # depth of the furrows in the bark normal map

# ── Branching: the built-in L-system ─────────────────────────────────────
branch_method = "lsystem"
lsystem_iterations = 5                   # rewriting passes = branching depth. Each
                                         # pass multiplies the segments, so 6 is a lot
branch_start = 0.5                       # lowest limb halfway up the trunk
crown_radius = 3.8                       # how far the limbs reach from the trunk
branch_angle_min = 25.0                  # degrees a limb leaves its parent at,
branch_angle_max = 50.0                  #   picked between these two
lsystem_angle_variation = 14.0           # extra randomness on every turn: the
                                         # oak's crookedness
branch_length_falloff = 0.66             # each level is 66% as long as its parent
branch_radius_falloff = 0.55             # and 55% as thick

# ── Leaves ───────────────────────────────────────────────────────────────
leaf_style = "billboard"                 # quads facing along their branch
leaf_density = 0.9                       # 90% of branch tips get a cluster
leaves_per_tip = 8
leaf_spread_radius = 0.55                # a cluster's leaves scatter this far
leaf_along_branch_density = 0.8          # clusters along the twigs, not only the tips
leaf_along_branch_min_depth = 2          # but only from the second level of limbs out
leaf_size = 0.32
leaf_size_variation = 0.25
leaf_color_base = "#3F7A1E"
leaf_shades = 5                          # each its own material, so the crown is mottled
leaf_color_variation = 0.1
leaf_season = 0.06                       # 0 = summer, 0.4 yellow, 0.7 orange, 1 red:
                                         # high summer, the first leaves turning
leaf_season_variation = 0.1              # shades stray from it, so it turns unevenly

# ── Levels of detail ─────────────────────────────────────────────────────
# Each [[lod]] caps one level's triangles; the GLB holds the whole chain.
[[lod]]
level = 0
target_triangles = 9000

[[lod]]
level = 1
target_triangles = 2200

[[lod]]
level = 2
target_triangles = 500

# ── Living ───────────────────────────────────────────────────────────────
[living]
lineage_seed = 7                         # the tree's identity; every pose shares it
pose_ring = 8                            # how many poses to keep ready
step = 0.5                               # seconds between pose targets
glide = 0.3                              # how much of a step is spent easing to the
                                         # next pose: 0 snaps, 1 never holds
stagger = "per_level"                    # none | per_level | per_branch

# The slow layer, which changes the silhouette and always glides.
drift = { amplitude = 0.35, params = ["branch_angle", "lsystem_tropism", "trunk_curve"] }

# The fast layer, which makes it feel drawn and may snap.
jitter = { amplitude = 0.05, targets = ["leaf_cards"] }

# How much of each pose's difference is left (amount), how much of that is
# held back from the trunk side (steady: 0 even, 1 all at the tips), and
# whether each pose is scaled back to the lineage's size (keep_size). For a
# pose exactly as its shape seed grew it: amount = 1, steady = 0, keep_size = false.
variance = { amount = 0.35, steady = 0.8, keep_size = true }
