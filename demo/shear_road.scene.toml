# ================================================================
#  SHEAR ROAD (#625)
# ================================================================
#
#  A scanline racer's road: 8 m tiles, each pushed sideways and up by
#  its distance (x += dx; dx += curve). Written by
#  demo/tools/shear_road.py; edit that, not this.
#
#  Each tile is ONE entity with transform.shear = { xz, yz }: x and y
#  move with z, so a tile's near edge lands exactly on the last one's
#  far edge and every stripe runs on unbroken. Road, curbs and lane
#  line are children of the ground tile and inherit its shear.
#  scripts/shear_road.rhai re-lays it every frame with set_shear,
#  the bend breathing right to left and back.
#
#  Render:  cargo run --bin flint -- render demo/shear_road.scene.toml \
#             --output renders/shear_road.png --schemas schemas --no-grid
#  Moving:  ... --scripts --time 0..10.5 --fps 12 -o renders/shear_road.gif
#  Play:    cargo run --bin flint -- play demo/shear_road.scene.toml
# ================================================================

[scene]
name = "Shear Road"
version = "1.0"
description = "Scanline road of sheared tiles: one entity per tile, edges continuous through the curve (#625)"

[entities.road_driver]
[entities.road_driver.script]
source = "shear_road.rhai"

[camera]
position = [0, 3.2, -1]
target = [7, 1.6, -60]
fov = 55.0

[post_process]
