# Mesh sequence bench (#222): a clearing for judging generated meshes, a
# frame a file, on one renderer. Each `tree_*` entity is a slot that
# `flint render --mesh` fills with files; without one it shows its stand-in
# barrel, so a plain render still says where the trees go.
#
#   flint gen specs/oak_tree.procgen.toml --seed 1 -o out/oaks/oak_seed1.glb   (and so on)
#   flint render demo/mesh_sequence.scene.toml --mesh tree_a=out/oaks --sheet -o oaks.png
#   flint render demo/mesh_sequence.scene.toml --mesh tree_a=out/oaks -o oaks.gif --fps 4
#   flint render demo/mesh_sequence.scene.toml --mesh tree_a=out/oaks \
#       --mesh tree_b='out/willows/w*.glb' -o frames/f-%03d.png
#
# `tree_a` stands alone in the middle; `tree_b` and `tree_c` stand either side
# of it for sequences compared side by side, frame for frame.

[scene]
name = "Mesh Sequence"
version = "1.0"
description = "Slots for flint render --mesh: each frame shows the next generated mesh (#222)"

[camera]
position = [0.0, 3.2, 11.5]
target = [0.0, 2.6, 0.0]
fov = 50.0

[environment]
ambient_sky = [0.42, 0.46, 0.52]
ambient_ground = [0.2, 0.18, 0.15]

[post_process]
exposure = 1.1
bloom_enabled = true
bloom_intensity = 0.03
bloom_threshold = 1.4
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7
fog_enabled = true
fog_density = 0.012
fog_color = [0.7, 0.72, 0.68]
grade_gain = [1.04, 1.0, 0.93]

[entities.sun]
[entities.sun.light]
type = "directional"
direction = [0.5, 0.75, 0.45]
color = [1.0, 0.93, 0.82]
intensity = 2.8

[entities.ground]
[entities.ground.transform]
position = [0, -0.05, 0]
[entities.ground.bounds]
min = [-30, 0, -30]
max = [30, 0.05, 30]
[entities.ground.material]
base_color_r = 0.36
base_color_g = 0.38
base_color_b = 0.27
roughness = 0.97

[entities.tree_a]
[entities.tree_a.transform]
position = [0, 0, 0]
[entities.tree_a.model]
asset = "barrel"

[entities.tree_b]
[entities.tree_b.transform]
position = [-6.5, 0, -2.5]
[entities.tree_b.model]
asset = "barrel"

[entities.tree_c]
[entities.tree_c.transform]
position = [6.5, 0, -2.5]
[entities.tree_c.model]
asset = "barrel"

[entities.bench]
[entities.bench.transform]
position = [2.6, 0, 2.4]
rotation = [0, -25, 0]
[entities.bench.model]
asset = "wooden_bench"
