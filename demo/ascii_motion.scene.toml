# ASCII Motion: the mesh meadow's clearing in the full-screen ASCII style
# (#265) under a slow orbit, the bench for its temporal stability (#277).
#
# Glyphs shimmer in motion when a cell's tone sits on a ramp boundary and
# the slightest change tips it to the neighbouring glyph and back. With
# `temporal = "on"` (the default) each cell keeps part of last frame's
# colour and keeps its glyph until its tone has clearly moved on. Capture it
# both ways, deterministically:
#
#   cargo run --bin flint-player -- demo/ascii_motion.scene.toml --schemas schemas \
#     --frame-step 0.0166667 --screenshot out/on.png --screenshot-every 0.0166667 --exit-after 4
#
# then set temporal = "off" below and capture again; tools/ascii_flips.py
# counts the glyphs that change from one frame to the next.

[scene]
name = "ASCII Motion"
version = "1.0"
description = "The meadow clearing in ASCII under a slow orbit, to measure glyph shimmer (#277)"

[camera]
position = [4.2, 2.1, 11.5]
target = [0.6, 0.7, 4.2]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 1.2
exposure = 1.25
vignette_enabled = true
vignette_intensity = 0.25
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7

[post_process.styles.ascii]
cell = 8
ramp = "classic"
color = "source"
temporal = "on"      # "off" draws every frame as if it were the first
smoothing = 0.6      # how much of last frame's cell colour a cell keeps
hysteresis = 0.35    # ramp steps a tone may stray before its glyph changes
dither = 0.0         # grid-fixed ordered dither before the ramp

[entities.camera_rig]
[entities.camera_rig.script]
source = "ascii_orbit.rhai"
# Radians a second. 0.12 is the slow orbit shimmer is measured on (#277);
# 1.2 with pan = true (turn in place) is the fast pan reprojected history
# is measured on (#344)
[entities.camera_rig.orbit]
speed = 0.12
pan = false

[entities.sky]
[entities.sky.sky]
zenith_color = [0.16, 0.30, 0.58, 1.0]
horizon_color = [0.86, 0.72, 0.52, 1.0]
haze_color = [0.95, 0.80, 0.60, 0.7]
cloud_tint = [1.0, 0.90, 0.78, 0.8]
cloud_coverage = 0.3
sun_glow = 1.4

