[scene]
name = "Water Bodies"
version = "1.0"
description = "Water on any mesh (ADR 0094): a tarn on a terrace 6 m above the sea, a river falling into it from the plateau at 12 m, and its outflow falling on to the sea. Each body has its own level and tint; fast water foams white. Tune the shared look live with F3's ocean panel."

# From out on the sea, looking up at the terraces: both falls face us.
[camera]
position = [6.0, 13.0, 40.0]
target = [-2.0, 5.0, -14.0]
fov = 55.0

[environment]
ambient_sky = [0.35, 0.40, 0.50]
ambient_ground = [0.12, 0.11, 0.10]

[entities.sky.sky]
zenith_color = [0.18, 0.32, 0.62, 1.0]
horizon_color = [0.70, 0.62, 0.58, 1.0]
haze_color = [0.95, 0.70, 0.50, 0.35]
cloud_coverage = 0.3

# Afternoon sun from behind the camera's right shoulder.
[entities.sun.light]
type = "directional"
direction = [0.45, 0.55, 0.7]
color = [1.0, 0.88, 0.70]
intensity = 2.6

# Refraction and the shoreline band need the grab pass, which needs post.
[post_process]
exposure = 1.0
bloom_enabled = true
bloom_threshold = 2.0
bloom_intensity = 0.1

# The sea at y = 0. Its waves, foam and shoreline band are every body's too,
# scaled by each body's wave_scale.
[entities.ocean.ocean]
seed = 3
amplitude = 0.35
wavelength_min = 0.8
wavelength_max = 12.0
choppiness = 0.55
wind_speed = 5.0
fetch_km = 4.0
turbidity = 0.7
foam_noise_scale = 1.0
splash_strength = 0.0
shore_foam_width = 0.45
shore_foam_strength = 0.9
shore_foam_color = [0.97, 0.94, 0.88, 1.0]
shore_foam_reach = 1.5

# ------------------------------------------------------------
#  The water bodies
# ------------------------------------------------------------

# The tarn: still, dark green, at 6 m. Its outline runs into the rims and
# the cliff behind, so its shore is the stone.
[entities.tarn.water_body]
shape = "lake"
level = 6.0
outline = [[-18.4, -8.2], [18.4, -8.2], [18.4, -30.4], [-18.4, -30.4]]
deep_color = [0.025, 0.17, 0.18, 1.0]
shallow_color = [0.09, 0.40, 0.37, 1.0]
wave_scale = 0.12

# The river off the plateau: a channel at 12 m, then a fall down the cliff
# into the tarn. It ends below the tarn's surface, so the two never meet
# edge to edge at one height.
[entities.upper_river.water_body]
shape = "river"
path = [[4.0, 12.0, -58.0], [4.0, 12.0, -31.0], [4.0, 6.1, -27.6], [4.0, 5.5, -26.4]]
width = 5.4
speed = 1.2
fall_speedup = 1.2
deep_color = [0.05, 0.24, 0.33, 1.0]
shallow_color = [0.24, 0.58, 0.66, 1.0]
wave_scale = 0.15

# The outflow: through a gap in the tarn's front rim and over the edge to
# the sea, ending under the sea's surface.
[entities.outflow.water_body]
shape = "river"
path = [[-11.5, 6.0, -8.2], [-11.5, 6.0, -5.6], [-11.5, 0.15, -2.4], [-11.5, -0.6, 1.0]]
width = 5.4
speed = 1.0
fall_speedup = 1.2
deep_color = [0.03, 0.20, 0.24, 1.0]
shallow_color = [0.14, 0.48, 0.50, 1.0]
wave_scale = 0.15

# ------------------------------------------------------------
#  The land: a sea bed, the tarn's terrace and rims, the plateau
# ------------------------------------------------------------

[entities.sea_bed]
archetype = "furniture"
[entities.sea_bed.transform]
position = [0, 0, 0]
[entities.sea_bed.bounds]
min = [-80, -3.2, -5]
max = [80, -3.0, 60]
[entities.sea_bed.material]
texture = "textures/floor_tiles.png"
texture_scale = 0.25
roughness = 0.95

# The terrace: its top is the tarn's bed, 1.2 m down.
[entities.terrace]
archetype = "furniture"
[entities.terrace.transform]
position = [0, 0, 0]
[entities.terrace.bounds]
min = [-30, -3.0, -30]
max = [30, 4.8, -5]
[entities.terrace.material]
texture = "textures/stone_wall.png"
texture_scale = 0.5
roughness = 0.9

