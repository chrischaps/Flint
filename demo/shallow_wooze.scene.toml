# Shallow wooze (#215): does a hand-made bench belong next to a boiling tree?
#
# Two sets of props stand under the same oaks. The set on the left has a
# `shallow_wooze` component and the set on the right doesn't: a bench built by hand
# from boards, and an imported lantern and barrel. On the left they hold and glide on
# the field's beat, with their shadows, and the set on the right shows what they look
# like pasted in. The figure is imported and skinned, and rides the same field.
#
#   cargo run --release -p flint-player -- demo/shallow_wooze.scene.toml --schemas schemas
#
# A box at the far left of the clearing is a calm zone, where the field's amplitude
# drops to a fifth: the crate inside it barely moves, through no setting of its own.
# `--exit-after` prints how many entities are on how many clocks.

[scene]
name = "Shallow Wooze"
version = "1.0"
description = "Hand-made and imported props on the wooze field's clock, beside still twins and living oaks"

[wooze]
step = 0.5
glide = 0.4

[[wooze.zone]]
name = "hush"
shape = "box"
center = [-6.6, 0, 2]
size = [2, 6, 4]
falloff = 0.5
amplitude = 0.2

[camera]
position = [0.0, 1.7, 12.0]
target = [0.0, 1.9, 0.0]
fov = 46.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.06
bloom_threshold = 1.2
exposure = 1.2
vignette_enabled = true
vignette_intensity = 0.3
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7

# --- Late afternoon, low from behind the left shoulder, so shadows lie long ---

[entities.sky]
[entities.sky.sky]
zenith_color = [0.16, 0.30, 0.58, 1.0]
horizon_color = [0.86, 0.72, 0.52, 1.0]
haze_color = [0.95, 0.80, 0.60, 0.7]
cloud_tint = [1.0, 0.90, 0.78, 0.8]
cloud_coverage = 0.3
sun_glow = 1.4

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.directional_light]
direction = [0.62, -0.52, -0.45]
color = [1.0, 0.86, 0.66]
intensity = 2.6

[entities.fill]
[entities.fill.transform]
position = [0, 30, 0]
[entities.fill.directional_light]
direction = [-0.4, -0.8, 0.4]
color = [0.55, 0.65, 0.85]
