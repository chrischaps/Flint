# Living Props bench (#211): forty oaks, five lineages, each tree with its own
# bone buffer and its own ring of poses kept full ahead of its clock. They stand
# in their rest pose until #212 blends the poses.
#
#   cargo run --release -p flint-player -- demo/living_props.scene.toml --schemas schemas --exit-after 60
#
# prints `[living]` lines saying whether the rings stayed full and within the
# procgen frame budget. The spec is specs/examples/oak_living.procgen.toml; an
# entity's `lineage_seed` says which tree it is, and its name which way it moves.

[scene]
name = "Living Props Bench"
version = "1.0"
description = "Forty living oaks, for checking that their pose rings stay full"

[camera]
position = [0.0, 2.2, 26.0]
target = [0.0, 5.2, -8.0]
fov = 58.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.06
bloom_threshold = 1.2
exposure = 1.2
vignette_enabled = true
vignette_intensity = 0.3
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7
fog_enabled = true
fog_color = [0.86, 0.72, 0.52]
fog_density = 0.006
fog_start = 25.0
fog_end = 220.0

# --- Light: late afternoon, low from behind the left shoulder ---

[entities.sky]
[entities.sky.sky]
zenith_color = [0.16, 0.30, 0.58, 1.0]
horizon_color = [0.86, 0.72, 0.52, 1.0]
haze_color = [0.95, 0.80, 0.60, 0.7]
cloud_tint = [1.0, 0.90, 0.78, 0.8]
cloud_coverage = 0.3
sun_glow = 1.4

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.directional_light]
direction = [0.62, -0.52, -0.45]
color = [1.0, 0.86, 0.66]
intensity = 2.6

[entities.fill]
[entities.fill.transform]
position = [0, 30, 0]
[entities.fill.directional_light]
direction = [-0.4, -0.8, 0.4]
color = [0.55, 0.65, 0.85]
intensity = 0.4

# --- The ground: a plain box, its top at y = 0 ---

[entities.ground]
archetype = "furniture"
[entities.ground.transform]
position = [0, 0, 0]
[entities.ground.bounds]
min = [-140, -0.2, -140]
max = [140, 0, 140]
[entities.ground.material]
color = [0.15, 0.17, 0.07, 1.0]
roughness = 0.95
metallic = 0.0

