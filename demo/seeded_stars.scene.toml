# Seeded stars (#635): scripts' random() in a scripted run. Every second
# scripts/seeded_stars.rhai scatters a sky with random(). A stepped run
# draws the same skies every time; add --seed N for another sequence:
#
#   cargo run --bin flint-player -- demo/seeded_stars.scene.toml --schemas schemas \
#     --frame-step 0.0166667 --screenshot out/stars.png --screenshot-at 2.5 --exit-after 2.6
#
# Its on_init also moves an entity the scene doesn't have ("comet"): the log
# says so once instead of the setter doing nothing in silence.

[scene]
name = "Seeded Stars"
version = "1.0"
description = "random() under --frame-step / --seed: the same skies every run (#635)"

[camera]
position = [0, 1.6, 6]
target = [0, 1.2, 0]
fov = 50.0

[entities.sky_painter]
[entities.sky_painter.script]
source = "seeded_stars.rhai"
