# Watercolor: the mesh meadow's clearing, with a few props painted in
# watercolor on paper and the rest of the world left as it is (#272). It
# renders as is:
#
#   cargo run --bin flint -- render demo/watercolor.scene.toml --output watercolor.png
#
# The [post_process.styles.watercolor] table is the scene's preset for every
# painted prop (scope = "entities" keeps it from covering the whole frame);
# each prop's watercolor_style changes only what it needs:
#   cask    the scene's preset               a static glTF mesh
#   ybot    style_mask "watercolor"          a skinned mesh
#   barrel  heavy pooled edges, more wobble
#   crate   dilute and granular, inherited by the lid on it
#   tag     stays unpainted                  enabled = false
# Delete scope = "entities" and the whole frame is painted, the tag still
# not. It loads only light assets, so it is the per-entity watercolor
# golden too. Or paint any scene from the command line:
#
#   flint render demo/mesh_meadow.scene.toml --style watercolor
#   flint render demo/mesh_meadow.scene.toml --look watercolor

[scene]
name = "Watercolor"
version = "1.0"
description = "Some props painted in watercolor, the meadow left as it is (#272)"

[camera]
position = [4.2, 1.9, 11.5]
target = [0.4, 0.7, 4.6]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 1.2
exposure = 1.25
vignette_enabled = true
vignette_intensity = 0.25
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7

[post_process.styles.watercolor]
scope = "entities"
wobble = 2.5
edge_depth = 1.0

[entities.sky]
[entities.sky.sky]
zenith_color = [0.16, 0.30, 0.58, 1.0]
horizon_color = [0.86, 0.72, 0.52, 1.0]
haze_color = [0.95, 0.80, 0.60, 0.7]
cloud_tint = [1.0, 0.90, 0.78, 0.8]
cloud_coverage = 0.3
sun_glow = 1.4

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.directional_light]
direction = [0.75, -0.38, 0.35]
color = [1.0, 0.86, 0.66]
intensity = 2.4

[entities.fill]
[entities.fill.transform]
position = [0, 30, 0]
[entities.fill.directional_light]
direction = [-0.4, -0.8, -0.4]
color = [0.55, 0.65, 0.85]
intensity = 0.35

[entities.ground]
archetype = "furniture"
[entities.ground.transform]
position = [0, 0, 0]
[entities.ground.bounds]
min = [-60, -0.2, -60]
max = [60, 0, 60]
[entities.ground.material]
color = [0.13, 0.09, 0.055, 1.0]
roughness = 0.95
metallic = 0.0

[entities.meadow]
[entities.meadow.transform]
position = [-48, 0, -48]
[entities.meadow.grass_ground]
mask = "mesh_meadow/mask.png"
width = 96.0
depth = 96.0
scale_by_mask = true
"grass.density" = 40.0
"grass.max_distance" = 70.0
"grass.fade_start" = 50.0
"grass.blade_width" = 0.2
"grass.blade_height" = 0.45
"grass.height_variation" = 0.4
"grass.color_base" = [0.12, 0.38, 0.08]
"grass.color_tip" = [0.42, 0.70, 0.20]
"grass.color_dry" = [0.62, 0.54, 0.24]
"grass.dry_amount" = 0.3
"grass.wind_direction" = [0.8, 0.0, 0.6]
"grass.wind_speed" = 0.6
"grass.wind_strength" = 0.1
"grass.density_threshold" = 0.05

# --- Painted ---

[entities.cask]
archetype = "furniture"
[entities.cask.transform]
position = [0.4, 0.48, 3.4]
rotation = [0, 70, 0]
scale = [0.5, 0.5, 0.5]
[entities.cask.model]
asset = "barrel"
[entities.cask.watercolor_style]

# No animator: at rest the skinned mesh renders at the same size in
# `flint render` and the player (#294, #307).
[entities.ybot]
archetype = "character"
[entities.ybot.transform]
position = [-0.9, 0, 4.4]
rotation = [0, 25, 0]
[entities.ybot.model]
asset = "YBotWithIdle"
[entities.ybot.skeleton]
skin = "Armature"
[entities.ybot.style_mask]
style = "watercolor"

[entities.barrel]
archetype = "furniture"
[entities.barrel.transform]
position = [2.4, 0.48, 5.4]
scale = [0.5, 0.5, 0.5]
[entities.barrel.model]
asset = "barrel"
[entities.barrel.watercolor_style]
edge = 2.5
edge_depth = 1.6
wobble = 4.0

[entities.crate]
archetype = "furniture"
[entities.crate.transform]
position = [2.1, 0.0, 2.6]
rotation = [0, 30, 0]
[entities.crate.bounds]
min = [-0.4, 0.0, -0.4]
max = [0.4, 0.8, 0.4]
[entities.crate.material]
color = [0.55, 0.38, 0.22, 1.0]
roughness = 0.8
[entities.crate.watercolor_style]
pigment = 0.7
granulation = 1.4
paper = [0.98, 0.95, 0.86]

# Inherits the crate's dilute wash
[entities.lid]
archetype = "furniture"
parent = "crate"
[entities.lid.transform]
position = [0.05, 0.8, -0.05]
rotation = [0, 20, 0]
[entities.lid.bounds]
min = [-0.22, 0.0, -0.22]
max = [0.22, 0.3, 0.22]
[entities.lid.material]
color = [0.42, 0.50, 0.30, 1.0]
roughness = 0.7

# --- Unpainted, against its parent's style ---

[entities.tag]
archetype = "furniture"
parent = "crate"
[entities.tag.transform]
position = [-0.27, 0.8, 0.27]
[entities.tag.bounds]
min = [-0.08, 0.0, -0.08]
max = [0.08, 0.16, 0.08]
[entities.tag.material]
color = [0.9, 0.85, 0.6, 1.0]
[entities.tag.watercolor_style]
enabled = false
