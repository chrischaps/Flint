# User-authored styles (#274, ADR 0112): the styles in demo/styles/ are a
# `.shader.toml` and one WGSL function each, loaded at run time, not
# compiled into the engine. This scene turns on `hologram` for two props
# (it reads the entity style mask); the other two draw the whole frame:
#
#   cargo run --bin flint -- render demo/user_styles.scene.toml --output holo.png
#   cargo run --bin flint -- render demo/user_styles.scene.toml --style risograph
#   cargo run --bin flint -- render demo/user_styles.scene.toml --style contour
#
# Break a .wgsl on purpose and render again: the style draws its input
# unchanged and the error names the file, line and column.

[scene]
name = "User styles"
version = "1.0"
description = "Styles written by a game, not the engine: WGSL beside a .shader.toml (#274)"

[camera]
position = [3.6, 1.5, 8.8]
target = [0.9, 0.6, 4.0]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 1.2
exposure = 1.25
vignette_enabled = true
vignette_intensity = 0.25
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7

[post_process.styles.hologram]
glow = 0.9

[entities.sky]
[entities.sky.sky]
zenith_color = [0.16, 0.30, 0.58, 1.0]
horizon_color = [0.86, 0.72, 0.52, 1.0]
haze_color = [0.95, 0.80, 0.60, 0.7]
cloud_tint = [1.0, 0.90, 0.78, 0.8]
cloud_coverage = 0.3
sun_glow = 1.4

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.directional_light]
direction = [0.75, -0.38, 0.35]
color = [1.0, 0.86, 0.66]
intensity = 2.4

[entities.fill]
[entities.fill.transform]
position = [0, 30, 0]
[entities.fill.directional_light]
direction = [-0.4, -0.8, -0.4]
color = [0.55, 0.65, 0.85]
intensity = 0.35

[entities.ground]
archetype = "furniture"
[entities.ground.transform]
position = [0, 0, 0]
[entities.ground.bounds]
min = [-60, -0.2, -60]
max = [60, 0, 60]
[entities.ground.material]
color = [0.13, 0.09, 0.055, 1.0]
roughness = 0.95
