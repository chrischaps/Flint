# Style Terrain: a hillside drawn in glyphs under props that stay smooth,
# and a styled glass you look through (#310). It renders as is:
#
#   cargo run --bin flint -- render demo/style_terrain.scene.toml --output terrain.png --no-grid
#   cargo run --bin flint -- render demo/style_terrain.scene.toml --debug-mode style --output mask.png --no-grid
#
# The ground is a heightmap terrain with an ascii_style: its chunks go into
# the style mask like any styled mesh, so ASCII draws the hills, and every
# unstyled prop standing on them cuts its own smooth hole (the depth test
# per pixel decides). The sky has no depth and stays smooth too.
#
# The pane is transparent glass with a style of its own. A styled
# transparent is a lens: it writes no depth, so wherever it shows in front
# of the scene its id replaces what is behind it, and what you see through
# it (the barrel, the hill) is drawn in its style.
#   ground   amber glyphs     terrain chunks, masked (new in #310)
#   barrel   smooth           unstyled, stands on the glyph hill
#   table    smooth           unstyled, half behind the pane
#   pane     green glyphs     a styled transparent, a lens (new in #310)

[scene]
name = "Style Terrain"
version = "1.0"
description = "ASCII terrain under smooth props, and a styled glass lens (#310)"

[camera]
position = [2.6, 3.9, 21.5]
target = [-0.9, 2.6, 14.0]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 1.2
exposure = 1.0
vignette_enabled = true
vignette_intensity = 0.3
ssao_enabled = true
ssao_radius = 0.5
ssao_intensity = 0.6

[post_process.styles.ascii]
scope = "entities"
cell = 8

[entities.sky]
[entities.sky.sky]
zenith_color = [0.16, 0.30, 0.58, 1.0]
horizon_color = [0.86, 0.72, 0.52, 1.0]
haze_color = [0.95, 0.80, 0.60, 0.7]
cloud_tint = [1.0, 0.90, 0.78, 0.8]
cloud_coverage = 0.3
sun_glow = 1.4

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.directional_light]
direction = [0.6, -0.5, 0.35]
color = [1.0, 0.88, 0.70]
intensity = 2.4

[entities.fill]
[entities.fill.transform]
position = [0, 30, 0]
[entities.fill.directional_light]
direction = [-0.4, -0.8, -0.4]
color = [0.55, 0.65, 0.85]
intensity = 0.4

# --- In glyphs: the ground ---

[entities.ground]
archetype = "terrain"
[entities.ground.transform]
position = [-32, 0, -32]
[entities.ground.terrain]
heightmap = "terrain/heightmap.png"
splat_map = "terrain/splatmap.png"
layer0_texture = "terrain/grass.png"
layer1_texture = "terrain/dirt.png"
layer2_texture = "terrain/rock.png"
layer3_texture = "terrain/sand.png"
width = 64.0
depth = 64.0
height_scale = 6.0
chunk_resolution = 64
texture_tile = 8.0
roughness = 0.85
metallic = 0.0
[entities.ground.ascii_style]
color = "tint"
tint = [1.0, 0.72, 0.32]
ramp = "blocks"

# --- Smooth, standing on it ---

[entities.barrel]
archetype = "furniture"
[entities.barrel.transform]
position = [-2.6, 2.72, 13.2]
scale = [0.6, 0.6, 0.6]
[entities.barrel.model]
asset = "barrel"

[entities.table]
archetype = "furniture"
[entities.table.transform]
position = [0.6, 2.2, 15.0]
rotation = [0, -20, 0]
[entities.table.model]
asset = "table"

# --- A styled transparent: the lens ---

[entities.pane]
archetype = "furniture"
[entities.pane.transform]
position = [2.1, 1.85, 17.8]
rotation = [0, 20, 0]
[entities.pane.bounds]
min = [-1.1, 0.0, -0.04]
max = [1.1, 1.6, 0.04]
[entities.pane.material]
color = [0.6, 0.9, 1.0, 1.0]
opacity = 0.35
roughness = 0.1
[entities.pane.ascii_style]
color = "tint"
tint = [0.35, 1.0, 0.45]
ramp = "classic"
