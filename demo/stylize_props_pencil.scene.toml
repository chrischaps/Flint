# Stylize props, pencil only (#386): demo/stylize_props.scene.toml's
# clearing with only its pencil props styled. The cask and crate carry
# style_mask "pencil" (the lid inherits it, the tag opts back out); the
# barrel and YBot are plain, so a change to ASCII leaves the pencil goldens
# alone. The clearing is demo/prefabs/stylize_props.prefab.toml.
#
#   cargo run --bin flint -- render demo/stylize_props_pencil.scene.toml --no-grid --style pencil --output page.png

[scene]
name = "Stylize Props (pencil)"
version = "1.0"
description = "The stylize props with only the pencil props styled, for the pencil goldens (#386)"

[camera]
position = [3.4, 1.7, 9.0]
target = [0.7, 0.7, 4.2]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 1.2
exposure = 1.25
vignette_enabled = true
vignette_intensity = 0.25
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7

[prefabs.props]
template = "stylize_props"
prefix = "props"

[prefabs.props.overrides.cask.style_mask]
style = "pencil"
[prefabs.props.overrides.crate.style_mask]
style = "pencil"

# Unstyled, against its parent's style
[prefabs.props.overrides.tag.style_mask]
enabled = false
