# Showcase film, beat 10_looks: Looks (#435).
# GENERATED by tools/showcase/build_scenes.py from
# demo/film/beats/10_looks.toml and demo/film/set.toml: edit those
# and run it again. Captured by tools/showcase/capture.py; the
# storyboard is docs/design/showcase-film.md.
# Looks (#279): named presets over a scene's whole [post_process]. This
# beat is one camera move captured once per look (`--look`, its takes in
# tools/showcase/film.toml), so the edit can cut between ascii_noir,
# matrix, ink_wash, graphite and watercolor on the same frame of the move.
# The scene itself adds nothing: the look is the whole difference.

[scene]
name = "Film 10: Looks"
version = "1.0"
description = "One move under each built-in look, for match cuts between them (#279)"

[camera]
position = [4.4, 1.7, 3.4]
target = [0.0, 0.75, 0.0]
fov = 44.0

[entities.director]
[entities.director.script]
source = "10_looks.rhai"

# The showcase film's set (#435): a clearing at the end of the day, with a
# still life someone left on a table: a lantern, a mug, a barrel, crates,
# a pale stone ball and a standing stone, and a figure waiting beside it.
# Every beat of the film is this one place, drawn by a different hand.
#
# Not a scene on its own: tools/showcase/build_scenes.py writes each
# demo/film/<beat>.scene.toml as the beat's fragment (beats/<beat>.toml:
# [scene], [camera], [post_process] and any components it adds to these
# entities) followed by this file. Change the set here, then run
#
#   python tools/showcase/build_scenes.py
#
# Entity names matter: the beats' scripts find props by name, and
# per-entity styles seed their noise from names (CLAUDE.md, determinism).

# --- Light ---------------------------------------------------------------

# The set's grade, shared by every beat. Beats add their styles under
# [post_process.styles.<name>] in their fragment (TOML lets a sub-table come
# before its parent), and change anything else from their script.
[post_process]
bloom_enabled = true
bloom_intensity = 0.07
bloom_threshold = 1.0
exposure = 1.05
vignette_enabled = true
vignette_intensity = 0.32
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.75
grade_lift = [0.02, 0.022, 0.035]
grade_gain = [1.06, 0.99, 0.9]

[entities.sky]
[entities.sky.sky]
zenith_color = [0.07, 0.13, 0.32, 1.0]
horizon_color = [0.98, 0.58, 0.32, 1.0]
haze_color = [1.0, 0.66, 0.40, 0.35]
cloud_tint = [1.0, 0.74, 0.58, 0.8]
cloud_coverage = 0.4
cloud_density = 0.3
sun_disc_size = 0.03
sun_glow = 2.2
ambient_sky = [0.20, 0.24, 0.36, 1.0]
ambient_ground = [0.10, 0.075, 0.05, 1.0]

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.directional_light]
direction = [-0.62, -0.30, -0.72]
color = [1.0, 0.74, 0.50]
intensity = 2.8

# One directional light only: the sky's sun disc follows "the first", and
# entities load in no fixed order. The cool fill is the sky's ambient.

