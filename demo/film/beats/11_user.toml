# Styles a game writes (#274, #275, ADR 0112): demo/styles/ holds three,
# each a .shader.toml and one WGSL function, loaded at run time and not
# compiled into the engine. The figure and the ball are projections
# (`hologram`, which reads the style mask); then the script prints the
# whole frame as a risograph, and lays survey contours over it.

[scene]
name = "Film 11: Styles you write"
version = "1.0"
description = "User-authored WGSL styles: hologram props, then risograph and contour frames (#274)"

[camera]
position = [3.4, 1.4, 3.4]
target = [-0.3, 0.8, 0.0]
fov = 42.0

[post_process.styles.hologram]
glow = 0.9

[post_process.styles.risograph]
enabled = false

[post_process.styles.contour_map]
enabled = false

[entities.figure.style_mask]
style = "hologram"

[entities.orb.style_mask]
style = "hologram"
blend = 0.7

[entities.director]
[entities.director.film]
step = -1
[entities.director.script]
source = "11_user.rhai"
