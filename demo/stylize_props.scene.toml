# Stylize props: a small clearing of styled props, framed close, as the
# bench the stylize goldens render (#271,
# crates/flint-cli/tests/golden/stylize.goldens.toml). It is
# demo/style_mask.scene.toml's idea without its grass and its two heavy
# glTFs (the 32 MB bench and the 9.5 MB lantern), which made each capture
# take 20-90 s in a debug build; this one loads in a few seconds, and the
# props fill enough of the frame that a per-entity style's glyphs read.
#
#   cargo run --bin flint -- render demo/stylize_props.scene.toml --style ascii --output props.png
#
# Styles:
#   barrel, ybot      "ascii"   a static glTF mesh and a skinned one
#   cask, crate       "pencil"  another style, so another id
#   lid               inherits "pencil" from the crate it sits on
#   tag               opts back out with enabled = false

[scene]
name = "Stylize Props"
version = "1.0"
description = "A small, fast bench of styled props for the stylize goldens (#271)"

[camera]
position = [3.4, 1.7, 9.0]
target = [0.7, 0.7, 4.2]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 1.2
exposure = 1.25
vignette_enabled = true
vignette_intensity = 0.25
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7

[entities.sky]
[entities.sky.sky]
zenith_color = [0.16, 0.30, 0.58, 1.0]
horizon_color = [0.86, 0.72, 0.52, 1.0]
haze_color = [0.95, 0.80, 0.60, 0.7]
cloud_tint = [1.0, 0.90, 0.78, 0.8]
cloud_coverage = 0.3
sun_glow = 1.4

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.directional_light]
direction = [0.75, -0.38, 0.35]
color = [1.0, 0.86, 0.66]
intensity = 2.4

[entities.fill]
[entities.fill.transform]
position = [0, 30, 0]
[entities.fill.directional_light]
direction = [-0.4, -0.8, -0.4]
color = [0.55, 0.65, 0.85]
intensity = 0.35

[entities.ground]
archetype = "furniture"
[entities.ground.transform]
position = [0, 0, 0]
[entities.ground.bounds]
min = [-60, -0.2, -60]
max = [60, 0, 60]
[entities.ground.material]
color = [0.13, 0.09, 0.055, 1.0]
roughness = 0.95
metallic = 0.0

# --- Styled: "ascii" ---

[entities.barrel]
archetype = "furniture"
[entities.barrel.transform]
position = [1.3, 0.48, 5.6]
rotation = [0, 40, 0]
scale = [0.5, 0.5, 0.5]
[entities.barrel.model]
asset = "barrel"
[entities.barrel.style_mask]
style = "ascii"

# No animator, as in style_mask.scene.toml: at rest it agrees in
# `flint render` and the player (#294, #307)
[entities.ybot]
archetype = "character"
[entities.ybot.transform]
position = [-0.9, 0, 4.0]
rotation = [0, 25, 0]
[entities.ybot.model]
asset = "YBotWithIdle"
[entities.ybot.skeleton]
skin = "Armature"
[entities.ybot.style_mask]
style = "ascii"

# --- Styled: "pencil" ---

[entities.cask]
archetype = "furniture"
[entities.cask.transform]
position = [0.2, 0.48, 4.6]
scale = [0.5, 0.5, 0.5]
[entities.cask.model]
asset = "barrel"
[entities.cask.style_mask]
style = "pencil"

[entities.crate]
archetype = "furniture"
[entities.crate.transform]
position = [1.9, 0.0, 3.6]
rotation = [0, 30, 0]
[entities.crate.bounds]
min = [-0.4, 0.0, -0.4]
max = [0.4, 0.8, 0.4]
[entities.crate.material]
color = [0.55, 0.38, 0.22, 1.0]
roughness = 0.8
[entities.crate.style_mask]
style = "pencil"

# Inherits "pencil" from the crate it sits on
[entities.lid]
archetype = "furniture"
parent = "crate"
[entities.lid.transform]
position = [0.05, 0.8, -0.05]
rotation = [0, 20, 0]
[entities.lid.bounds]
min = [-0.22, 0.0, -0.22]
max = [0.22, 0.3, 0.22]
[entities.lid.material]
color = [0.42, 0.50, 0.30, 1.0]
roughness = 0.7

# --- Unstyled, against its parent's style ---

[entities.tag]
archetype = "furniture"
parent = "crate"
[entities.tag.transform]
position = [-0.27, 0.8, 0.27]
[entities.tag.bounds]
min = [-0.08, 0.0, -0.08]
max = [0.08, 0.16, 0.08]
[entities.tag.material]
color = [0.9, 0.85, 0.6, 1.0]
[entities.tag.style_mask]
enabled = false
