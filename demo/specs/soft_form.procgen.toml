# A pale form on a dusk ground, for judging its silhouette's softness (#582).
#
#   flint render demo/soft_form.scene.toml --schemas schemas --time 2 \
#     --sweep wooze.preset=hard,soft,softest -o soft.png
#
# The held flame of specs/examples/form_living.procgen.toml, lit pale against a
# dark ground with fewer cards and no echoes, so what changes between the
# columns is only the body's outline. `softness` is a run-time knob: this spec
# leaves it at 0, a hard edge, and the scene's presets turn it.

generator = "form_v1"

[meta]
name = "soft_form"
description = "A pale held flame with few cards, for judging edge softness"
version = "1.0.0"
tags = ["living", "form", "abstract"]

[seed]
mode = "fixed"
value = 7

[params]
height = 1.25
radius = 0.26
profile = [0.7, 1.0, 0.92, 0.66, 0.36, 0.0]
round_base = 0.08
round_tip = 0.0
lean = 0.05
curl_deg = 24.0
curl_bias = 2.2
lobes = 0.05
cards = 180
card_size = 0.045
card_aspect = 2.2
card_tilt = 0.3
card_rise = 1.5
body_color = "#D9C7A6"
card_color = "#7A5E45"
bend_deg = 12.0
ripple = 0.8
ripple_waves = 1.6
swell = 0.12
stretch = 0.04

[living]
lineage_seed = 11
step = 0.9
glide = 0.45
stagger = "per_level"
drift = { amplitude = 1.0 }
jitter = { amplitude = 0.03, targets = ["leaf_cards"], step = 0.125, glide = 0.0 }
variance = { amount = 0.8, steady = 0.5, keep_size = true }
echoes = { count = 0 }
