# Woozy Grove's birch: thin, pale and restless, the one that catches the light.
#
#   flint gen demo/specs/grove_birch.procgen.toml --strip -o birch.png

generator = "tree_v1"

[meta]
name = "grove_birch"
description = "A slim pale birch with small yellowing leaves and a crown that won't settle"
version = "1.0.0"
tags = ["tree", "vegetation", "deciduous", "birch", "living", "woozy-grove"]

[seed]
mode = "fixed"
value = 37

[params]
trunk_height = 6.2
trunk_radius_base = 0.16
trunk_radius_top = 0.05
trunk_segments = 12
radial_segments = 8
trunk_curve_noise = 0.2

bark_color_base = "#D8D2C2"
bark_roughness = 0.8
bark_normal_strength = 0.7

branch_method = "lsystem"
lsystem_iterations = 5
branch_start = 0.42
crown_radius = 2.9
branch_angle_min = 22.0
branch_angle_max = 40.0
lsystem_angle_variation = 12.0
branch_length_falloff = 0.72
branch_radius_falloff = 0.55

leaf_style = "billboard"
leaf_density = 0.85
leaves_per_tip = 6
leaf_spread_radius = 0.42
leaf_along_branch_density = 0.65
leaf_along_branch_min_depth = 2
leaf_size = 0.2
leaf_size_variation = 0.3
leaf_color_base = "#A5A82C"
leaf_shades = 4
leaf_color_variation = 0.1
leaf_season = 0.4
leaf_season_variation = 0.14

[living]
lineage_seed = 37
pose_ring = 8
stagger = "per_branch"
drift = { amplitude = 0.4, params = ["branch_angle", "lsystem_tropism", "trunk_curve"] }
jitter = { amplitude = 0.07, targets = ["leaf_cards"], step = 0.125, glide = 0.0 }
variance = { amount = 0.42, steady = 0.75, keep_size = true }
echoes = { count = 4, spread = 1.0, alpha = 0.18 }
