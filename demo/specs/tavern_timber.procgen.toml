# The Rusty Flint's timbers: adzed oak beams, posts and furniture frames,
# nearly black with smoke. The grain runs along the texture's x, so a model
# lays u along a beam's length.
#
#   flint gen demo/specs/tavern_timber.procgen.toml -o demo/textures/tavern/tavern_timber.png

generator = "texture_v1"

[meta]
name = "tavern_timber"
description = "Smoke-darkened, adze-marked oak for beams, posts and frames"
version = "1.0.0"
tags = ["texture", "wood", "beam", "timber", "tavern"]

[seed]
mode = "fixed"
value = 1688

[params]
pattern = "pipeline"
width = 512
height = 512
seamless = true
output_maps = ["albedo", "normal", "roughness"]

# Three wide strips, no seam: only a shade between them.
[[params.ops]]
type = "brick_grid"
columns = 1
rows = 3
stagger = 0.0
gap_width = 0.0
width_variation = 0.0

[[params.ops]]
type = "wave_texture"
output = "rings"
direction = "y"
wave_type = "sine"
scale = 30.0

[[params.ops]]
type = "noise_layer"
output = "wander"
noise_type = "perlin"
frequency = 2.0
octaves = 3
scale_x = 1.0
scale_y = 3.0

[[params.ops]]
type = "domain_warp"
input = "rings"
output = "grain"
warp_x = "wander"
warp_y = "wander"
strength = 0.09

[[params.ops]]
type = "map_range"
input = "grain"
output = "ring_lines"
from_min = 0.7
from_max = 1.0
to_min = 1.0
to_max = 0.5
interpolation = "smoothstep"

# Adze marks: shallow scallops across the grain.
[[params.ops]]
type = "wave_texture"
output = "adze"
direction = "x"
wave_type = "sine"
scale = 9.0

[[params.ops]]
type = "noise_layer"
output = "soot"
noise_type = "simplex"
frequency = 4.0
octaves = 5
scale_x = 1.0
scale_y = 1.0

[[params.ops]]
type = "map_range"
input = "soot"
output = "soot_shade"
from_min = 0.15
from_max = 0.85
to_min = 0.65
to_max = 1.1
interpolation = "smoothstep"

[[params.ops]]
type = "cell_color"
base_color = "#4A3220"
variation = 0.015                        # linear lightness: this oak's is ~0.04

[[params.ops]]
type = "blend"
source = "ring_lines"
target = "r"
mode = "multiply"
strength = 1.0

[[params.ops]]
type = "blend"
source = "ring_lines"
target = "g"
mode = "multiply"
strength = 1.0

[[params.ops]]
type = "blend"
source = "ring_lines"
target = "b"
mode = "multiply"
strength = 1.0

[[params.ops]]
type = "blend"
source = "soot_shade"
target = "r"
mode = "multiply"
strength = 1.0

[[params.ops]]
type = "blend"
source = "soot_shade"
target = "g"
mode = "multiply"
strength = 1.0

[[params.ops]]
type = "blend"
source = "soot_shade"
target = "b"
mode = "multiply"
strength = 1.0

[[params.ops]]
type = "blend"
source = "ring_lines"
target = "height"
mode = "add"
strength = 0.15

[[params.ops]]
type = "blend"
source = "adze"
target = "height"
mode = "add"
strength = 0.12

[[params.ops]]
type = "derive_normal"
strength = 2.0

[[params.ops]]
type = "cell_roughness"
base = 0.78
variation = 0.05
mortar = 0.8
mortar_threshold = 0.0
