# Recolouring an imported model's emission at runtime (#624).
#
# `material_overrides.<material>` takes a table as well as a colour:
# `{ base_color, emissive, emissive_strength }`, each optional. The renderer
# reads it every frame, on the entity and up through its ancestors, so a
# script can change what colour an imported GLB glows without re-importing
# it, and without giving up the scene's lighting to fake it with paint.
#
#   figure_0..4   YBotWithIdle.glb, skinned. Its joints material
#                 (Alpha_Joints_MAT.002) has no emission of its own: the
#                 override gives it some
#   lanterns      Lantern.glb, whose glass glows white through an emissive
#                 texture: the override tints the light, the texture keeps
#                 its pattern
#   moon          a real directional light; nothing here is painted to glow
#
# The script (scripts/emissive_recolor.rhai) walks a palette, a stage every
# 2.5 s, the figures a step behind one another:
#
#   cargo run --bin flint -- render demo/emissive_recolor.scene.toml --scripts --time 0.5 -o glow.png
#   cargo run --bin flint -- render demo/emissive_recolor.scene.toml --scripts --time 0..10 --fps 12 -o glow.gif
#   cargo run --bin flint -- play demo/emissive_recolor.scene.toml
#
# Without --scripts the figures render as imported: grey joints, white glass.

[scene]
name = "Emissive recolour"
version = "1.0"
description = "A script recolours imported models' glow per named material, under real light (#624)"

[camera]
position = [0.0, 1.55, 6.2]
target = [0.0, 1.0, 0.0]
fov = 46.0

[environment]
ambient_sky = [0.05, 0.06, 0.10]
ambient_ground = [0.015, 0.012, 0.012]

[post_process]
bloom_enabled = true
bloom_intensity = 0.10
bloom_threshold = 1.0
exposure = 1.0
vignette_enabled = true
vignette_intensity = 0.4
ssao_enabled = true
ssao_radius = 0.5
ssao_intensity = 0.8

[entities.director]
[entities.director.script]
source = "emissive_recolor.rhai"

[entities.sky]
[entities.sky.sky]
zenith_color = [0.006, 0.008, 0.022, 1.0]
horizon_color = [0.05, 0.03, 0.07, 1.0]
haze_color = [0.16, 0.09, 0.20, 0.6]
cloud_tint = [0.25, 0.20, 0.30, 0.6]
cloud_coverage = 0.2
sun_glow = 0.2
star_opacity = 1.0

[entities.moon]
[entities.moon.transform]
position = [0, 50, 0]
[entities.moon.light]
type = "directional"
direction = [0.45, 0.55, 0.7]
color = [0.62, 0.72, 1.0]
intensity = 1.1

[entities.ground]
archetype = "furniture"
[entities.ground.transform]
position = [0, 0, 0]
[entities.ground.bounds]
min = [-40, -0.2, -40]
max = [40, 0, 40]
[entities.ground.material]
color = [0.06, 0.055, 0.07, 1.0]
roughness = 0.35
metallic = 0.0

# --- The row of figures, one glTF, five lights ---

[entities.figure_0]
archetype = "character"
[entities.figure_0.transform]
position = [-2.4, 0, -0.9]
rotation = [0, 35, 0]
[entities.figure_0.model]
asset = "YBotWithIdle"
[entities.figure_0.skeleton]
skin = "Armature"
[entities.figure_0.material_overrides]
"Alpha_Body_MAT.002" = [0.045, 0.045, 0.055]

