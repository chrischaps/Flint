color = [1.0, 0.80, 0.58]
intensity = 2.9

[entities.fill]
[entities.fill.transform]
position = [0, 30, 0]
[entities.fill.light]
type = "directional"
direction = [-0.4, 0.8, 0.4]
color = [0.52, 0.62, 0.88]
intensity = 0.42

