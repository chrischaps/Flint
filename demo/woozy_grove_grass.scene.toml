# Woozy Grove, with a meadow (#252): the grove of #217 grown over with grass that
# keeps the trees' time. Everything but the meadow is demo/woozy_grove.scene.toml,
# copied, so the two can be flipped between by eye.
#
#   cargo run --release --bin flint -- play demo/woozy_grove_grass.scene.toml
#
# The grass has `"grass.wooze" = true`, so instead of swaying on the wall clock it
# holds and glides on the [wooze] field's beat, read where you stand, and each beat
# its tips are combed by the same world-space noise that moves the bench (shallow
# wooze, #215). Walk into the hush and the meadow slows with the cypress; the
# shiver snaps it with the thorns. The mask is worn along the paths and round the
# bench, and thin under every tree (demo/woozy_grove_grass/make_mask.py).
#
# The comparisons the issue asks for, all from the north path:
#
#   flint render demo/woozy_grove_grass.scene.toml --time 0..4 --fps 12 -o grass.gif
#   flint render demo/woozy_grove_grass.scene.toml --time 3.5 #     --sweep wooze.glide=0,0.4,1 -o glide.png
#
# demo/woozy_grove_grass/README.md lists the variants tried and what to look at.

[scene]
name = "Woozy Grove, with a meadow"
version = "1.0"
description = "The Woozy Grove grown over with grass on the wooze field's clock, combed by its noise each beat"

[wooze]
preset = "linklater"

[[wooze.zone]]
name = "hush"
shape = "box"
center = [18.5, 0, 5.5]
size = [12, 40, 22]
falloff = 6
amplitude = 0.2
step = 1.6
glide = 0.6
jitter = 0.15

[[wooze.zone]]
name = "drowse"
shape = "sphere"
center = [-14.5, 0, 12]
radius = 8
falloff = 6.5
amplitude = 1.0                         # the morph end: all of its drift, not the clearing's half
step = 1.1
glide = 0.9
jitter = 0.4

[[wooze.zone]]
name = "shiver"
shape = "sphere"
center = [-17, 0, -10.5]
radius = 5.5
falloff = 3.5
amplitude = 0.7
step = 0.125
glide = 0.0
jitter = 2.2

# What `flint render` sees: from the north path, at eye height, into the clearing.
[camera]
position = [2.8, 1.65, -4.8]
target = [-1.2, 2.7, 6.5]
fov = 58.0

[environment]
ambient_sky = [0.34, 0.40, 0.52]
ambient_ground = [0.13, 0.10, 0.09]

[post_process]
exposure = 1.0
bloom_enabled = true
bloom_intensity = 0.07
bloom_threshold = 1.15
vignette_enabled = true
vignette_intensity = 0.32
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7
ssao_samples = 16
fog_enabled = true
fog_color = [0.90, 0.70, 0.56]
fog_density = 0.012
fog_start = 14.0
fog_end = 150.0
boil_on = 1                             # at linklater's half second, 12 drawings a second
grade_lift = [0.012, 0.018, 0.03]
grade_gain = [1.05, 1.0, 0.95]

[post_process.styles.kuwahara]
radius = 3                     # 4 looks the same here and costs 4 to 6 ms more at 1080p
sharpness = 8.0
hardness = 6.0
boil = 0.5

[post_process.styles.contour]
width = 1.25
boil = 1.0
fade = 26.0

# --- Light: the last hour, low across the clearing from the north-east, over your shoulder ---

[entities.sky]
[entities.sky.sky]
zenith_color = [0.10, 0.22, 0.44, 1.0]
horizon_color = [0.92, 0.68, 0.50, 1.0]
haze_color = [0.98, 0.72, 0.52, 0.75]
