# --- The meadow (#252): one grass field over the whole floor, on the field's clock ---

[entities.meadow]
[entities.meadow.transform]
position = [-30, 0, -30]                # the mask's minimum corner, at the floor's top
[entities.meadow.grass_ground]
mask = "woozy_grove_grass/mask.png"
width = 60.0
depth = 60.0
scale_by_mask = true
"grass.density" = 42.0
"grass.max_distance" = 46.0             # the fog has the rest
"grass.fade_start" = 34.0
"grass.blade_width" = 0.085
"grass.blade_height" = 0.3
"grass.height_variation" = 0.5
"grass.color_base" = [0.16, 0.19, 0.08]  # the last hour: olive at the root, gold at the tips
"grass.color_tip" = [0.78, 0.62, 0.30]
"grass.color_dry" = [0.86, 0.56, 0.32]
"grass.dry_amount" = 0.4
"grass.wind_direction" = [0.6, 0.0, 0.8]
"grass.wind_speed" = 1.4
"grass.wind_strength" = 0.07
"grass.density_threshold" = 0.06
"grass.wooze" = true
"grass.wooze_amplitude" = 0.14          # metres at the tip, times the field's amplitude
"grass.wooze_wavelength" = 2.5          # a combed patch is about a stride across

