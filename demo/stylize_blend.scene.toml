# Stylize blend (#278): the stylize props with their two ASCII props
# part-way in, for the stylize goldens' blend cases: the barrel dissolved
# half-way (half its cells turned, in patches), the YBot faded to 40%
# glyphs. Since #386 only the ASCII props are styled, as in
# demo/stylize_props_ascii.scene.toml, so a pencil change leaves these
# goldens alone. The clearing is demo/prefabs/stylize_props.prefab.toml.

[scene]
name = "Stylize Blend"
version = "1.0"
description = "The stylize props with their ASCII props part-way in, for the blend golden (#278)"

[camera]
position = [3.4, 1.7, 9.0]
target = [0.7, 0.7, 4.2]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 1.2
exposure = 1.25
vignette_enabled = true
vignette_intensity = 0.25
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7

[prefabs.props]
template = "stylize_props"
prefix = "props"

# #278: half-way dissolved (an ascii_style of its own, no style_mask)
[prefabs.props.overrides.barrel.ascii_style]
blend = 0.5
transition = "dissolve"

# #278: a 40% cross-fade
[prefabs.props.overrides.ybot.style_mask]
style = "ascii"
blend = 0.4
