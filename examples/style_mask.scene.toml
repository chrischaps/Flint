# Style Mask: the mesh meadow's clearing, with some of its props put under
# per-entity styles (#263). The two "ascii" props are drawn in glyphs since
# per-entity ASCII landed (#266; examples/ascii_entities.scene.toml shows it
# off); "pencil" draws nothing yet (#273). What this scene is for is the
# mask itself, the per-pixel style id the scene writes for them:
#
#   cargo run --bin flint -- render examples/style_mask.scene.toml --debug-mode style --output mask.png
#
# Each style is a hue; unstyled pixels are grey; white lines are where one
# id meets another. In it:
#   bench  "ascii"   a static glTF mesh
#   ybot   "ascii"   a skinned mesh (the bone-matrix twin of the mask pass)
#   barrel "pencil"  another style, so another id
#   crate  "pencil"  a procedural box; its child, the lantern, inherits
#   lantern_glass    opts back out with enabled = false
# The grass, the ground and the sky stay unmasked, and grass blades in front
# of a styled prop cut its mask, since the mask tests against scene depth.

[scene]
name = "Style Mask"
version = "1.0"
description = "Props under per-entity styles, to show the entity style mask (#263)"

[camera]
position = [4.2, 1.9, 11.5]
target = [0.4, 0.7, 4.6]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 1.2
exposure = 1.25
vignette_enabled = true
vignette_intensity = 0.25
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7

[entities.sky]
[entities.sky.sky]
zenith_color = [0.16, 0.30, 0.58, 1.0]
horizon_color = [0.86, 0.72, 0.52, 1.0]
haze_color = [0.95, 0.80, 0.60, 0.7]
cloud_tint = [1.0, 0.90, 0.78, 0.8]
cloud_coverage = 0.3
sun_glow = 1.4

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.directional_light]
direction = [0.75, -0.38, 0.35]
color = [1.0, 0.86, 0.66]
intensity = 2.4

[entities.fill]
[entities.fill.transform]
position = [0, 30, 0]
[entities.fill.directional_light]
direction = [-0.4, -0.8, -0.4]
color = [0.55, 0.65, 0.85]
intensity = 0.35

[entities.ground]
archetype = "furniture"
[entities.ground.transform]
position = [0, 0, 0]
[entities.ground.bounds]
min = [-60, -0.2, -60]
max = [60, 0, 60]
[entities.ground.material]
color = [0.13, 0.09, 0.055, 1.0]
roughness = 0.95
metallic = 0.0

[entities.meadow]
[entities.meadow.transform]
position = [-48, 0, -48]
[entities.meadow.grass_ground]
mask = "mesh_meadow/mask.png"
width = 96.0
depth = 96.0
scale_by_mask = true
"grass.density" = 40.0
"grass.max_distance" = 70.0
"grass.fade_start" = 50.0
"grass.blade_width" = 0.2
"grass.blade_height" = 0.45
"grass.height_variation" = 0.4
"grass.color_base" = [0.12, 0.38, 0.08]
"grass.color_tip" = [0.42, 0.70, 0.20]
"grass.color_dry" = [0.62, 0.54, 0.24]
"grass.dry_amount" = 0.3
"grass.wind_direction" = [0.8, 0.0, 0.6]
"grass.wind_speed" = 0.6
"grass.wind_strength" = 0.1
"grass.density_threshold" = 0.05

# --- Styled: "ascii" ---

[entities.bench]
archetype = "furniture"
[entities.bench.transform]
position = [0.4, 0.22, 3.0]
rotation = [0, 15, 0]
scale = [0.01, 0.01, 0.01]
[entities.bench.model]
asset = "wooden_bench"
[entities.bench.style_mask]
style = "ascii"

# No animator: YBotWithIdle's idle clip scales its armature by 100, so a
# scale that's right while it plays is 1 cm tall in `flint render`'s rest
# pose (the tavern NPCs' problem, #294). At rest it agrees in both.
[entities.ybot]
archetype = "character"
[entities.ybot.transform]
position = [-0.9, 0, 4.4]
rotation = [0, 25, 0]
[entities.ybot.model]
asset = "YBotWithIdle"
[entities.ybot.skeleton]
skin = "Armature"
[entities.ybot.style_mask]
style = "ascii"

# --- Styled: "pencil" ---

[entities.barrel]
archetype = "furniture"
[entities.barrel.transform]
position = [2.4, 0.48, 5.4]
scale = [0.5, 0.5, 0.5]
[entities.barrel.model]
asset = "barrel"
[entities.barrel.style_mask]
style = "pencil"

[entities.crate]
archetype = "furniture"
[entities.crate.transform]
position = [2.1, 0.0, 2.6]
rotation = [0, 30, 0]
[entities.crate.bounds]
min = [-0.4, 0.0, -0.4]
max = [0.4, 0.8, 0.4]
[entities.crate.material]
color = [0.55, 0.38, 0.22, 1.0]
roughness = 0.8
[entities.crate.style_mask]
style = "pencil"

# Inherits "pencil" from the crate it sits on
[entities.lantern]
archetype = "furniture"
parent = "crate"
[entities.lantern.transform]
position = [0.0, 0.8, 0.0]
scale = [0.035, 0.035, 0.035]
[entities.lantern.model]
asset = "Lantern"

# --- Unstyled, against its parent's style ---

[entities.lantern_glass]
archetype = "furniture"
parent = "crate"
[entities.lantern_glass.transform]
position = [-0.25, 0.8, 0.25]
[entities.lantern_glass.bounds]
min = [-0.08, 0.0, -0.08]
max = [0.08, 0.16, 0.08]
[entities.lantern_glass.material]
color = [0.9, 0.85, 0.6, 1.0]
[entities.lantern_glass.style_mask]
enabled = false
