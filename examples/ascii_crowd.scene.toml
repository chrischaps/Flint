# ASCII Crowd: 500 pillars, each in glyphs on a grid of its own (#336).
#
#   cargo run --bin flint -- render examples/ascii_crowd.scene.toml --output crowd.png --no-grid
#
# Every pillar carries `ascii_style { grid = "object" }`, which pins its
# cells to its own projected origin, so each is a per-entity variant of
# its own: 500 variants, with style mask ids up to 500. The ASCII pass
# kept its variant table in a uniform of 64 rows and ids below 256, and
# drew the rest like the whole frame (here: smooth, since the scene asks
# only for entities). The table is a storage buffer sized to the frame now.
# The pillars rise and fall in a slow ripple and turn from gold at the
# centre through green and cyan to violet at the rim; the ground under
# them stays smooth. (Generated: 25 x 20 pillars, 1.15 m apart.)

[scene]
name = "ASCII Crowd"
version = "1.0"
description = "500 pillars, each in ASCII on its own object grid (#336)"

[camera]
position = [0.0, 13.0, 25.0]
target = [0.0, 1.0, 0.0]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 1.2
exposure = 1.2
vignette_enabled = true
vignette_intensity = 0.3
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7

[post_process.styles.ascii]
scope = "entities"
cell = 6
background = 0.25
brightness = 0.1

[entities.sky]
[entities.sky.sky]
zenith_color = [0.10, 0.16, 0.36, 1.0]
