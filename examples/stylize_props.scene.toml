# Stylize props: a small clearing of styled props, framed close: the
# quickest place to try a style. It is examples/style_mask.scene.toml's
# idea without its grass and its two heavy glTFs (the 32 MB bench and the
# 9.5 MB lantern), so it loads in a few seconds, and the props fill enough
# of the frame that a per-entity style's glyphs read.
#
#   cargo run --bin flint -- render examples/stylize_props.scene.toml --style ascii --output props.png
#
# Two styles side by side. The clearing itself is
# examples/prefabs/stylize_props.prefab.toml. The stylize goldens render a
# frozen copy of this scene and its one-style siblings from
# tests/fixtures/scenes/ (#386, #763), so change this one freely.
#
# Styles:
#   barrel, ybot      "ascii"   a static glTF mesh and a skinned one
#   cask, crate       "pencil"  another style, so another id
#   lid               inherits "pencil" from the crate it sits on
#   tag               opts back out with enabled = false

[scene]
name = "Stylize Props"
version = "1.0"
description = "A small clearing of props in ASCII and pencil at once (#271)"

[camera]
position = [3.4, 1.7, 9.0]
target = [0.7, 0.7, 4.2]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 1.2
exposure = 1.25
vignette_enabled = true
vignette_intensity = 0.25
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7

[prefabs.props]
template = "stylize_props"
prefix = "props"

[prefabs.props.overrides.barrel.style_mask]
style = "ascii"
[prefabs.props.overrides.ybot.style_mask]
style = "ascii"

[prefabs.props.overrides.cask.style_mask]
style = "pencil"
[prefabs.props.overrides.crate.style_mask]
style = "pencil"

# Unstyled, against its parent's style
[prefabs.props.overrides.tag.style_mask]
enabled = false
