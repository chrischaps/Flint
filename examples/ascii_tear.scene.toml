# ASCII Tear: reality tears over the mesh meadow's clearing, and where it
# passes, the props are text (#397). Nothing else in the frame changes:
# the grass, the ground and the sky stay as they are.
#
#   cargo run --bin flint-player -- examples/ascii_tear.scene.toml
#
# Each prop's ascii_style has `blend_source = "tear"`: its blend is
# multiplied by the reality tear's mask at each pixel. scripts/ascii_tear.rhai
# drives the tear with render mode 6, the tear with no look of its own, so
# the props are the only thing it shows. Mode 1 (Matrix) instead would
# rain code through the same holes, and the props would still turn in them.
#
#   flint render examples/ascii_tear.scene.toml --render-mode 6 --mode-mix 0.5
#
# With no tear on (mode 0, or a mix of 0) a torn prop is at blend 0: its
# style is off, pass and mask skipped. How a tear differs from a blend a
# script ramps: book, concepts/stylize-passes.md.

[scene]
name = "ASCII Tear"
version = "1.0"
description = "Props turn to text only where a reality tear passes over them (#397)"

[camera]
position = [-1.5, 1.6, 8.6]
target = [0.6, 0.6, 3.6]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 1.2
exposure = 1.25
vignette_enabled = true
vignette_intensity = 0.25
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7

# The look every torn prop starts from: green phosphor, cells turning
# whole at the tear's frayed rim. scope = "entities" keeps it off the
# rest of the frame
[post_process.styles.ascii]
scope = "entities"
cell = 7
color = "tint"
tint = [0.35, 1.0, 0.45]
glow = 0.6
brightness = 0.25
background = 0.25

[entities.director]
[entities.director.script]
source = "ascii_tear.rhai"

[entities.sky]
[entities.sky.sky]
zenith_color = [0.16, 0.30, 0.58, 1.0]
horizon_color = [0.86, 0.72, 0.52, 1.0]
haze_color = [0.95, 0.80, 0.60, 0.7]
cloud_tint = [1.0, 0.90, 0.78, 0.8]
cloud_coverage = 0.3
sun_glow = 1.4

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.light]
type = "directional"
direction = [-0.75, 0.38, -0.35]
color = [1.0, 0.86, 0.66]
intensity = 2.4

[entities.fill]
[entities.fill.transform]
position = [0, 30, 0]
[entities.fill.light]
type = "directional"
direction = [0.4, 0.8, 0.4]
color = [0.55, 0.65, 0.85]
intensity = 0.35

[entities.ground]
archetype = "furniture"
[entities.ground.transform]
position = [0, 0, 0]
[entities.ground.bounds]
min = [-60, -0.2, -60]
max = [60, 0, 60]
[entities.ground.material]
color = [0.13, 0.09, 0.055, 1.0]
roughness = 0.95
metallic = 0.0

[entities.meadow]
[entities.meadow.transform]
position = [-48, 0, -48]
[entities.meadow.grass_ground]
mask = "mesh_meadow/mask.png"
width = 96.0
depth = 96.0
scale_by_mask = true
"grass.density" = 40.0
"grass.max_distance" = 70.0
"grass.fade_start" = 50.0
"grass.blade_width" = 0.2
"grass.blade_height" = 0.45
"grass.height_variation" = 0.4
"grass.color_base" = [0.12, 0.38, 0.08]
"grass.color_tip" = [0.42, 0.70, 0.20]
"grass.color_dry" = [0.62, 0.54, 0.24]
"grass.dry_amount" = 0.3
"grass.wind_direction" = [0.8, 0.0, 0.6]
"grass.wind_speed" = 0.6
"grass.wind_strength" = 0.1
"grass.density_threshold" = 0.05

# --- The props the tear turns ---

[entities.ybot]
archetype = "character"
[entities.ybot.transform]
position = [-0.9, 0, 4.4]
rotation = [0, 25, 0]
[entities.ybot.model]
asset = "YBotWithIdle"
[entities.ybot.skeleton]
skin = "Armature"
[entities.ybot.ascii_style]
blend_source = "tear"
transition = "dissolve"

[entities.bench]
archetype = "furniture"
[entities.bench.transform]
position = [0.4, 0.22, 3.0]
rotation = [0, 15, 0]
scale = [0.01, 0.01, 0.01]
[entities.bench.model]
asset = "wooden_bench"
[entities.bench.ascii_style]
blend_source = "tear"
transition = "dissolve"

[entities.barrel]
archetype = "furniture"
[entities.barrel.transform]
position = [2.4, 0.48, 5.4]
scale = [0.5, 0.5, 0.5]
[entities.barrel.model]
asset = "barrel"
[entities.barrel.ascii_style]
blend_source = "tear"
transition = "dissolve"

[entities.barrel_far]
archetype = "furniture"
[entities.barrel_far.transform]
position = [-2.6, 0.48, 1.2]
rotation = [0, 40, 0]
scale = [0.5, 0.5, 0.5]
[entities.barrel_far.model]
asset = "barrel"
[entities.barrel_far.ascii_style]
blend_source = "tear"
transition = "dissolve"

# The crate and its lantern: a style_mask names the source just as a
# style component does, and the lantern inherits it from the crate
[entities.crate]
archetype = "furniture"
[entities.crate.transform]
position = [2.1, 0.0, 2.6]
rotation = [0, 30, 0]
[entities.crate.bounds]
min = [-0.4, 0.0, -0.4]
max = [0.4, 0.8, 0.4]
[entities.crate.material]
color = [0.55, 0.38, 0.22, 1.0]
roughness = 0.8
[entities.crate.style_mask]
style = "ascii"
blend_source = "tear"

[entities.lantern]
archetype = "furniture"
parent = "crate"
[entities.lantern.transform]
position = [0.0, 0.8, 0.0]
scale = [0.035, 0.035, 0.035]
[entities.lantern.model]
asset = "Lantern"
