# Reveal Tear: the clearing as it is, until the picture rips open and the
# world beyond the tear is drawn in pencil (#406). One script call drives
# it, scripts/reveal_tear.rhai:
#
#   tween_post_style_param("pencil", "reveal", 1.0, 4.0, "ease_in_out");
#
#   cargo run --bin flint-player -- examples/reveal_tear.scene.toml
#   cargo run --bin flint -- render examples/reveal_tear.scene.toml --scripts --time 3 --output torn.png
#
#   0 s  live: the clearing, the pencil style at reveal 0
#   1 s  the tear opens from just right of centre and grows for 4 s
#   5 s  all sketch; the edge's teeth were redrawn 12 times a second
#   8 s  pulled back: a wipe brings the live frame in from the right over 3 s
#  12 s  live again, and it starts over
#
# Every style takes `reveal` and the reveal_* keys, as every style takes
# `blend`: the stage draws them. `--style pencil:reveal=0.5` is the still.

[scene]
name = "Reveal Tear"
version = "1.0"
description = "One script call tears the live frame open into a pencil sketch through a ragged, inked edge (#406)"

[camera]
position = [4.2, 1.9, 11.5]
target = [0.4, 0.7, 4.6]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 1.2
exposure = 1.25
vignette_enabled = true
vignette_intensity = 0.25
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7

# The sketch the frame tears into. On, but at reveal 0 none of it shows and
# the chain leaves it out: the frame starts live, byte for byte
[post_process.styles.pencil]
reveal = 0
reveal_shape = "tear"
reveal_x = 0.56
reveal_y = 0.46
reveal_edge = 2.5
# Torn paper (#876): bare paper along the drawn side of the line, and the
# torn edge's shadow on the live frame
reveal_rim = 3
reveal_shadow = 0.4

[entities.director]
[entities.director.story]
beat = 0
[entities.director.script]
source = "reveal_tear.rhai"

