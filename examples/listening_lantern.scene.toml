# A lantern that answers (#583): expression states from outside the process
# move its light, and the window it is drawn in can be asked for the frame.
#
# Each state is a JSON object with a `state` and an `energy` (0 to 1). The
# script eases the flame toward that state's colour and brightness: cool and
# low while listening, a slow violet breath while thinking, warm and bright
# while speaking, a steady amber once settled. Flint doesn't know the words;
# the script does.
#
# Played from a file on the game clock, or from a socket:
#
#   flint play examples/listening_lantern.scene.toml \
#     --expression-timeline examples/listening_lantern.timeline.json
#   flint play examples/listening_lantern.scene.toml --expression-listen 127.0.0.1:7777
#
# With the socket open, a client sends `{"state": "speaking", "energy": 0.8}`
# and then `{"capture": "look.png"}`: the next frame the window presents is
# written to captures/look.png and the client hears back where, with the state
# it showed. `--record out/ --record-fps 8` writes the window's frames as it
# plays (frames.jsonl and frames.ffconcat beside them).

[scene]
name = "Listening Lantern"
description = "A lantern whose light answers expression states from a timeline or a socket; the window can be asked for its frame or record itself"

[environment]
ambient_sky = [0.035, 0.045, 0.08]
ambient_ground = [0.012, 0.012, 0.016]

[camera]
position = [1.6, 1.9, 4.2]
target = [0.0, 0.85, 0.0]
fov = 42.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.06
vignette_enabled = true
vignette_intensity = 0.35

# --- the room ---------------------------------------------------------------

[entities.floor.transform]
position = [0.0, -0.1, 0.0]

[entities.floor.bounds]
min = [-8.0, 0.0, -4.0]
max = [8.0, 0.1, 6.0]

[entities.floor.material]
color = [0.3, 0.26, 0.22, 1.0]
roughness = 0.95

[entities.wall.transform]
position = [0.0, 0.0, -1.6]

[entities.wall.bounds]
min = [-8.0, 0.0, -0.1]
max = [8.0, 5.0, 0.0]

[entities.wall.material]
color = [0.34, 0.32, 0.36, 1.0]
roughness = 1.0

[entities.crate.transform]
position = [0.0, 0.0, 0.0]
rotation = [0.0, 18.0, 0.0]

[entities.crate.bounds]
min = [-0.45, 0.0, -0.45]
max = [0.45, 0.8, 0.45]

[entities.crate.material]
color = [0.5, 0.34, 0.2, 1.0]
roughness = 0.85

# --- the lantern ------------------------------------------------------------

# Its frame turns a little toward the room as it is lit: a vector tween
[entities.lantern.transform]
position = [0.0, 0.8, 0.0]
rotation = [0.0, -40.0, 0.0]

[entities.lantern.bounds]
min = [-0.15, 0.0, -0.15]
max = [0.15, 0.04, 0.15]

[entities.lantern.material]
color = [0.12, 0.11, 0.1, 1.0]
metallic = 0.8
roughness = 0.4

[entities.lantern_top]
parent = "lantern"

[entities.lantern_top.transform]
position = [0.0, 0.42, 0.0]

[entities.lantern_top.bounds]
min = [-0.17, 0.0, -0.17]
max = [0.17, 0.05, 0.17]

[entities.lantern_top.material]
color = [0.12, 0.11, 0.1, 1.0]
metallic = 0.8
roughness = 0.4

# The glass: an ember now, a flame once lit (material.emissive)
[entities.glass]
parent = "lantern"

[entities.glass.transform]
position = [0.0, 0.04, 0.0]

[entities.glass.bounds]
min = [-0.11, 0.0, -0.11]
max = [0.11, 0.38, 0.11]

[entities.glass.material]
color = [1.0, 0.85, 0.6, 1.0]
roughness = 0.2
emissive = [0.25, 0.08, 0.02]

# The flame's light: dim and cold until the script lights it
[entities.flame]
parent = "lantern"

[entities.flame.transform]
position = [0.0, 0.25, 0.0]

[entities.flame.light]
type = "point"
color = [0.55, 0.6, 1.0]
intensity = 0.4
range = 9.0
source_radius = 0.08

# --- the one who answers ----------------------------------------------------

[entities.listener.script]
source = "listening_lantern.rhai"
