# Fog veil bench (#513): one living oak with its echoes, close to the camera,
# on a dark stage in thick fog, its crown in front of the far edge of an 80 m
# floor. The fog is drawn from the depth buffer, and the echoes (like glass and
# particles) write none: they used to be fogged as whatever lay behind them, as
# far floor (gone into the fog) below the floor's edge and as unfogged sky above
# it, so a hard line crossed the crown at the horizon. Now each translucent draw
# is fogged at its own depth, and the crown reads as one tree across the edge.
#
#   cargo run --bin flint -- render examples/fog_veil.scene.toml --time 2 \
#     --output fog_veil.png --width 1280 --height 720
#
# The echoes need a moment of the living clock to exist, hence `--time`.

[scene]
name = "Fog Veil Bench"
version = "1.0"
description = "Living-prop echoes in front of a fogged horizon, fogged at their own depth"

[camera]
position = [0.0, 4.6, 7.0]
target = [0.0, 4.4, -20.0]
fov = 62.0

[post_process]
exposure = 1.25
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 1.2
vignette_enabled = true
vignette_intensity = 0.35
fog_enabled = true
fog_color = [0.06, 0.065, 0.09]
fog_density = 0.09
fog_start = 4.0
fog_end = 30.0

[living]
echoes = { count = 6, spread = 0.9, alpha = 0.22 }

[entities.key]
[entities.key.transform]
position = [0, 20, 0]
[entities.key.light]
type = "directional"
direction = [-0.5, 0.7, 0.6]
color = [1.0, 0.88, 0.72]
intensity = 2.2

[entities.rim]
[entities.rim.transform]
position = [0, 20, 0]
[entities.rim.light]
type = "directional"
direction = [0.6, 0.4, -0.7]
color = [0.55, 0.65, 0.95]
intensity = 0.8

# --- The stage: a floor 80 m deep, its far edge behind the crown ---

[entities.floor]
archetype = "furniture"
[entities.floor.transform]
position = [0, 0, 0]
[entities.floor.bounds]
min = [-40, -0.2, -80]
max = [40, 0, 10]
[entities.floor.material]
color = [0.20, 0.19, 0.17, 1.0]
roughness = 0.9
metallic = 0.0

# --- The oak, 4 m from the camera ---

[entities.oak.transform]
position = [0.0, 0.0, 1.5]
rotation = [0.0, 20.0, 0.0]
[entities.oak.model]
asset = "oak_living"
[entities.oak.living_prop]
lineage_seed = 7
