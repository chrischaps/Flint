# ================================================================
#  THE LAMPLIGHTER'S GARDEN (#969)
# ================================================================
#
#  Navigation: at dusk a lamplighter walks a hedge garden lighting its
#  four lanterns in turn. No line runs straight from one lantern to the
#  next: the hedges leave a gap at alternate ends, and the last lantern
#  stands on a terrace whose only way up is a ramp. Each walk is one
#  find_path, round the hedges and up the slope, followed with
#  move_along_path; the way ahead is drawn on the ground.
#
#  The grid is baked from the static colliders (ground, hedges, terrace,
#  ramp, lantern posts) a tile at a time, as the first paths reach them.
#
#  Play:      cargo run --bin flint -- play examples/nav_lamplighter.scene.toml
#  Playtest:  cargo run --bin flint -- playtest examples/nav_lamplighter.scene.toml --exit-after 60
#             (the script calls test_pass once the fourth lantern is lit)
# ================================================================

[scene]
name = "The Lamplighter's Garden"
version = "1.0"
description = "A lamplighter finds its way round hedges and up a ramp to light four lanterns (find_path, move_along_path)"

[camera]
position = [0, 25, -13.5]
target = [0, 0, 0.6]
fov = 50.0

[environment]
ambient_sky = [0.05, 0.06, 0.11]
ambient_ground = [0.02, 0.016, 0.012]

[post_process]
bloom_enabled = true
bloom_intensity = 0.08
bloom_threshold = 1.1
exposure = 1.05
vignette_enabled = true
vignette_intensity = 0.4
ssao_enabled = true
ssao_radius = 0.6

