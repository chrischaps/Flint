# ================================================================
#  SHOWCASE — The Rusty Flint Tavern, painted
# ================================================================
#
#  The integration tavern's room (examples/prefabs/rusty_flint.prefab.toml,
#  shared with examples/phase4_runtime.scene.toml) under a painterly Kuwahara
#  pass, with a game around it: a pause menu and state machine
#  (showcase_controller), a HUD (showcase_hud), a stranger who watches
#  you and, once you've spoken to him, a strange wall beside the hearth
#  that opens on examples/showcase_crucible.scene.toml.
#
#  Launch:  cargo run --bin flint -- play examples/showcase_tavern.scene.toml
#  Look:    flint render examples/showcase_tavern.scene.toml -o showcase.png
#           (the [camera] below looks across the room at the hearth and the wall)
# ================================================================

[scene]
name = "The Rusty Flint Tavern — Showcase"
version = "2.0"
description = "The tavern, painted: pause menu, HUD, a watchful stranger and a hidden passage"

# From beside the posts, across the room to the hearth; the strange wall
# is the cold stone just right of it, the first moonlit window beyond.
[camera]
position = [1.4, 1.7, 3.0]
target = [-6.2, 1.1, -2.0]
fov = 60.0

[environment]
ambient_sky = [0.035, 0.04, 0.06]
ambient_ground = [0.045, 0.03, 0.02]
diffuse_wrap = 0.25
oren_nayar = 0.5

[post_process]
kuwahara_enabled = true
kuwahara_radius = 4        # default 4, max 16 — bigger = more painterly
kuwahara_sharpness = 6.0   # default 8 — lower = softer blending between sectors
kuwahara_hardness = 4.0    # default 8 — lower = broader, smoother strokes
exposure = 1.1
bloom_enabled = true
bloom_intensity = 0.08
bloom_threshold = 0.9
ssao_enabled = true
ssao_radius = 0.45
ssao_intensity = 1.0
ssao_samples = 24
volumetric_enabled = true
volumetric_samples = 64
volumetric_density = 600.0
volumetric_decay = 0.998
volumetric_max_distance = 18.0
vignette_enabled = true
vignette_intensity = 0.45
vignette_smoothness = 0.55
grade_lift = [0.015, 0.01, 0.018]
grade_gamma = [1.0, 0.98, 1.0]
grade_gain = [1.06, 0.98, 0.9]

[prefabs.room]
template = "rusty_flint"
prefix = "tavern"


# ============================================================
#  THE GAME
# ============================================================

[entities.game_controller]

[entities.game_controller.script]
source = "showcase_controller.rhai"

[entities.hud_controller]

[entities.hud_controller.script]
source = "showcase_hud.rhai"

[entities.ambient_controller]

[entities.ambient_controller.transform]
position = [0, 0, 0]

[entities.ambient_controller.script]
source = "ambient_events.rhai"

[entities.showcase_ambience_ctrl]

[entities.showcase_ambience_ctrl.transform]
position = [0, 0, 0]

[entities.showcase_ambience_ctrl.script]
source = "showcase_ambience.rhai"


# ============================================================
#  PLAYER
# ============================================================

# A character starts facing +Z: from the kitchen end, up the whole room.
[entities.player]
archetype = "player"

[entities.player.transform]
position = [0, 1.0, -2.2]

[entities.player.collider]
shape = "capsule"
size = [0.6, 1.8, 0.6]
friction = 0.0
restitution = 0.0

[entities.player.rigidbody]
body_type = "kinematic"
mass = 80.0
gravity_scale = 0.0

[entities.player.character_controller]
move_speed = 5.0
jump_force = 6.0
height = 1.8
radius = 0.3
camera_mode = "first_person"

[entities.player.script]
source = "footsteps.rhai"


# ============================================================
#  THE HALL
# ============================================================

[entities.main_hall]

[entities.main_hall.transform]
position = [0, 0, 0]

# The strange wall: a block of colder, older stone beside the hearth. It
# wakes once the stranger has spoken (showcase_passage.rhai).
[entities.hidden_passage]
archetype = "furniture"
parent = "main_hall"

[entities.hidden_passage.transform]
position = [-6.5, 1.2, -1]

[entities.hidden_passage.bounds]
min = [-0.5, -1.2, -0.5]
max = [0.5, 1.2, 0.5]

[entities.hidden_passage.model]
asset = "tavern_passage_stone"

[entities.hidden_passage.interactable]
enabled = false
interaction_type = "use"
prompt_text = "Strange Wall"
range = 2.5

[entities.hidden_passage.script]
source = "showcase_passage.rhai"

# A cold, violet light over the stranger's corner.
[entities.corner_light]
parent = "main_hall"

[entities.corner_light.transform]
position = [-5.5, 3.2, 8.5]

[entities.corner_light.light]
type = "point"
color = [0.5, 0.4, 0.6]
intensity = 4.0
radius = 5.0


# ============================================================
#  CHARACTERS
# ============================================================

[entities.bartender]
archetype = "character"
parent = "main_hall"

[entities.bartender.transform]
position = [6.0, 0, 0]
rotation = [0, -90, 0]

[entities.bartender.model]
asset = "YBotWithIdle"

[entities.bartender.skeleton]
skin = "Armature"

[entities.bartender.animator]
clip = "mixamo.com.001"
autoplay = true
loop = true
speed = 1.0
playing = true

[entities.bartender.interactable]
prompt_text = "Bartender"
range = 3.5
interaction_type = "talk"
enabled = true

[entities.bartender.script]
source = "npc_bartender.rhai"

[entities.patron_1]
archetype = "character"
parent = "main_hall"

[entities.patron_1.transform]
position = [-1.2, 0, 4.0]
rotation = [0, 200, 0]

[entities.patron_1.model]
asset = "YBotWithIdle"

[entities.patron_1.skeleton]
skin = "Armature"

[entities.patron_1.animator]
clip = "mixamo.com.001"
autoplay = true
loop = true
speed = 0.9
playing = true

[entities.patron_1.interactable]
prompt_text = "Patron"
range = 3.0
interaction_type = "talk"
enabled = true

[entities.patron_1.script]
source = "npc_patron.rhai"

[entities.patron_2]
archetype = "character"
parent = "main_hall"

[entities.patron_2.transform]
position = [-2.8, 0, 5.0]
rotation = [0, 20, 0]

[entities.patron_2.model]
asset = "YBotWithIdle"

[entities.patron_2.skeleton]
skin = "Armature"

[entities.patron_2.animator]
clip = "mixamo.com.001"
autoplay = true
loop = true
speed = 1.1
playing = true

[entities.patron_2.interactable]
prompt_text = "Patron"
range = 3.0
interaction_type = "talk"
enabled = true

[entities.patron_2.script]
source = "npc_patron.rhai"

# The stranger knows about the wall.
[entities.mysterious_stranger]
archetype = "character"
parent = "main_hall"

[entities.mysterious_stranger.transform]
position = [-6.0, 0, 9.0]
rotation = [0, -45, 0]

[entities.mysterious_stranger.model]
asset = "YBotWithIdle"

[entities.mysterious_stranger.skeleton]
skin = "Armature"

[entities.mysterious_stranger.animator]
clip = "mixamo.com.001"
autoplay = true
loop = true
speed = 0.5
playing = true

[entities.mysterious_stranger.interactable]
prompt_text = "Stranger"
range = 4.0
interaction_type = "talk"
enabled = true

[entities.mysterious_stranger.script]
source = "showcase_stranger.rhai"
