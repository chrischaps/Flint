# ASCII Tidepool: a scene to tune a palette and a glyph set in (#323).
#
# The lantern set piece (ascii_lantern.scene.toml, #316) drawn through the
# `tidepool` palette (examples/palettes/tidepool.palette.toml) and the `tidepool`
# glyph set (examples/fonts/tidepool.glyphs.toml). Both hot-reload: open it with
#
#   cargo run --bin flint -- edit examples/ascii_tidepool.scene.toml
#
# then change an ink in the palette or a ramp in the glyph set and save; the
# frame recolours or redraws within a second. A still:
#
#   cargo run --bin flint -- render examples/ascii_tidepool.scene.toml --output tidepool.png --width 1280 --height 720

[scene]
name = "ASCII Tidepool"
version = "1.0"
description = "The lantern set piece in the tidepool palette and glyph set, for tuning both live (#323)"

[camera]
position = [0.15, 0.85, 4.4]
target = [0.0, 0.9, 0.0]
fov = 44.0

[environment]
ambient_sky = [0.025, 0.03, 0.05]
ambient_ground = [0.01, 0.008, 0.006]

[post_process]
bloom_enabled = true
bloom_intensity = 0.06
bloom_threshold = 1.2
exposure = 1.1
vignette_enabled = true
vignette_intensity = 0.35
ssao_enabled = true
ssao_radius = 0.5
ssao_intensity = 0.8

[post_process.styles.ascii]
cell = 8
contrast = 1.5
font = "tidepool"
color = "palette"
palette = "tidepool"
ground = "dim"
background = 0.12
glow = 0.35

# --- Light ---

[entities.sky]
[entities.sky.sky]
zenith_color = [0.0015, 0.002, 0.006, 1.0]
horizon_color = [0.008, 0.004, 0.007, 1.0]
haze_color = [1.0, 0.45, 0.16, 0.85]
cloud_tint = [0.20, 0.10, 0.10, 0.6]
cloud_coverage = 0.15
sun_disc_size = 0.05
sun_glow = 0.6
star_opacity = 1.0
ambient_sky = [0.03, 0.035, 0.06, 1.0]
ambient_ground = [0.01, 0.008, 0.006, 1.0]

# The sun sits low behind the props and shines toward the camera: rims, and
# shadows that run forward across the ground
[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.directional_light]
direction = [0.18, -0.14, 0.97]
color = [1.0, 0.55, 0.25]
intensity = 1.6

# A cool moon from the front right, faint: the figure's face and the barrel's
# right side, a second colour against the lantern's
[entities.moon]
[entities.moon.transform]
position = [0, 40, 0]
[entities.moon.directional_light]
direction = [-0.55, -0.5, -0.67]
color = [0.45, 0.6, 1.0]
intensity = 1.0

[entities.lantern_light]
[entities.lantern_light.transform]
position = [-0.65, 1.35, 1.05]
[entities.lantern_light.point_light]
color = [1.0, 0.68, 0.32]
intensity = 20.0
radius = 6.0

# --- Ground ---

[entities.ground]
archetype = "furniture"
[entities.ground.transform]
position = [0, 0, 0]
[entities.ground.bounds]
min = [-80, -0.2, -80]
max = [80, 0.02, 80]
[entities.ground.material]
color = [0.006, 0.0055, 0.005, 1.0]
roughness = 0.95

# --- Props ---

[entities.crate_low]
archetype = "furniture"
[entities.crate_low.transform]
position = [-1.5, 0.0, 0.4]
rotation = [0, 20, 0]
[entities.crate_low.bounds]
min = [-0.45, 0.0, -0.45]
max = [0.45, 0.9, 0.45]
[entities.crate_low.material]
color = [0.62, 0.44, 0.26, 1.0]
roughness = 0.8

[entities.crate_top]
archetype = "furniture"
[entities.crate_top.transform]
position = [-1.45, 0.9, 0.35]
rotation = [0, -10, 0]
[entities.crate_top.bounds]
min = [-0.3, 0.0, -0.3]
max = [0.3, 0.5, 0.3]
[entities.crate_top.material]
color = [0.70, 0.52, 0.32, 1.0]
roughness = 0.8

[entities.lantern]
archetype = "furniture"
[entities.lantern.transform]
position = [-1.3, 1.4, 0.55]
scale = [0.025, 0.025, 0.025]
[entities.lantern.model]
asset = "Lantern"

[entities.barrel]
archetype = "furniture"
[entities.barrel.transform]
position = [-0.15, 0.5, 0.1]
scale = [0.5, 0.5, 0.5]
[entities.barrel.model]
asset = "barrel"

# No animator: at rest the skinned mesh renders at the same size in
# `flint render` and the player (#294, #307)
[entities.ybot]
archetype = "character"
[entities.ybot.transform]
position = [1.15, 0.02, -0.7]
rotation = [0, -25, 0]
[entities.ybot.model]
asset = "YBotWithIdle"
[entities.ybot.skeleton]
skin = "Armature"
