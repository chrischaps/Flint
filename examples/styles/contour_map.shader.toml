# A user-authored style that reads depth (#274; `contour` until #599 gave
# that name to the built-in ink style): a surveyor's map laid over
# the picture, ink isolines of world height and range rings round the eye.
#
#   flint render examples/user_styles.scene.toml --style contour_map
version = 1
name = "contour_map"
label = "Survey contours"
stage = "display"
shader = "contour_map.wgsl"
inputs = ["depth"]

[params.spacing]
default = 0.1
min = 0.02
max = 2.0
label = "Height step (m)"
help = "World height between two contour lines"

[params.ring]
default = 1.0
min = 0.1
max = 10.0
label = "Distance step (m)"
help = "Distance from the eye between two range rings"

[params.wash]
default = 0.55
min = 0.0
max = 1.0
help = "How much of the picture shows through the map"

[params.ink_r]
default = 0.36
min = 0.0
max = 1.0
[params.ink_g]
default = 0.20
min = 0.0
max = 1.0
[params.ink_b]
default = 0.10
min = 0.0
max = 1.0
