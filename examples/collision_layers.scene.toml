# ================================================================
#  THE SIEVE: COLLISION LAYERS, MESH COLLIDERS, SCALE (#729)
# ================================================================
#
#  A glass tray on the `glass` layer, whose mask meets only `default`.
#  Amber balls (default) land in it; blue balls on the `ghost` layer
#  fall straight through to the slate below, and no contact is made.
#  On the right, a barrel lying in its cradle, whose collider is its
#  model's own triangles (`shape = "mesh"`, from TOML alone, drawn at 0.9
#  scale): green balls land on its staves where they are drawn and roll
#  off the curve, as no box would let them. A crate drawn from a 2 m cube
#  at 0.45 scale holds a white ball on its drawn lid: each collider is the
#  size it is drawn.
#
#  The layers are the checkout's, in the root flint.toml:
#    [project.physics] layers = ["glass", "ghost"]
#
#  Check:  flint-player examples/collision_layers.scene.toml \
#            --frame-step 0.0166667 --screenshot a.png --screenshot-at 5
# ================================================================

[scene]
name = "The Sieve"
version = "1.0"
description = "Collision layers sort two kinds of ball; a barrel's mesh collider and a scaled crate hold theirs at their drawn size"

