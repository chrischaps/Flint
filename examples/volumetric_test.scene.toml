# Volumetric Lighting (God Rays) Test Scene
# Demonstrates god ray shafts from a directional light streaming through
# tall columns and archways, creating visible light beams in shadow gaps.

[scene]
name = "Volumetric Lighting Test"
version = "1.0"
description = "God rays streaming through columns and obstacles"

[camera]
# Inside the colonnade looking through columns toward the sunlight
position = [-3, 2, -5]
target = [4, 3, 4]
fov = 60

[post_process]
bloom_enabled = true
bloom_intensity = 0.08
ssao_enabled = true
ssao_intensity = 1.2
fog_enabled = true
fog_density = 0.008
fog_color = [0.5, 0.55, 0.65]
fog_start = 5.0
fog_height_enabled = true
fog_height_falloff = 0.05
fog_height_origin = 0.0
volumetric_enabled = true
volumetric_samples = 64
volumetric_density = 4.0
volumetric_max_distance = 50.0
volumetric_decay = 0.99
exposure = 0.9

# --- Lights ---

# Strong warm sun from upper-right — volumetric enabled
[entities.sun]
[entities.sun.light]
type = "directional"
direction = [0.6, 1.0, 0.4]
color = [1.0, 0.92, 0.78]
intensity = 3.5
volumetric_intensity = 1.5
volumetric_color = [1.0, 0.9, 0.7]

# Subtle cool fill from the opposite side — no volumetric
[entities.fill_light]
[entities.fill_light.light]
type = "directional"
direction = [-0.5, 0.3, -0.6]
color = [0.3, 0.35, 0.5]
intensity = 0.15

# --- Ground ---

# Large stone floor
[entities.floor]
archetype = "furniture"

[entities.floor.transform]
position = [0, -0.05, 0]

[entities.floor.bounds]
min = [-15, 0, -15]
max = [15, 0.1, 15]

[entities.floor.material]
