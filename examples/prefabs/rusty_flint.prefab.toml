# The Rusty Flint Tavern's room (#295): the hall itself, its hearth, bar
# and furniture, its doors, lights and sounds. Both tavern scenes place it
# once, so the room is written once:
#
#   examples/phase4_runtime.scene.toml    the integration demo (and the web demo's front door)
#   examples/showcase_tavern.scene.toml   the showcase, painterly, with its hidden passage
#
#   [prefabs.room]
#   template = "rusty_flint"
#   prefix = "tavern"
#
# so the entities are tavern_shell, tavern_fireplace, tavern_front_entrance...
# The people (player, bartender, patrons, stranger) and the scripts that run
# the night belong to each scene.
#
# Every model and texture here comes from examples/tools/tavern_build.py (the
# textures from examples/specs/tavern_*.procgen.toml); rebuild with
#
#   python examples/tools/tavern_build.py --textures
#
# The hall: x -6.85..6.85, z -4.85..9.85 inside, floor at 0, ceiling at 4.2,
# all in the hall's own frame (the scenes' main_hall sits at the origin).
# The front door is in the south wall (z = 10), the kitchen door in the north
# (z = -5), the hearth on the west wall, the bar along the east. Moonlight
# comes in through the two west windows; everything else is fire and candle.
# Point lights cast no shadows, so the moon is the one light that draws them.

[prefab]
name = "rusty_flint"
description = "The Rusty Flint Tavern's hall: architecture, furniture, lights and sounds (#295)"


# ============================================================
#  THE HALL
# ============================================================

# Floor, walls (stone below the chair rail, lime plaster above, oak framing),
# windows with diamond leading, beamed ceiling, posts, roof and chimney.
[entities.shell]
transform = { position = [0, 0, 0] }
model = { asset = "tavern_shell" }

# The ground outside, under the hall's own floor.
[entities.ground]
archetype = "floor"
transform = { position = [0, -0.1, 0] }
bounds = { min = [-20, -0.1, -20], max = [20, 0.0, 20] }
rigidbody = { body_type = "static" }
collider = { shape = "box", size = [40, 0.2, 40], friction = 0.8 }
material = { texture = "textures/tavern/tavern_fieldstone_color.jpg", roughness = 0.9, texture_scale = 18.0 }

# The shell draws; these hold the player in. The doorways are 1.5 m wide
# and 2.5 m high, in the middle of the north and south walls.
[entities.wall_north_left]
transform = { position = [-3.875, 2.1, -5] }
rigidbody = { body_type = "static" }
collider = { shape = "box", size = [6.25, 4.2, 0.3] }

[entities.wall_north_right]
