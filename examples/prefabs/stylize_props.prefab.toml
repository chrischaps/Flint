# The stylize props clearing (#271, #386): sky, two lights, the ground and
# six props, none of them styled. examples/stylize_props.scene.toml places
# it once and gives props their styles with overrides (ascii and pencil).
# The stylize goldens' benches place a frozen copy of this prefab,
# tests/fixtures/scenes/prefabs/stylize_props.prefab.toml (#763), so a
# change here moves no golden.
#
# Placed with prefix "props", so the entities are props_barrel, props_ybot...
#
#   [prefabs.props]
#   template = "stylize_props"
#   prefix = "props"
#   [prefabs.props.overrides.barrel.style_mask]
#   style = "ascii"
#
# The props: barrel (a static glTF mesh), ybot (a skinned one), cask
# (the barrel again), crate (a box) with a lid on it, which inherits the
# crate's style, and a tag, which a bench opts back out of it.

[prefab]
name = "stylize_props"
description = "The stylize goldens' clearing of props, unstyled (#271, #386)"

[entities.sky]
[entities.sky.sky]
zenith_color = [0.16, 0.30, 0.58, 1.0]
horizon_color = [0.86, 0.72, 0.52, 1.0]
haze_color = [0.95, 0.80, 0.60, 0.7]
cloud_tint = [1.0, 0.90, 0.78, 0.8]
cloud_coverage = 0.3
sun_glow = 1.4

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.light]
type = "directional"
direction = [-0.75, 0.38, -0.35]
color = [1.0, 0.86, 0.66]
intensity = 2.4

[entities.fill]
[entities.fill.transform]
position = [0, 30, 0]
[entities.fill.light]
type = "directional"
direction = [0.4, 0.8, 0.4]
color = [0.55, 0.65, 0.85]
intensity = 0.35

[entities.ground]
archetype = "furniture"
[entities.ground.transform]
position = [0, 0, 0]
[entities.ground.bounds]
min = [-60, -0.2, -60]
max = [60, 0, 60]
[entities.ground.material]
color = [0.13, 0.09, 0.055, 1.0]
roughness = 0.95
metallic = 0.0

[entities.barrel]
archetype = "furniture"
[entities.barrel.transform]
position = [1.3, 0.48, 5.6]
rotation = [0, 40, 0]
scale = [0.5, 0.5, 0.5]
[entities.barrel.model]
asset = "barrel"

# No animator, as in style_mask.scene.toml: at rest it agrees in
# `flint render` and the player (#294, #307)
[entities.ybot]
archetype = "character"
[entities.ybot.transform]
position = [-0.9, 0, 4.0]
rotation = [0, 25, 0]
[entities.ybot.model]
asset = "YBotWithIdle"
[entities.ybot.skeleton]
skin = "Armature"

[entities.cask]
archetype = "furniture"
[entities.cask.transform]
position = [0.2, 0.48, 4.6]
scale = [0.5, 0.5, 0.5]
[entities.cask.model]
asset = "barrel"

[entities.crate]
archetype = "furniture"
[entities.crate.transform]
position = [1.9, 0.0, 3.6]
rotation = [0, 30, 0]
[entities.crate.bounds]
min = [-0.4, 0.0, -0.4]
max = [0.4, 0.8, 0.4]
[entities.crate.material]
color = [0.55, 0.38, 0.22, 1.0]
roughness = 0.8

[entities.lid]
archetype = "furniture"
parent = "crate"
[entities.lid.transform]
position = [0.05, 0.8, -0.05]
rotation = [0, 20, 0]
[entities.lid.bounds]
min = [-0.22, 0.0, -0.22]
max = [0.22, 0.3, 0.22]
[entities.lid.material]
color = [0.42, 0.50, 0.30, 1.0]
roughness = 0.7

[entities.tag]
archetype = "furniture"
parent = "crate"
[entities.tag.transform]
position = [-0.27, 0.8, 0.27]
[entities.tag.bounds]
min = [-0.08, 0.0, -0.08]
max = [0.08, 0.16, 0.08]
[entities.tag.material]
color = [0.9, 0.85, 0.6, 1.0]
