[scene]
name = "Screen-Space UI Test"
description = "Tests WP6: screen_anchor, ui_fill, ui_text, bitmap font rendering"

[camera]
position = [0, 0, 20]
target = [0, 0, 0]
orthographic = true
ortho_height = 10.0

# ─── Player sprite (moves with arrow keys) ───

[entities.player]
archetype = "custom"

[entities.player.transform]
position = [0, 0, 0]

[entities.player.sprite]
texture = "textures/placeholder.png"
mode = "sprite2d"
width = 0.8
height = 0.8
tint = [0.2, 0.8, 0.3, 1.0]
layer = 10

[entities.player.rigidbody]
body_type = "dynamic"
gravity_scale = 1.0
mode_2d = true

[entities.player.collider]
shape = "sprite"
friction = 0.3
restitution = 0.0

[entities.player.script]
source = "ui_test.rhai"

# ─── Ground platform ───

[entities.ground]
archetype = "custom"

[entities.ground.transform]
position = [0, -4, 0]

[entities.ground.sprite]
texture = "textures/placeholder.png"
mode = "sprite2d"
width = 20.0
height = 1.0
tint = [0.4, 0.3, 0.2, 1.0]
layer = 5

[entities.ground.rigidbody]
body_type = "static"
mode_2d = true

[entities.ground.collider]
shape = "box"
size = [20, 1, 1]
friction = 0.8

# ─── Health bar background (dark, screen-anchored top-left) ───

[entities.health_bg]
archetype = "custom"

[entities.health_bg.transform]
position = [0, 0, 0]

[entities.health_bg.sprite]
texture = "textures/placeholder.png"
mode = "sprite2d"
width = 3.0
height = 0.4
tint = [0.2, 0.1, 0.1, 0.8]
layer = 100

[entities.health_bg.screen_anchor]
anchor = "top-left"
offset_x = 1.8
offset_y = -0.5

# ─── Health bar fill (green, shrinks with damage) ───

[entities.health_fill]
archetype = "custom"

[entities.health_fill.transform]
position = [0, 0, 0]

[entities.health_fill.sprite]
texture = "textures/placeholder.png"
mode = "sprite2d"
width = 2.8
height = 0.3
tint = [0.1, 0.85, 0.2, 1.0]
layer = 101

[entities.health_fill.screen_anchor]
anchor = "top-left"
offset_x = 1.7
offset_y = -0.5

[entities.health_fill.ui_fill]
value = 1.0
direction = "left_to_right"

# ─── Score text (screen-anchored top-center) ───

[entities.score_text]
archetype = "custom"

[entities.score_text.transform]
position = [0, 0, 0]

[entities.score_text.screen_anchor]
anchor = "top-center"
offset_x = 0.0
offset_y = -0.5

[entities.score_text.ui_text]
font = "fonts/default.font.toml"
text = "SCORE: 0"
size = 0.5
color = [1.0, 1.0, 1.0, 1.0]
align = "center"

# ─── Warmth indicator (screen-anchored bottom-center) ───

[entities.warmth_indicator]
archetype = "custom"

[entities.warmth_indicator.transform]
position = [0, 0, 0]

[entities.warmth_indicator.sprite]
texture = "textures/placeholder.png"
mode = "sprite2d"
width = 1.0
height = 1.0
tint = [1.0, 0.5, 0.1, 0.8]
layer = 100

[entities.warmth_indicator.screen_anchor]
anchor = "bottom-center"
offset_x = 0.0
offset_y = 0.8
