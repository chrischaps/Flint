# ASCII Cuts: the meadow clearing in ASCII, cutting between two shots (#343).
#
# ASCII keeps each cell's colour and glyph from frame to frame (#277), so
# glyphs hold still in motion. After a camera cut that memory is the old
# shot's: without a reset the first frames of the new shot start from the
# old glyphs, and cells whose tone barely changed keep them through the
# hysteresis band. scripts/ascii_cuts.rhai cuts every second; its `mode`
# picks who resets the history:
#
#   "script"  the script calls reset_style_history() at each cut
#   "auto"    the player's own cut detection notices the jump (the default
#             for any scene: a move over 2 m, a turn over 30 degrees or a
#             zoom over 1.25x in a frame, four times faster than the frame
#             before)
#   "none"    neither: set_camera_cut_detection(false) and no call, to see
#             the carry-over
#
# Its `zoom` above 1 makes every cut a punch-in from the FOV alone, the view
# that many times smaller, which the detector catches past 1.25x (#474).
#
#   cargo run --bin flint-player -- examples/ascii_cuts.scene.toml #     --frame-step 0.0166667 --screenshot out/cuts.png --screenshot-every 0.0166667 --exit-after 4

[scene]
name = "ASCII Cuts"
version = "1.0"
description = "The meadow clearing in ASCII cutting between two shots, resetting style history at each cut (#343)"

[camera]
position = [4.2, 2.1, 11.5]
target = [0.6, 0.7, 4.2]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 1.2
exposure = 1.25
vignette_enabled = true
vignette_intensity = 0.25
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7

[post_process.styles.ascii]
cell = 8
ramp = "classic"
color = "source"
temporal = "on"      # "off" draws every frame as if it were the first
smoothing = 0.6      # how much of last frame's cell colour a cell keeps
hysteresis = 0.35    # ramp steps a tone may stray before its glyph changes
dither = 0.0         # grid-fixed ordered dither before the ramp

[entities.camera_rig]
[entities.camera_rig.script]
source = "ascii_cuts.rhai"

[entities.sky]
[entities.sky.sky]
zenith_color = [0.16, 0.30, 0.58, 1.0]
horizon_color = [0.86, 0.72, 0.52, 1.0]
