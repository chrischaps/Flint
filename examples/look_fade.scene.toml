# Look fades (#496): the stylize props' clearing easing from one look to
# the next. scripts/look_fade.rhai holds each look a moment and then calls
# set_look(name, 2.0): graphite's pencil fades out as watercolor's washes
# fade in, the exposure and SSAO ease between the two, and each arrival
# fires `look_faded` to start the next hold. The scene's own keys (its
# exposure and vignette) stay under every look.
#
#   cargo run --bin flint-player -- examples/look_fade.scene.toml
#   cargo run --bin flint-player -- examples/look_fade.scene.toml \
#     --frame-step 0.0333333 --screenshot-every out/fade --exit-after 4
#   cargo run --bin flint -- render examples/look_fade.scene.toml --scripts --time 2.5 -o mid.png
#
# F4 -> Look has a Fade time beside the picker: pick a look with it above
# 0 and the player eases to it too.

[scene]
name = "Look fades"
version = "1.0"
description = "Looks that cross-fade into one another with set_look(name, seconds) (#496)"

[camera]
position = [3.4, 1.7, 9.0]
target = [0.7, 0.7, 4.2]
fov = 50.0

[post_process]
look = "graphite"
exposure = 1.25
vignette_enabled = true
vignette_intensity = 0.25

[entities.director]
[entities.director.script]
source = "look_fade.rhai"

[entities.sky]
[entities.sky.sky]
