# The suite of examples/music_clock.scene.toml (#745): two stems, a pad and a
# bell, on buses the suite names itself. No chart, no [reintegration], no
# judgment windows: music for a scene to keep time by. Stems from
# examples/tools/music_clock.py. Paths are from the project root.
schema_version = 0

[suite]
id = "music-clock"
title = "Music Clock"

[audio]
sample_rate = 22050

[[tempo]]
sample = 0
bpm = 96.0
time_signature = [4, 4]

[[sections]]
name = "dawn"
start_sample = 0

[[sections]]
name = "rise"
start_sample = 220500

[buses.pad]
file = "examples/music/stems/pad.flac"

[buses.bell]
file = "examples/music/stems/bell.flac"
