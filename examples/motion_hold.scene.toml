# Motion on twos (#405): a page drawn in pencil whose lines redraw twelve
# times a second, and three things moving on it.
#
#   ybot           the idle, held on twos: pose and lines change together
#   left pendulum  held on twos (the hold on its anchor holds the bob below)
#   right pendulum the same swing, mirrored, drawn smoothly: the lines boil
#                  at 12 while the bob glides under them, so motion and
#                  drawing read as two things
#
# The two pendulums are the same physics. The hold is the renderer's alone,
# so the held bob swings at 60 Hz in the world and stays the mirror of the
# smooth one; only where it is drawn steps.
#
#   cargo run --bin flint -- play examples/motion_hold.scene.toml
#   cargo run --bin flint-player -- examples/motion_hold.scene.toml --frame-step 0.0208333 --screenshot-every 0.0208333 --screenshot frames/f.png --exit-after 2
#   cargo run --bin flint -- render examples/motion_hold.scene.toml --no-grid --anim-time 0 --time 0..2 --fps 24 -o twos.gif
#
# --motion-hold 12 on any of the three puts the whole frame on twos, the
# smooth pendulum and the post time included (`flint render` runs no
# physics, so there the pendulums hang still). Book: concepts/stylize-passes.md

[scene]
name = "Motion on Twos"
version = "1.0"
description = "Poses and pencil lines held on twos, beside the same swing drawn smoothly (#405)"

[camera]
position = [0.0, 1.9, 6.2]
target = [0.0, 1.6, 0.0]
fov = 48.0

[post_process]
exposure = 1.15
vignette_enabled = true
vignette_intensity = 0.2

# The whole page in pencil, redrawn twelve times a second
[post_process.styles.pencil]
scope = "screen"
spacing = 5.0
wobble = 1.8
contrast = 1.3
boil = 12.0

[entities.sky]
[entities.sky.sky]
zenith_color = [0.80, 0.84, 0.90, 1.0]
horizon_color = [0.96, 0.93, 0.86, 1.0]
haze_color = [0.98, 0.95, 0.88, 0.7]
cloud_coverage = 0.0
sun_glow = 0.6

[entities.sun]
[entities.sun.transform]
position = [0, 30, 0]
[entities.sun.light]
type = "directional"
direction = [-0.5, 0.75, 0.45]
color = [1.0, 0.92, 0.8]
intensity = 2.6

[entities.fill]
[entities.fill.transform]
position = [0, 20, 0]
[entities.fill.light]
type = "directional"
direction = [0.6, 0.5, 0.6]
color = [0.6, 0.68, 0.85]
intensity = 0.45

[entities.floor]
[entities.floor.transform]
position = [0, -0.1, 0]
[entities.floor.bounds]
min = [-12, -0.1, -8]
max = [12, 0.0, 8]
[entities.floor.material]
color = [0.55, 0.52, 0.47, 1.0]
roughness = 0.95
[entities.floor.rigidbody]
body_type = "static"
[entities.floor.collider]
shape = "box"
size = [24, 0.2, 16]

# --- The dancer, held on twos ---------------------------------------------

[entities.ybot]
[entities.ybot.transform]
position = [0.0, 0.0, 0.0]
[entities.ybot.model]
asset = "YBotWithIdle"
[entities.ybot.skeleton]
skin = "Armature"
[entities.ybot.animator]
clip = "mixamo.com.001"
autoplay = true
loop = true
playing = true
[entities.ybot.motion_hold]
rate = 12.0

# --- Left pendulum, held on twos ------------------------------------------

[entities.left_anchor]
[entities.left_anchor.transform]
position = [-2.6, 3.4, 0]
[entities.left_anchor.bounds]
min = [-0.12, -0.12, -0.12]
max = [0.12, 0.12, 0.12]
[entities.left_anchor.material]
color = [0.3, 0.3, 0.32, 1.0]
roughness = 0.6
[entities.left_anchor.rigidbody]
body_type = "static"
[entities.left_anchor.collider]
shape = "box"
size = [0.24, 0.24, 0.24]
# The hold on the anchor holds everything below it: the bob
[entities.left_anchor.motion_hold]
rate = 12.0

[entities.left_bob]
parent = "left_anchor"
[entities.left_bob.transform]
position = [1.6, 0, 0]
scale = [0.56, 0.56, 0.56]
[entities.left_bob.model]
asset = "Sphere"
[entities.left_bob.material]
color = [0.85, 0.35, 0.22, 1.0]
roughness = 0.5
[entities.left_bob.rigidbody]
body_type = "dynamic"
mass = 2.0
[entities.left_bob.collider]
shape = "sphere"
size = [0.56, 0.56, 0.56]
[entities.left_bob.joint]
type = "hinge"
anchor = [-1.6, 0, 0]
axis = [0, 0, 1]

# --- Right pendulum, the same swing, smooth --------------------------------

[entities.right_anchor]
[entities.right_anchor.transform]
position = [2.6, 3.4, 0]
[entities.right_anchor.bounds]
min = [-0.12, -0.12, -0.12]
max = [0.12, 0.12, 0.12]
[entities.right_anchor.material]
color = [0.3, 0.3, 0.32, 1.0]
roughness = 0.6
[entities.right_anchor.rigidbody]
body_type = "static"
[entities.right_anchor.collider]
shape = "box"
size = [0.24, 0.24, 0.24]

[entities.right_bob]
parent = "right_anchor"
[entities.right_bob.transform]
position = [-1.6, 0, 0]
scale = [0.56, 0.56, 0.56]
[entities.right_bob.model]
asset = "Sphere"
[entities.right_bob.material]
color = [0.22, 0.45, 0.85, 1.0]
roughness = 0.5
[entities.right_bob.rigidbody]
body_type = "dynamic"
mass = 2.0
[entities.right_bob.collider]
shape = "sphere"
size = [0.56, 0.56, 0.56]
[entities.right_bob.joint]
type = "hinge"
anchor = [1.6, 0, 0]
axis = [0, 0, 1]
