# Hearth fire: the campfire's flames and embers cut down to fit the Rusty
# Flint's firebox (1.56 m wide, 1.25 m high), its flames spread along the
# logs instead of rising in one cone.
#
#   [entities.hearth_flames.particle_effect]
#   effect = "hearth_fire"
#
#   flint edit examples/particles/hearth_fire.particles.toml --render out.png --anim-time 1.5

name = "hearth_fire"
seed = 1795

# ------------------------------------------------------------------
#  Flames: short additive tongues licking up off the logs
# ------------------------------------------------------------------
[[emitters]]
name = "flames"
emission_rate = 90.0
max_particles = 160
lifetime = [0.25, 0.6]
speed = [0.5, 1.1]
direction = [0, 1, 0]
spread = 14.0
gravity = [0, 1.2, 0]
blend_mode = "additive"
sort = "none"
size = { keys = [ { t = 0.0, v = [0.15, 0.15] }, { t = 0.35, v = [0.2, 0.3] }, { t = 1.0, v = [0.03, 0.05] } ], interp = "smooth" }
size_scale = [0.7, 1.25]
color = { keys = [ { t = 0.0, v = [1.0, 0.75, 0.25, 0.85] }, { t = 0.5, v = [1.0, 0.32, 0.04, 0.6] }, { t = 1.0, v = [0.35, 0.04, 0.0, 0.0] } ] }
angular_velocity = [-60, 60]

[emitters.shape]
kind = "box"
extents = [0.16, 0.02, 0.4]

[[emitters.forces]]
kind = "noise"
strength = 0.9
frequency = 1.1
speed = 0.6

# ------------------------------------------------------------------
#  Embers: sparks that pop off now and then and climb the flue
# ------------------------------------------------------------------
[[emitters]]
name = "embers"
emission_rate = 0.0
max_particles = 48
lifetime = [0.8, 1.6]
speed = [0.6, 1.3]
spread = 30.0
gravity = [0, 0.6, 0]
damping = 0.5
blend_mode = "additive"
size = { start = [0.018, 0.018], end = [0.0, 0.0] }
color = { start = [1.0, 0.65, 0.25, 1.0], end = [1.0, 0.2, 0.0, 0.0] }

[emitters.shape]
kind = "box"
extents = [0.15, 0.02, 0.35]

[[emitters.bursts]]
time = 0.0
count = [2, 5]
cycles = 0
interval = 0.9
