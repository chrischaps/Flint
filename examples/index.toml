# The examples (#763): every scene under examples/, what it is for, and
# which part of the engine it shows. `flint examples` lists them,
# `flint examples --topic stylize` narrows the list, and
# `flint examples --check` fails when a scene here is missing, a scene on
# disk isn't here, or any of them fails `flint validate`. CI runs the check.
#
# These are curated: improve one freely. Nothing pins their pixels. The
# goldens and CLI tests load frozen copies under tests/fixtures/scenes/,
# so a change here never re-blesses a golden (and a change there is a
# change to a test, made on purpose).
#
# A new example gets an entry; a scene that only a test needs goes in
# tests/fixtures/scenes/ instead. Topics are free text, but keep to the
# ones below so the list groups well:
#
#   showcase   whole scenes to look at or play first
#   rendering  lighting, materials, post-processing, the editor's own views
#   stylize    ASCII, pencil, watercolor, looks and user styles
#   living     living props, the wooze field and the Woozy Grove
#   world      terrain, grass, water and particles
#   runtime    scripting, physics, audio, HUD and input
#   2d         sprites, 2D cameras and 2D collision
#   film       the showcase film's set (tools/showcase, #722)

