# Understudy (#407): a short film in one loop. A wooden drawing mannequin
# waits in a clearing at dusk beside an easel whose page is blank. It
# walks to the page, the picture tears open there, and it crosses into a
# world drawn in pencil, where it moves on twos as the lines do. Then the
# live world is pulled back over it, and the page keeps a little of the
# drawing. Comic panel borders and captions are the HUD's
# (scripts/understudy_hud.rhai); the beats are the director's
# (scripts/understudy.rhai). Nothing in it is copied from anywhere: the
# set is the examples' clearing, the figure is 23 spheres, the lettering
# is Patrick Hand (fonts/, SIL OFL).
#
#   cargo run --bin flint-player -- examples/understudy.scene.toml
#   cargo run --bin flint-player -- examples/understudy.scene.toml --frame-step 0.0416667 --screenshot-every 0.0416667 --screenshot frames/f.png --exit-after 28
#   cargo run --bin flint -- render examples/understudy.scene.toml --scripts --time 13 --no-grid -o drawn.png
#
#    0 s  live: the clearing, the mannequin by the easel
#    4 s  it walks to the page
#    6 s  the page tears open, and the tear grows over the frame for 5 s;
#         from 6.5 s the figure is drawn on twos (motion_hold 12)
#   11 s  all pencil (the rotoscope look); it walks round the clearing
#   18.6 s pulled back: a wipe brings the live frame in from the right
#   21.6 s live, the hold off; then the page is left drawn (a panel reveal)
#   28 s  it starts over
#
# The three pieces of #402 it uses: the rotoscope look (#404) under the
# scene's pencil table, motion_hold (#405) on the figure's root, and the
# reveal (#406), tear, wipe and panel.

[scene]
name = "Understudy"
version = "1.0"
description = "A live clearing tears open at a blank page and a wooden mannequin walks into a world drawn in pencil, and back (#407)"

[camera]
position = [3.0, 1.75, 10.2]
target = [0.2, 0.95, 4.2]
fov = 46.0

# The look lies under the scene's keys (set_look's rule), so the live side
# keeps its bloom, SSAO and vignette and the pencil is the rotoscope's
[post_process]
look = "rotoscope"
bloom_enabled = true
bloom_intensity = 0.06
bloom_threshold = 1.1
exposure = 1.2
vignette_enabled = true
vignette_intensity = 0.3
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7
grade_lift = [0.02, 0.022, 0.035]
grade_gain = [1.06, 0.99, 0.9]

# The sketch the frame tears into, at reveal 0: the frame starts live,
# byte for byte. The director moves reveal, its shape and its origin.
# brightness 0.8: the clearing's dark ground would hatch all over at the
# look's 0.5 (#869)
[post_process.styles.pencil]
brightness = 0.8
reveal = 0
reveal_shape = "tear"
reveal_x = 0.5
reveal_y = 0.45
reveal_edge = 2.5

[entities.director]
[entities.director.story]
beat = -1
[entities.director.script]
source = "understudy.rhai"

[entities.hud_controller]
[entities.hud_controller.script]
source = "understudy_hud.rhai"

