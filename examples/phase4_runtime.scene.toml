# ================================================================
#  PHASE 4 STAGE 5 — Integration Demo: The Rusty Flint Tavern
# ================================================================
#
#  A fully integrated, atmospheric tavern scene bringing together
#  physics, spatial audio, animation, scripting, and HUD overlays.
#
#  Demonstrates:
#    * First-person WASD + mouse controls with physics collisions
#    * Interactable component with per-entity range and HUD prompts
#    * egui crosshair + fade-in/out interaction prompt overlay
#    * Animated doors (open/close via animation clips + sounds)
#    * A chandelier swaying on its chain (a looping animation clip)
#    * NPC behaviors: bartender awareness, patron breathing, stranger freeze
#    * Footstep sounds triggered by movement
#    * Ambient micro-events (glass clinks, fire crackle variations)
#    * Independent flicker scripts on every flame: hearth, sconces, candles
#    * Moonlight through leaded windows: the scene's one shadow caster,
#      with god rays in the air and dust turning in them
#    * A particle hearth fire, bloom, SSAO and a warm grade
#    * Skeletal animation with per-NPC speed and script control
#    * Spatial audio with distance attenuation
#
#  The room (architecture, furniture, lights, doors, sounds) is the prefab
#  examples/prefabs/rusty_flint.prefab.toml, shared with showcase_tavern; its
#  models and textures are built by examples/tools/tavern_build.py (#295).
#
#  Launch:  cargo run --bin flint-player -- examples/phase4_runtime.scene.toml
#     or:   cargo run --bin flint -- play examples/phase4_runtime.scene.toml
#  Look:    flint render examples/phase4_runtime.scene.toml -o tavern.png
#           (the [camera] below frames the room from beside the front door)
#
#  Controls:
#    WASD     - Move          Space  - Jump
#    Mouse    - Look around   Shift  - Sprint
#    E        - Interact      Escape - Release cursor / Exit
#    F1       - Debug modes   F4     - Rendering & Effects
#    F11      - Fullscreen
# ================================================================

[scene]
name = "The Rusty Flint Tavern — Full Integration"
version = "6.0"
description = "Phase 4 Stage 5: atmospheric tavern with physics, audio, animation, scripting, and interactive NPCs"

# Just inside the front door, looking up the room to the hearth: the bar
# on the right, the moonlit west windows on the left.
[camera]
position = [0.6, 1.75, 9.2]
target = [-2.2, 1.2, 1.0]
fov = 62.0

# Night outside, so the ambient is low: firelight and moonlight do the work.
[environment]
ambient_sky = [0.035, 0.04, 0.06]
ambient_ground = [0.045, 0.03, 0.02]
diffuse_wrap = 0.2
oren_nayar = 0.5

[post_process]
exposure = 1.05
bloom_enabled = true
bloom_intensity = 0.06
bloom_threshold = 1.0
ssao_enabled = true
ssao_radius = 0.45
ssao_intensity = 1.1
ssao_samples = 24
volumetric_enabled = true
volumetric_samples = 64
volumetric_density = 600.0
volumetric_decay = 0.998
volumetric_max_distance = 18.0
vignette_enabled = true
vignette_intensity = 0.35
vignette_smoothness = 0.6
grade_lift = [0.012, 0.008, 0.01]
grade_gamma = [1.0, 1.0, 1.02]
grade_gain = [1.04, 0.99, 0.93]
film_grain = 0.02
fxaa = true

# The hall itself: everything that doesn't talk.
[prefabs.room]
template = "rusty_flint"
prefix = "tavern"


# ============================================================
#  PLAYER — the entity you control
# ============================================================

# A character starts facing +Z, so it starts at the kitchen end facing
# the whole room, the front door at the far end.
[entities.player]
archetype = "player"

[entities.player.transform]
position = [0, 1.0, -2.2]

[entities.player.collider]
shape = "capsule"
size = [0.6, 1.8, 0.6]

[entities.player.rigidbody]
body_type = "kinematic"
mass = 80.0
gravity_scale = 0.0

[entities.player.character_controller]
move_speed = 5.0
jump_force = 6.0
height = 1.8
radius = 0.3
camera_mode = "first_person"

[entities.player.script]
source = "footsteps.rhai"


# ============================================================
#  HUD — script-driven crosshair + interaction prompt
# ============================================================

[entities.hud_controller]

[entities.hud_controller.script]
source = "hud_interact.rhai"


# ============================================================
#  AMBIENT CONTROLLER — hidden entity for background events
# ============================================================

[entities.ambient_controller]

[entities.ambient_controller.transform]
position = [0, 0, 0]

[entities.ambient_controller.script]
source = "ambient_events.rhai"


# ============================================================
#  ROOMS — the hall and the rooms off it
# ============================================================

[entities.main_hall]

[entities.main_hall.transform]
position = [0, 0, 0]

[entities.kitchen]
parent = "main_hall"

[entities.kitchen.transform]
position = [0, 0, -8]

[entities.storage]
parent = "main_hall"

[entities.storage.transform]
position = [8, 0, -2]


# ============================================================
#  CHARACTERS — interactive NPCs
# ============================================================

# -- Bartender: behind the bar, alert and attentive --
[entities.bartender]
archetype = "character"
parent = "main_hall"

[entities.bartender.transform]
position = [6.0, 0, 0]
rotation = [90, -90, 0]
scale = [0.015, 0.015, 0.015]

[entities.bartender.model]
asset = "YBotWithIdle"

[entities.bartender.skeleton]
skin = "Armature"

[entities.bartender.animator]
clip = "mixamo.com.001"
autoplay = true
loop = true
speed = 1.0
playing = true

[entities.bartender.interactable]
prompt_text = "Bartender"
range = 3.5
interaction_type = "talk"
enabled = true

[entities.bartender.script]
source = "npc_bartender.rhai"

# -- Patron 1: at table_1, facing patron_2 --
[entities.patron_1]
archetype = "character"
parent = "main_hall"

[entities.patron_1.transform]
position = [-1.2, 0, 4.0]
rotation = [90, 200, 0]
scale = [0.015, 0.015, 0.015]

[entities.patron_1.model]
asset = "YBotWithIdle"

[entities.patron_1.skeleton]
skin = "Armature"

[entities.patron_1.animator]
clip = "mixamo.com.001"
autoplay = true
loop = true
speed = 0.9
playing = true

[entities.patron_1.interactable]
prompt_text = "Patron"
range = 3.0
interaction_type = "talk"
enabled = true

[entities.patron_1.script]
source = "npc_patron.rhai"

# -- Patron 2: across table_1 from patron_1, in the moonlight --
[entities.patron_2]
archetype = "character"
parent = "main_hall"

[entities.patron_2.transform]
position = [-2.8, 0, 5.0]
rotation = [90, 20, 0]
scale = [0.015, 0.015, 0.015]

[entities.patron_2.model]
asset = "YBotWithIdle"

[entities.patron_2.skeleton]
skin = "Armature"

[entities.patron_2.animator]
clip = "mixamo.com.001"
autoplay = true
loop = true
speed = 1.1
playing = true

[entities.patron_2.interactable]
prompt_text = "Patron"
range = 3.0
interaction_type = "talk"
enabled = true

[entities.patron_2.script]
source = "npc_patron.rhai"

# -- Mysterious Stranger: the south-west corner, past every candle --
[entities.mysterious_stranger]
archetype = "character"
parent = "main_hall"

[entities.mysterious_stranger.transform]
position = [-6.0, 0, 9.0]
rotation = [90, -45, 0]
scale = [0.015, 0.015, 0.015]

[entities.mysterious_stranger.model]
asset = "YBotWithIdle"

[entities.mysterious_stranger.skeleton]
skin = "Armature"

[entities.mysterious_stranger.animator]
clip = "mixamo.com.001"
autoplay = true
loop = true
speed = 0.5
playing = true

[entities.mysterious_stranger.interactable]
prompt_text = "Stranger"
range = 4.0
interaction_type = "talk"
enabled = true

[entities.mysterious_stranger.script]
source = "npc_mysterious_stranger.rhai"
