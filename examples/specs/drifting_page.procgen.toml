# A page whose writing reflows (#576): lines of short strokes with nothing
# behind them, the words drifting along their lines as text does when it's
# being set. A word slides out under the right margin and back in under the
# left, a line's width and a word later, and every line keeps its own pace.
#
#   flint render examples/drifting_page.scene.toml --time 0..8 -o page.gif
#   flint render examples/drifting_page.scene.toml --scripts --time 0..12 -o speaking.gif
#
# `row_pace` is metres a second along the lines (0 holds them where they were
# written, and every spec before #576 is that); `row_pace_spread` is how far
# each line's pace differs, drawn once a line by the lineage. At run time
# `[living] row_rate` multiplies it: `tune_living(#{ living: #{ row_rate: 2.0 } })`.
#
# The page itself is chrischaps/Embodiment's (its specs/form-page.procgen.toml,
# chosen at that project's Phase 2 gate), with fewer echoes.

generator = "form_v1"

[meta]
name = "drifting_page"
description = "A thin page made only of its writing, whose words drift along their lines"
version = "1.0.0"
tags = ["living", "form", "rows"]

[seed]
mode = "fixed"
value = 13

[params]
height = 0.95
radius = 0.33
profile = [0.94, 1.0, 1.0, 1.0, 0.97]
round_base = 0.04
round_tip = 0.05
aspect = 0.05
section_deg = 90.0
twist_turns = 0.08
lift = 0.35
curl_deg = 60.0
curl_bias = 2.3
facing_deg = -90.0
lean = 0.0
lobes = 0.0
segments = 12
waves = 4
rings = 120
cards = 2000
card_layout = "rows"
row_faces = "front"
row_spacing = 0.03
row_margin = 0.12
word_gap = 0.013
paragraph_lines = 7.0
# The drift: about a word every second and a half, each line a little apart.
row_pace = 0.03
row_pace_spread = 0.35
card_size = 0.0095
card_aspect = 4.4
card_turn_deg = 1.5
card_lift = 0.004
card_from = 0.07
card_to = 0.93
body_color = "#A39B8E"
body_opacity = 0.0
card_color = "#D8CFC0"
card_shades = 3
bend_deg = 10.0
ripple = 0.6
ripple_waves = 1.0
swell = 0.04
turn_deg = 14.0
stretch = 0.0

[living]
lineage_seed = 17
step = 1.2
glide = 0.55
stagger = "per_level"
drift = { amplitude = 1.0 }
jitter = { amplitude = 0.05, targets = ["leaf_cards"], step = 0.125, glide = 0.0 }
variance = { amount = 0.8, steady = 0.4, keep_size = true }
# An echo is the page a little before or after now, its words where they were
# or will be on their lines: text in motion.
echoes = { count = 4, spread = 0.7, alpha = 0.3 }
echo_blend = "lighten"
