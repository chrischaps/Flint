# The Rusty Flint's floor: wide, old oak boards, darkened by a century of
# spilled ale and boots, lighter where the grain is open.
#
#   flint gen examples/specs/tavern_floor.procgen.toml -o examples/textures/tavern/tavern_floor.png
#     -> tavern_floor_color.png, _normal.png, _roughness.png
#
# examples/tools/tavern_models.py lays it 2.4 m to a tile across the floor and
# shares it with the tabletops, the bar top and the doors.

generator = "texture_v1"

[meta]
name = "tavern_floor"
description = "Wide, worn oak floorboards, dark at the seams"
version = "1.0.0"
tags = ["texture", "wood", "plank", "floor", "tavern"]

[seed]
mode = "fixed"
value = 1795

[params]
pattern = "pipeline"
width = 1024
height = 1024
seamless = true
output_maps = ["albedo", "normal", "roughness"]

# Boards: 8 rows of long planks, joints scattered.
[[params.ops]]
type = "brick_grid"
columns = 2
rows = 8
stagger = 0.41
gap_width = 0.005
width_variation = 0.4

[[params.ops]]
type = "cell_height"
variation = 0.16

# Growth rings, pushed around so they wander.
[[params.ops]]
type = "wave_texture"
output = "rings"
direction = "y"
wave_type = "sine"
scale = 56.0

[[params.ops]]
type = "noise_layer"
output = "wander"
noise_type = "perlin"
frequency = 2.0
octaves = 3
scale_x = 1.0
scale_y = 2.0
cell_offset = true

[[params.ops]]
type = "domain_warp"
input = "rings"
output = "grain"
warp_x = "wander"
warp_y = "wander"
strength = 0.07

[[params.ops]]
type = "map_range"
input = "grain"
output = "ring_lines"
from_min = 0.78
from_max = 1.0
to_min = 1.0
to_max = 0.58
interpolation = "smoothstep"

# Long figure streaks along the boards.
[[params.ops]]
type = "noise_layer"
output = "streaks"
noise_type = "perlin"
frequency = 6.0
octaves = 4
scale_x = 1.0
scale_y = 12.0

# Wear: broad blotches where the boards are scuffed paler or stained dark.
[[params.ops]]
type = "noise_layer"
output = "wear"
noise_type = "simplex"
frequency = 3.0
octaves = 5
scale_x = 1.0
scale_y = 1.0

[[params.ops]]
type = "map_range"
input = "wear"
output = "stain"
from_min = 0.2
from_max = 0.8
to_min = 0.7
to_max = 1.08
interpolation = "smoothstep"

# Each board its own shade of old, dark oak. variation is a step in
# *linear* lightness, and this oak's is only about 0.09: anything past
# ~0.05 clamps some boards to black.
[[params.ops]]
type = "cell_color"
base_color = "#7A5232"
variation = 0.045

[[params.ops]]
type = "blend"
source = "ring_lines"
target = "r"
mode = "multiply"
strength = 1.0

[[params.ops]]
type = "blend"
source = "ring_lines"
target = "g"
mode = "multiply"
strength = 1.0

[[params.ops]]
type = "blend"
source = "ring_lines"
target = "b"
mode = "multiply"
strength = 1.0

[[params.ops]]
type = "blend"
source = "streaks"
target = "r"
mode = "multiply"
strength = 0.4

[[params.ops]]
type = "blend"
source = "streaks"
target = "g"
mode = "multiply"
strength = 0.4

[[params.ops]]
type = "blend"
source = "streaks"
target = "b"
mode = "multiply"
strength = 0.4

[[params.ops]]
type = "blend"
source = "stain"
target = "r"
mode = "multiply"
strength = 1.0

[[params.ops]]
type = "blend"
source = "stain"
target = "g"
mode = "multiply"
strength = 1.0

[[params.ops]]
type = "blend"
source = "stain"
target = "b"
mode = "multiply"
strength = 1.0

# Open pores sink, seams are cut.
[[params.ops]]
type = "blend"
source = "ring_lines"
target = "height"
mode = "add"
strength = 0.1

[[params.ops]]
type = "mortar_groove"
depth = 0.35
width = 0.005

[[params.ops]]
type = "mortar_color"
color = "#1A110A"
threshold = 0.011

[[params.ops]]
type = "derive_normal"
strength = 1.6

[[params.ops]]
type = "cell_roughness"
base = 0.62
variation = 0.1
mortar = 0.9
mortar_threshold = 0.011
