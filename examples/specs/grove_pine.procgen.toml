# Woozy Grove's pine: a Scots pine that lives by noise (#506).
#
# The pine grows by space colonization, which grows a different tree for every
# seed, so it can't regrow a pose the way the grove's oak does. With
# `[living] pose = "noise"` it keeps its own branches and bends them instead:
# each pose turns every segment by smooth noise, so the crown keeps its
# outline while its limbs drift. The params are specs/examples/pine_tree's,
# without its [[lod]]: a skinned rest is one level.
#
#   flint gen examples/specs/grove_pine.procgen.toml --strip -o pine.png
#   flint render examples/noise_trees.scene.toml --time 0..4 --output pine.gif

generator = "tree_v1"

[meta]
name = "grove_pine"
description = "A Scots pine whose limbs drift on noise, since its colonized crown can't regrow"
version = "1.0.0"
tags = ["tree", "vegetation", "conifer", "pine", "living", "woozy-grove"]

[seed]
mode = "fixed"
value = 1907

[params]
trunk_height = 8.0
trunk_radius_base = 0.32
trunk_radius_top = 0.05
trunk_segments = 16
radial_segments = 10
trunk_curve_noise = 0.12

bark_color_base = "#6B4A33"
bark_roughness = 0.9
bark_normal_strength = 1.4
bark_normal_resolution = 256

branch_method = "space_colonization"
branch_start = 0.15
crown_shape = "cone"
crown_radius = 2.6
crown_height_ratio = 3.0
num_attraction_points = 900
influence_distance = 1.8
kill_distance = 0.35
step_size = 0.22
branch_pipe_exponent = 2.6
branch_radial_segments = 6

leaf_style = "mesh"
leaf_density = 1.0
leaves_per_tip = 9
leaf_spread_radius = 0.28
leaf_along_branch_density = 0.7
leaf_along_branch_min_depth = 1
leaf_size = 0.26
leaf_size_variation = 0.3
leaf_color_base = "#2E4A26"
leaf_shades = 5
leaf_color_variation = 0.08
leaf_season = 0.0
leaf_season_variation = 0.02

[living]
lineage_seed = 7
pose_ring = 8
# Bend the branches the tree has, rather than regrow them.
pose = "noise"
# 12 degrees at one standard deviation, swells 3 m apart, lengths within 8%.
noise = { turn = 12.0, wavelength = 3.0, stretch = 0.08 }
# A colonized tree's levels are its branch orders (three on this pine), not
# its growth steps, so per-level stagger still leaves a hold on every beat.
stagger = "per_level"
jitter = { amplitude = 0.05, targets = ["leaf_cards"], step = 0.125, glide = 0.0 }
variance = { amount = 0.35, steady = 0.8, keep_size = true }
echoes = { count = 4, spread = 0.9, alpha = 0.2 }
