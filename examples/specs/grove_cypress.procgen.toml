# Woozy Grove's conifer: a cypress, a dark flame standing at the edge of things.
#
# The space colonization pine in specs/examples can't live, since its structure
# changes with every seed, and the built-in L-system makes too few limbs for a fir's
# whorls. A cypress doesn't want whorls. A short trunk, limbs that barely leave its
# heading and a long reach give a narrow spire, and needles along every limb close it
# up. It is also the tree that has looked like it was wavering since Van Gogh.
#
#   flint gen examples/specs/grove_cypress.procgen.toml --strip -o cypress.png

generator = "tree_v1"

[meta]
name = "grove_cypress"
description = "A narrow dark cypress grown from the L-system, like a flame that holds its place"
version = "1.0.0"
tags = ["tree", "vegetation", "conifer", "cypress", "living", "woozy-grove"]

[seed]
mode = "fixed"
value = 23

[params]
trunk_height = 4.5
trunk_radius_base = 0.2
trunk_radius_top = 0.09
trunk_segments = 8
radial_segments = 8
trunk_curve_noise = 0.06

bark_color_base = "#3B2C25"
bark_roughness = 0.9
bark_normal_strength = 1.4

branch_method = "lsystem"
lsystem_iterations = 5
branch_start = 0.1
crown_radius = 6.5                       # the reach, which here is nearly all height
branch_angle_min = 3.0                   # limbs barely leave the leader
branch_angle_max = 10.0
lsystem_angle_variation = 2.0
branch_length_falloff = 0.72
branch_radius_falloff = 0.6

leaf_style = "mesh"
leaf_density = 1.0
leaves_per_tip = 4
leaf_spread_radius = 0.34
leaf_along_branch_density = 0.75
leaf_along_branch_min_depth = 1
leaf_size = 0.34
leaf_size_variation = 0.3
leaf_color_base = "#1E3A2A"
leaf_shades = 4
leaf_color_variation = 0.07
leaf_season = 0.0
leaf_season_variation = 0.02

[living]
lineage_seed = 23
pose_ring = 8
stagger = "per_level"
drift = { amplitude = 0.3, params = ["branch_angle", "lsystem_tropism", "trunk_curve"] }
jitter = { amplitude = 0.04, targets = ["leaf_cards"], step = 0.125, glide = 0.0 }
variance = { amount = 0.3, steady = 0.85, keep_size = true }
echoes = { count = 3, spread = 0.8, alpha = 0.2 }
