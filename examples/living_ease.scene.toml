# Easing a living prop's knobs (#514): one held flame whose echoes widen and
# gather back, each over two seconds, where a plain tune_living would jump.
# examples/scripts/living_ease.rhai asks `tune_living(map, seconds)`:
#
#   0.5 s: echoes.spread 0.9 -> 1.8 steps, echoes.alpha 0.12 -> 0.35, over 2 s
#   4.0 s: echoes.spread -> 0.3, over 2 s; echoes.count 4 -> 6 at once
#
#   cargo run --bin flint-player -- examples/living_ease.scene.toml
#   cargo run --bin flint -- render examples/living_ease.scene.toml --scripts --time 1.5 -o ease.png
#
# The spec is specs/examples/form_living.procgen.toml.

[scene]
name = "Living Ease"
version = "1.0"
description = "A held flame whose echoes widen and gather back over two seconds each"

[camera]
position = [0.0, 0.75, 3.2]
target = [0.0, 0.68, 0.0]
fov = 36.0

[environment]
ambient_sky = [0.30, 0.34, 0.46]
ambient_ground = [0.10, 0.08, 0.08]

[post_process]
exposure = 1.0
bloom_enabled = true
bloom_intensity = 0.06
bloom_threshold = 1.1
vignette_enabled = true
vignette_intensity = 0.35

[entities.sky]
[entities.sky.sky]
zenith_color = [0.05, 0.07, 0.14, 1.0]
horizon_color = [0.10, 0.09, 0.13, 1.0]
haze_color = [0.14, 0.11, 0.14, 0.4]
cloud_tint = [0.5, 0.45, 0.5, 0.5]
cloud_coverage = 0.2
sun_glow = 0.4

[entities.sun]
[entities.sun.transform]
position = [0, 30, 0]
[entities.sun.light]
type = "directional"
direction = [0.45, 0.6, 0.66]    # toward the light, over the camera's left shoulder
color = [1.0, 0.84, 0.66]
intensity = 2.4

[entities.rim]
[entities.rim.transform]
position = [0, 30, 0]
[entities.rim.light]
type = "directional"
direction = [-0.6, 0.35, -0.7]
color = [0.55, 0.62, 0.95]
intensity = 0.6

[entities.ground]
[entities.ground.transform]
position = [0, 0, 0]
[entities.ground.bounds]
min = [-20, -0.2, -20]
max = [20, 0, 20]
[entities.ground.material]
color = [0.05, 0.045, 0.06, 1.0]
roughness = 0.95
metallic = 0.0

[entities.flame]
[entities.flame.transform]
position = [0.0, 0.0, 0.0]
[entities.flame.model]
asset = "form_living"
[entities.flame.living_prop]
phase_offset = 0.25

[entities.director.script]
source = "living_ease.rhai"
