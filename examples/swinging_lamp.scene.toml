# A lamp on a swinging arm over a yard of stones (#682).
#
# The spot light has no `direction`: it shines down its own entity's -Y,
# so it turns with the arm it hangs from, and the pool of light sweeps
# across the stones as the arm swings. Its cone is written in degrees
# (`inner_angle_deg`, `outer_angle_deg`), like every other angle here.
# It casts (`cast_shadows`, #504), so each stone's shadow swings out from
# under it, opposite the lamp, as the beam passes over.
#
#   flint render examples/swinging_lamp.scene.toml --scripts --time 0..4 --fps 12 -o lamp.gif
#   flint play examples/swinging_lamp.scene.toml

[scene]
name = "Swinging Lamp"
description = "A spot light with no direction follows the arm it hangs from"

[environment]
ambient_sky = [0.035, 0.04, 0.06]
ambient_ground = [0.015, 0.012, 0.01]

[camera]
position = [0.0, 4.2, 9.5]
target = [0.0, 1.6, 0.0]
fov = 50.0

[post_process]
bloom_intensity = 0.06
vignette_intensity = 0.35

# A faint moon, so the stones have an edge outside the beam
[entities.moon.light]
type = "directional"
direction = [-0.4, 0.7, 0.6]
color = [0.55, 0.65, 1.0]
intensity = 0.12

# --- the lamp ---------------------------------------------------------------

# The pivot: a script swings it about z like a pendulum
[entities.arm.transform]
position = [0.0, 5.0, 0.0]

[entities.arm.script]
source = "swing.rhai"

# The rod the lamp hangs from, so the swing can be seen
[entities.rod]
parent = "arm"

[entities.rod.transform]
position = [0.0, -0.8, 0.0]

[entities.rod.bounds]
min = [-0.03, -0.8, -0.03]
max = [0.03, 0.8, 0.03]

[entities.rod.material]
color = [0.2, 0.18, 0.16, 1.0]
roughness = 0.6
metallic = 0.8

# The lamp's housing glows a little
[entities.housing]
parent = "arm"

[entities.housing.transform]
position = [0.0, -1.7, 0.0]

[entities.housing.bounds]
min = [-0.18, -0.12, -0.18]
max = [0.18, 0.12, 0.18]

[entities.housing.material]
color = [1.0, 0.82, 0.55, 1.0]
unlit = true
emissive_scale = 2.5

# The light: no direction, so it follows the arm
[entities.beam]
parent = "arm"

[entities.beam.transform]
position = [0.0, -1.85, 0.0]

[entities.beam.light]
type = "spot"
color = [1.0, 0.85, 0.6]
intensity = 45.0
range = 12.0
inner_angle_deg = 16
outer_angle_deg = 27
source_radius = 0.1
cast_shadows = true

# --- the yard ---------------------------------------------------------------

[entities.ground.transform]
position = [0.0, -0.1, 0.0]

[entities.ground.bounds]
min = [-40.0, 0.0, -40.0]
max = [40.0, 0.1, 12.0]

[entities.ground.material]
color = [0.55, 0.52, 0.47, 1.0]
roughness = 0.95

[entities.stone_a.transform]
position = [-3.2, 0.0, 0.4]
rotation = [0.0, 20.0, 0.0]

[entities.stone_a.bounds]
min = [-0.45, 0.0, -0.35]
max = [0.45, 0.9, 0.35]

[entities.stone_a.material]
color = [0.62, 0.6, 0.58, 1.0]
roughness = 0.9

[entities.stone_b.transform]
position = [-1.1, 0.0, -0.9]
rotation = [0.0, -12.0, 0.0]

[entities.stone_b.bounds]
min = [-0.3, 0.0, -0.3]
max = [0.3, 1.4, 0.3]

[entities.stone_b.material]
color = [0.58, 0.56, 0.55, 1.0]
roughness = 0.9

[entities.stone_c.transform]
position = [1.3, 0.0, 0.8]
rotation = [0.0, 35.0, 0.0]

[entities.stone_c.bounds]
min = [-0.5, 0.0, -0.25]
max = [0.5, 0.6, 0.25]

[entities.stone_c.material]
color = [0.64, 0.61, 0.57, 1.0]
roughness = 0.9

[entities.stone_d.transform]
position = [3.4, 0.0, -0.5]
rotation = [0.0, -28.0, 0.0]

[entities.stone_d.bounds]
min = [-0.35, 0.0, -0.35]
max = [0.35, 1.1, 0.35]

[entities.stone_d.material]
color = [0.6, 0.58, 0.56, 1.0]
roughness = 0.9
