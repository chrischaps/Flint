# Trees that live by noise (#506): a pine and a willow beside the grove's oak.
#
#   flint render examples/noise_trees.scene.toml --time 0..4 --fps 12 --output noise_trees.gif
#   flint play examples/noise_trees.scene.toml
#
# The oak on the left regrows each pose from its shape seed, as every grove tree
# did until now. The pine in the middle grows by space colonization and the
# willow on the right from a text grammar, and neither can regrow: each seed
# grows them a different tree. With `[living] pose = "noise"` in their specs
# (examples/specs/grove_{pine,willow}.procgen.toml) they keep their own branches
# and bend them on smooth noise, so their outlines hold while their limbs drift.
# All three share the clearing's field, light and paint, and one phase offset,
# so they hold and glide on the same beats.

[scene]
name = "Noise Trees"
version = "1.0"
description = "A colonized pine and a grammar willow that live by noise, beside an oak that regrows"

[wooze]
preset = "linklater"

[camera]
position = [0.0, 3.4, -15.5]
target = [0.0, 3.6, 0.0]
fov = 60.0

[environment]
ambient_sky = [0.34, 0.40, 0.52]
ambient_ground = [0.13, 0.10, 0.09]

[post_process]
exposure = 1.0
bloom_enabled = true
bloom_intensity = 0.07
bloom_threshold = 1.15
vignette_enabled = true
vignette_intensity = 0.32
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7
ssao_samples = 16
fog_enabled = true
fog_color = [0.90, 0.70, 0.56]
fog_density = 0.012
fog_start = 14.0
fog_end = 150.0
boil_on = 1
grade_lift = [0.012, 0.018, 0.03]
grade_gain = [1.05, 1.0, 0.95]

[post_process.styles.kuwahara]
radius = 3
sharpness = 8.0
hardness = 6.0
boil = 0.5

[post_process.styles.contour]
width = 1.25
boil = 1.0
fade = 26.0

[entities.sky]
[entities.sky.sky]
zenith_color = [0.10, 0.22, 0.44, 1.0]
horizon_color = [0.92, 0.68, 0.50, 1.0]
haze_color = [0.98, 0.72, 0.52, 0.75]
cloud_tint = [1.0, 0.82, 0.72, 0.8]
cloud_coverage = 0.32
sun_glow = 1.6

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.light]
type = "directional"
direction = [0.5, 0.55, -0.66]    # toward the sun, over the camera's shoulder
color = [1.0, 0.80, 0.58]
intensity = 2.9

[entities.fill]
[entities.fill.transform]
position = [0, 30, 0]
[entities.fill.light]
type = "directional"
direction = [-0.4, 0.8, 0.4]
color = [0.52, 0.62, 0.88]
intensity = 0.42

[entities.ground]
archetype = "furniture"
[entities.ground.transform]
position = [0, 0, 0]
[entities.ground.bounds]
min = [-80, -0.4, -80]
max = [80, 0, 80]
[entities.ground.material]
texture = "grove_floor"
texture_scale = 0.00625
roughness = 0.95
metallic = 0.0
[entities.ground.rigidbody]
body_type = "static"
[entities.ground.collider]
shape = "box"
size = [160, 0.4, 160]
friction = 0.8

[entities.player]
archetype = "player"
[entities.player.transform]
position = [0.0, 1.0, -17.0]
[entities.player.character_controller]
move_speed = 3.6
jump_force = 5.0
camera_mode = "first_person"

# --- Left: the oak, regrowing ---

[entities.oak_regrown.transform]
position = [7.6, 0.0, 2.0]
rotation = [0.0, 20.0, 0.0]
scale = [0.8, 0.8, 0.8]
[entities.oak_regrown.model]
asset = "grove_oak"
[entities.oak_regrown.living_prop]
lineage_seed = 11
phase_offset = 0.25

# --- Middle: the pine, by noise ---

[entities.pine_by_noise.transform]
position = [0.0, 0.0, 3.0]
rotation = [0.0, 0.0, 0.0]
scale = [1.0, 1.0, 1.0]
[entities.pine_by_noise.model]
asset = "grove_pine"
[entities.pine_by_noise.living_prop]
lineage_seed = 7
phase_offset = 0.25

# --- Right: the willow, by noise ---

[entities.willow_by_noise.transform]
position = [-7.4, 0.0, 2.0]
rotation = [0.0, 150.0, 0.0]
scale = [1.0, 1.0, 1.0]
[entities.willow_by_noise.model]
asset = "grove_willow"
[entities.willow_by_noise.living_prop]
lineage_seed = 7
phase_offset = 0.25
