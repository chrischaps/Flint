# Rolling Meadow — grass rendering showcase
# A gentle rolling landscape with wide-open grasslands, late afternoon light

[scene]
name = "Rolling Meadow"
description = "Grass rendering showcase — rolling hills with stylized grass, warm golden-hour lighting"

[camera]
distance = 25.0
pitch = 22.0
yaw = -30.0
target = [0.0, 3.0, 0.0]

# -- Player --

# Capsule player with third-person camera
[entities.player]
archetype = "player"
[entities.player.transform]
position = [0, 12, 0]
[entities.player.character_controller]
move_speed = 6.0
jump_force = 7.0
[entities.player.script]
path = "scripts/third_person_camera.rhai"

# Post-processing: warm golden-hour atmosphere
[post_process]
bloom_enabled = true
bloom_intensity = 0.06
bloom_threshold = 1.2
exposure = 1.3

vignette_enabled = true
vignette_intensity = 0.25

ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.8

fog_enabled = true
fog_color = [0.75, 0.72, 0.65]
fog_density = 0.008
fog_start = 40.0
fog_end = 200.0
fog_height_enabled = true
fog_height_falloff = 0.04
fog_height_origin = 0.0

# -- Lighting --

# Warm directional sun (late afternoon, golden angle)
[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.directional_light]
direction = [-0.5, -0.6, -0.3]
color = [1.0, 0.92, 0.78]
intensity = 2.2

# Cool fill light (sky bounce)
[entities.fill]
[entities.fill.transform]
position = [0, 30, 0]
[entities.fill.directional_light]
direction = [0.3, -0.8, 0.5]
color = [0.6, 0.7, 0.85]
intensity = 0.4

# -- Terrain --

[entities.ground]
archetype = "terrain"
[entities.ground.transform]
position = [-192, 0, -192]
[entities.ground.terrain]
heightmap = "rolling_meadow/heightmap.png"
splat_map = "rolling_meadow/splatmap.png"
layer0_texture = "rolling_meadow/grass.png"
layer1_texture = "rolling_meadow/dirt.png"
layer2_texture = "rolling_meadow/rock.png"
layer3_texture = "rolling_meadow/sand.png"
width = 384.0
depth = 384.0
height_scale = 25.0
chunk_resolution = 64
texture_tile = 20.0
roughness = 0.85
metallic = 0.0
"grass.enabled" = true
"grass.density" = 50.0
"grass.max_distance" = 100.0
"grass.fade_start" = 70.0
"grass.blade_width" = 0.2150000035762787
"grass.blade_height" = 0.4300000071525574
"grass.height_variation" = 0.3499999940395355
"grass.color_base" = [0.11999999731779099, 0.41999998688697815, 0.07999999821186066]
"grass.color_tip" = [0.3499999940395355, 0.7200000286102295, 0.18000000715255737]
"grass.color_dry" = [0.5, 0.47999998927116394, 0.18000000715255737]
"grass.dry_amount" = 0.20000000298023224
"grass.wind_direction" = [0.800000011920929, 0.0, 0.6000000238418579]
"grass.wind_speed" = 0.5
"grass.wind_strength" = 0.09000000357627869
"grass.bend_radius" = 2.5
"grass.bend_strength" = 0.8500000238418579
"grass.density_threshold" = 0.07999999821186066

# -- Props for scale --

