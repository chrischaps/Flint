# Safe-area HUD (#660): a script-drawn title screen and HUD that keep their
# corners out of a phone's notch and home bar with safe_area(), and say
# "TAP" with thumb-sized rows from the first frame with is_touch_device().
# On a desktop the insets are zero and the prompt says ENTER; a phone held
# sideways can be stood in for:
#
#   cargo run --bin flint-player -- examples/safe_area_hud.scene.toml
#   cargo run --bin flint-player -- examples/safe_area_hud.scene.toml \
#     --touch-device --safe-area 47,0,47,21

[scene]
name = "Safe-Area HUD"
version = "1.0"
description = "A HUD inside the safe-area insets, worded for the device in hand (#660)"

[camera]
position = [0, 1.6, 6]
target = [0, 1.2, 0]
fov = 50.0

[entities.hud_controller]
[entities.hud_controller.script]
source = "safe_area_hud.rhai"

[entities.sky]
[entities.sky.sky]
zenith_color = [0.03, 0.02, 0.08, 1.0]
horizon_color = [0.22, 0.08, 0.14, 1.0]
haze_color = [0.30, 0.10, 0.16, 0.6]
cloud_coverage = 0.0
sun_glow = 0.0

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.light]
type = "directional"
direction = [0.4, 0.8, 0.3]
color = [0.9, 0.6, 0.6]
intensity = 0.4
