# HUD glow (#626): wide text strokes and glows, beside what a wide stroke
# used to be. scripts/hud_glow.rhai draws the left numeral the old way
# (the text again at eight compass offsets, which is what `stroke` did at
# every width before #626), the middle one with the same `stroke` now, and
# the right with a `glow`:
#
#   cargo run --bin flint-player -- examples/hud_glow.scene.toml

[scene]
name = "HUD Glow"
version = "1.0"
description = "Round wide strokes and glows on HUD text, beside eight stamped copies (#626)"

[camera]
position = [0, 1.6, 6]
target = [0, 1.2, 0]
fov = 50.0

[entities.hud_controller]
[entities.hud_controller.script]
source = "hud_glow.rhai"

[entities.sky]
[entities.sky.sky]
zenith_color = [0.02, 0.02, 0.06, 1.0]
horizon_color = [0.07, 0.04, 0.12, 1.0]
haze_color = [0.10, 0.05, 0.16, 0.6]
cloud_coverage = 0.0
sun_glow = 0.0

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.light]
type = "directional"
direction = [0.4, 0.8, 0.3]
color = [0.6, 0.5, 0.9]
intensity = 0.4
