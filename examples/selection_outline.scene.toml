# Selection outline bench (#602): one of each kind of thing a person picks
# in `flint edit`, laid out so each can be selected and its outline judged.
#
#   static mesh ........ barrel           (glTF, one primitive)
#   multi-primitive .... lantern          (glTF, several primitives)
#   skinned ............ ybot             (bind pose in a still render)
#   transparent ........ glass            (alpha-blended box)
#   billboard .......... wisp             (camera-facing sprite, alpha cut-out)
#   off-centre pivot ... beam             (box whose pivot is one end)
#   flat ............... rug              (a thin box lying on the ground)
#   mesh-less parent ... cart             (children: cart_bed, cart_wheel_l, cart_wheel_r)
#   occluded ........... crate            (half behind the glass and the barrel)
#
#   cargo run --bin flint -- render examples/selection_outline.scene.toml --no-grid --select cart -o cart.png
#
# The goldens in crates/flint-cli/tests/golden/selection.goldens.toml pin the
# outline on several of these.

[scene]
name = "Selection Outline"
version = "1.0"
description = "One of each kind of selectable entity, for the editor's selection outline (#602)"

[camera]
position = [0.0, 3.6, 8.0]
target = [0.0, 0.8, 0.0]
fov = 50.0

[post_process]
exposure = 1.15
bloom_enabled = true
bloom_intensity = 0.04
bloom_threshold = 1.3
ssao_enabled = true
ssao_radius = 0.5
ssao_intensity = 0.6
fog_enabled = true
fog_density = 0.008
fog_color = [0.62, 0.66, 0.72]

[entities.sun]
[entities.sun.light]
type = "directional"
direction = [0.45, 0.8, 0.35]
color = [1.0, 0.95, 0.88]
intensity = 2.6

[entities.ground]
[entities.ground.transform]
position = [0, -0.05, 0]
[entities.ground.bounds]
min = [-14, 0, -14]
max = [14, 0.05, 14]
[entities.ground.material]
base_color_r = 0.42
base_color_g = 0.44
base_color_b = 0.4
roughness = 0.95

