# ================================================================
#  PHYSICS PILE BENCH (#688)
# ================================================================
#
#  Forty-eight crates dropped from a jittered column into a low
#  walled tray, where they tumble over each other: a dynamic-body
#  pile whose result depends on the order Rapier is given its
#  bodies. That order comes from the world's component index,
#  which is walked in id order, and a scene's ids come from its
#  names, so two runs settle the same way to the bit.
#
#  The crates are written below in a scrambled order on purpose:
#  the file's order is not what decides anything.
#
#  Check:  flint-player examples/physics_pile.scene.toml \
#            --frame-step 0.0166667 --screenshot a.png --screenshot-at 6
#          twice; the two PNGs are byte-identical.
# ================================================================

