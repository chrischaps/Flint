[workspace]
resolver = "2"
members = [
    "crates/flint-core",
    "crates/flint-wooze",
    "crates/flint-geometry",
    "crates/flint-schema",
    "crates/flint-ecs",
    "crates/flint-scene",
    "crates/flint-query",
    "crates/flint-render",
    "crates/flint-constraint",
    "crates/flint-asset",
    "crates/flint-asset-gen",
    "crates/flint-import",
    "crates/flint-pixels",
    "crates/flint-viewer",
    "crates/flint-runtime",
    "crates/flint-physics",
    "crates/flint-player",
    "crates/flint-audio",
    "crates/flint-audio-worklet",
    "crates/flint-music",
    "crates/flint-rhythm",
    "crates/flint-input-capture",
    "crates/flint-animation",
    "crates/flint-script",
    "crates/flint-particles",
    "crates/flint-terrain",
    "crates/flint-debug-ui",
    "crates/flint-procgen",
    "crates/flint-procgen-ai",
    "crates/flint-cli",
    "crates/flint-android",
    "tools/arch-analyzer",
]
# flint-android depends on ndk-sys which only compiles for Android targets.
# Exclude it from default `cargo build`; build with `cargo ndk -p flint-android`.
default-members = [
    "crates/flint-core",
    "crates/flint-wooze",
    "crates/flint-geometry",
    "crates/flint-schema",
    "crates/flint-ecs",
    "crates/flint-scene",
    "crates/flint-query",
    "crates/flint-render",
    "crates/flint-constraint",
    "crates/flint-asset",
    "crates/flint-asset-gen",
    "crates/flint-import",
    "crates/flint-pixels",
    "crates/flint-viewer",
    "crates/flint-runtime",
    "crates/flint-physics",
    "crates/flint-player",
    "crates/flint-audio",
    "crates/flint-audio-worklet",
    "crates/flint-music",
    "crates/flint-rhythm",
    "crates/flint-input-capture",
    "crates/flint-animation",
    "crates/flint-script",
    "crates/flint-particles",
    "crates/flint-terrain",
    "crates/flint-debug-ui",
    "crates/flint-procgen",
    "crates/flint-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Chris"]

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
ab_glyph = "0.2"
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
thiserror = "2.0"
anyhow = "1.0"

# ECS
hecs = "0.10"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Query parsing
pest = "2.7"
pest_derive = "2.7"

# Rendering
wgpu = "30.0.2"
winit = "0.30"
pollster = "0.4"
# Frame profiler scopes: nothing at all without a backend feature (ADR 0109)
profiling = "1.0"
# profiling's Tracy backend uses this version; named here for its features
tracy-client = { version = "0.18", default-features = false }
bytemuck = { version = "1.19", features = ["derive"] }

# File watching
notify = "7.0"
notify-debouncer-mini = "0.5"

# Image decoding and encoding: the formats a game ships, PNG and JPEG
# (glTF's two) and Radiance HDR (skybox panoramas). The web player stops
# here, leaving out exr, tiff, webp, avif and the rest (#123); flint-render
# puts image's defaults back for every native build.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }

# Physics
rapier3d = { version = "0.22", features = ["default"] }

# Audio
# No `cpal` here: the audio device (ALSA on Linux) is flint-audio's and
# flint-music's `device` feature, on by default, off in a headless CLI (#221).
# Without it kira's DefaultBackend is its MockBackend, which they never open.
kira = { version = "0.11", default-features = false, features = ["mp3", "ogg", "flac", "wav"] }
hound = "3.5"
glam = { version = "0.30", features = ["mint"] }

# Scripting
rhai = { version = "1", features = ["sync"] }

# Game loop. std's Instant panics on wasm32 ("time not implemented on this
# platform"); web-time re-exports std's types on native and wraps
# performance.now() / Date.now() on the web.
web-time = "1.1"
# default-features off: gilrs's default Windows backend (WGI) only delivers
# input to the process owning the foreground window — console apps (play-chart,
# the input spike) get nothing. XInput polls regardless of focus. See ADR 0011.
# The backend is picked by target, not feature, everywhere else: evdev on
# Linux, IOKit on macOS, the browser Gamepad API on wasm32. `xinput` is a
# no-op there (rusty-xinput is a Windows-only dep) but must stay on: gilrs-core
# 0.6.7's "needs xinput or wgi" compile_error is not gated to Windows.
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
# Direct motor access for the haptics rumble path: gilrs's high-level ff
# server quantizes commands to a 50 ms tick; gilrs-core's FfDevice is a
# synchronous XInputSetState. Same crate gilrs already depends on. Native
# only (flint-input-capture's rumble path); a browser can't drive motors this way.
gilrs-core = { version = "0.6", default-features = false, features = ["xinput"] }

# Android
android-activity = { version = "0.6", features = ["game-activity"] }
ndk = "0.9"
android_logger = "0.14"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP
ureq = { version = "3", features = ["json"] }

# Utilities
bimap = "0.6"
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4"] }
dirs = "6"
noise = "0.9"
rand = "0.9"
rand_chacha = "0.9"

# Audio probing (validator)
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis", "wav", "pcm", "flac"] }

# glTF
gltf = { version = "1.4", features = ["KHR_materials_emissive_strength", "extras"] }

# File dialogs
rfd = "0.15"

# GUI
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
egui-snarl = "0.12.0"

# Internal crates
flint-core = { path = "crates/flint-core" }
flint-wooze = { path = "crates/flint-wooze" }
flint-geometry = { path = "crates/flint-geometry" }
flint-schema = { path = "crates/flint-schema" }
flint-ecs = { path = "crates/flint-ecs" }
flint-scene = { path = "crates/flint-scene" }
flint-query = { path = "crates/flint-query" }
flint-render = { path = "crates/flint-render" }
flint-constraint = { path = "crates/flint-constraint" }
flint-asset = { path = "crates/flint-asset" }
flint-import = { path = "crates/flint-import" }
flint-pixels = { path = "crates/flint-pixels" }
flint-viewer = { path = "crates/flint-viewer" }
flint-runtime = { path = "crates/flint-runtime" }
flint-physics = { path = "crates/flint-physics" }
# The crates that open devices take default-features = false here, so a
# dependent says which devices it wants (#221): `device` (sound) on
# flint-audio, flint-music and flint-rhythm, `gamepad` on flint-input-capture, and
# `audio` / `gamepad` / `debug-hud` on flint-player.
flint-audio = { path = "crates/flint-audio", default-features = false }
flint-audio-worklet = { path = "crates/flint-audio-worklet" }
flint-music = { path = "crates/flint-music", default-features = false }
flint-rhythm = { path = "crates/flint-rhythm", default-features = false }
flint-input-capture = { path = "crates/flint-input-capture", default-features = false }
flint-animation = { path = "crates/flint-animation" }
flint-script = { path = "crates/flint-script" }
flint-asset-gen = { path = "crates/flint-asset-gen" }
flint-particles = { path = "crates/flint-particles" }
flint-terrain = { path = "crates/flint-terrain" }
flint-procgen = { path = "crates/flint-procgen" }
flint-procgen-ai = { path = "crates/flint-procgen-ai" }
flint-debug-ui = { path = "crates/flint-debug-ui", default-features = false }
flint-player = { path = "crates/flint-player", default-features = false }
flint-android = { path = "crates/flint-android" }

# Debug builds (and tests, which inherit dev) keep only line tables for the
# workspace crates and no debug info for dependencies (#762): a backtrace's
# Flint frames still name file and line, a dependency's frames their function,
# and a debugger sees no locals.
# Measured on the 24-thread machine, a cold worktree `cargo build` plus
# `cargo test --no-run` went from 17.1 GB and 229 s to 6.6 GB and 150 s; most
# of the 17 GB was .pdb files. Stepping through one crate in a debugger with
# its locals: `CARGO_PROFILE_DEV_DEBUG=full cargo build` (workspace crates),
# or a `[profile.dev.package.<dep>] debug = "full"` you don't commit.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# A debug build optimizes what loads a texture (#326), so that `flint render`
# of a scene with a big model takes seconds, not a minute. A debug render of
# examples/style_mask.scene.toml (a 32 MB bench with three 4K textures, a
# 9.5 MB lantern) spent 18.6 of its 21 s loading models: 11.5 s box-filtering
# mip chains, 2.1 s widening RGB to RGBA, 4 s decoding PNG and JPEG, 0.8 s
# hashing the files. The first two moved out of flint-render into
# flint-pixels, a leaf with no dependencies, so the crate agents edit most
# stays unoptimized and quick to rebuild. Below it: the image decoders and
# their inflate and checksum crates, and SHA-256. Not gltf or gltf-json:
# optimized they took 37 s of a cold build, one after the other, and parsing
# and walking a document costs under 0.1 s unoptimized. Optimizing changes no
# pixel: Rust reorders no float maths at any opt-level. After: models load in
# 2.2 s and the render takes 2.6 s against release's 2.1 s, its PNG identical.
# Anything else that walks every texel of a big image on load goes in
# flint-pixels, or a dependency it uses goes on this list.
[profile.dev.package.flint-pixels]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# The web player's build (#123): `trunk build --release --cargo-profile
# web-release` in crates/flint-player, as .github/workflows/play.yml does.
# Every first visit downloads the wasm before the world appears, so it
# trades build time and some speed for bytes. docs/design/web.md (Size) has
# what each line saved. `panic = "abort"` keeps the panic message: the
# console_error_panic_hook flint-web installs runs before the abort.
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

# The AudioWorklet's mixer (#136, crates/flint-audio-worklet): its own small
# wasm, run on the audio thread against a deadline, so it is built for speed,
# not bytes, in every build of the page (Trunk.toml's pre_build hook).
[profile.worklet]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# The web player's hot path, built for speed inside the size-built wasm
# (#137): scripts (rhai, flint-script), the renderer (flint-render, wgpu),
# math (glam), and sound (kira, cpal, symphonia, flint-audio), which decodes
# on the main thread and mixes there where there is no AudioWorklet. The
# overrides survive fat LTO, since LLVM keeps each function's size attributes,
# and they cost 0.45 MB gzipped. On a Pixel 8 Pro they cut scripts by about a
# fifth and frame CPU by about a tenth. docs/design/web.md (Size) has the
# measurements, and why the player and ECS crates aren't on the list.
[profile.web-release.package.kira]
opt-level = 3
[profile.web-release.package.cpal]
opt-level = 3
[profile.web-release.package.symphonia-core]
opt-level = 3
[profile.web-release.package.symphonia-codec-vorbis]
opt-level = 3
[profile.web-release.package.rhai]
opt-level = 3
[profile.web-release.package.flint-script]
opt-level = 3
[profile.web-release.package.flint-render]
opt-level = 3
[profile.web-release.package.flint-audio]
opt-level = 3
[profile.web-release.package.wgpu]
opt-level = 3
[profile.web-release.package.glam]
opt-level = 3

# egui-winit 0.36.2 (and 0.37.0) do not compile for wasm32 (#945): egui 0.36's
# `DroppedFile` trait asks for `bytes_async` there, and egui-winit's
# `NativeFile` implements only `bytes`. vendor/egui-winit is 0.36.2 from
# crates.io with that one function added (src/dropped_file.rs, marked #945);
# nothing else differs. Drop this patch and the folder when Flint moves to an
# egui-winit release whose `NativeFile` implements `bytes_async` on wasm32:
# `bash scripts/wasm-check.sh` without the patch is the test.
#
# mach-dxcompiler-rs is Flint's static DXC (#947): wgpu-hal's `static-dxc`
# calls `mach_dxcompiler_rs::DxcCreateInstance`, and vendor/static-dxc
# answers it with Microsoft's DXC built from source by Flint's own
# workflow (tools/dxc-static), in place of crates.io's crate and its
# prebuilt from a 2023 fork. Not a temporary patch: keep it while Flint
# links DXC.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
mach-dxcompiler-rs = { path = "vendor/static-dxc" }
