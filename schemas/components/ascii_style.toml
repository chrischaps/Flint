[component.ascii_style]
description = "Draws this entity (and its descendants) as ASCII glyphs while the rest of the scene stays smooth (#266). Every field is optional: one left out comes from the scene's [post_process.styles.ascii] table, then the style's default, so a scene sets a look once and an entity changes only what it needs. Entities with equal settings share one style mask id. Static, procedural and skinned meshes are drawn; particles, sprites, grass, terrain and water are not. A descendant's own ascii_style or style_mask wins over its ancestor's. With [post_process.styles.ascii] on, the whole frame is glyphs and `enabled = false` keeps an entity smooth. Book: concepts/stylize-passes.md"

# No field has a default on purpose: the scene loader fills schema defaults
# in, and a filled-in field would hide the scene's own setting.
[component.ascii_style.fields]
enabled = { type = "bool", description = "false keeps this entity and its subtree out of ASCII, even when the scene's style covers the whole frame" }
blend = { type = "f32", min = 0.0, max = 1.0, description = "How much of the ASCII look this entity (and its subtree) is drawn with: 0 its own shading, 1 glyphs (the default when left out). Ramp it from a script with set_style_param(id, \"blend\", x) to fade a prop into text; it rides in the style mask beside the id, so a ramp makes no new variant (#278)" }
transition = { type = "enum", values = ["fade", "dissolve"], description = "How a blend below 1 shows: fade mixes every pixel with the glyphs; dissolve turns that share of the entity's cells to glyphs whole, in patches that grow with the blend" }
cell = { type = "f32", min = 4.0, max = 32.0, description = "Cell width in points; the height follows the font's glyph aspect" }
ramp = { type = "string", description = "A ramp of the scene's glyph set: classic, blocks, minimal or detailed for the built-in set" }
color = { type = "enum", values = ["source", "tint", "raw", "mono", "palette"], description = "Ink colour: source (the surface's hue at full value), tint (one colour), raw (the cell's own colour), mono (white on grey), palette (the inks of `palette`)" }
palette = { type = "string", description = "For color = \"palette\": cga, cga-warm, cga16, phosphor, amber, mono, or a palettes/<name>.palette.toml beside the scene (#276)" }
ground = { type = "enum", values = ["dim", "black", "inverse"], description = "Behind the glyph: dim (the mode's own), black, or inverse (the ink fills the cell and the glyph is cut out)" }
glow = { type = "f32", min = 0.0, max = 2.0, description = "A halo around each glyph, stronger on bright cells (0.6 reads as a phosphor tube)" }
tint = { type = "vec3", description = "Ink colour for color = \"tint\", RGB 0-1; sets the style's tint_r, tint_g and tint_b" }
brightness = { type = "f32", min = -1.0, max = 1.0, description = "Added to the cell's luminance before it picks a glyph" }
contrast = { type = "f32", min = 0.0, max = 4.0, description = "Luminance contrast about mid-grey before it picks a glyph" }
background = { type = "f32", min = 0.0, max = 1.0, description = "How much of the cell's colour shows behind its glyph (0 = black ground)" }
ink = { type = "f32", min = 0.0, max = 2.0, description = "Ink brightness multiplier" }
levels = { type = "f32", min = 0.0, max = 16.0, description = "Tone bands (0 = smooth); a few bands give the drawn look" }
footprint = { type = "f32", min = 1.0, max = 4.0, description = "How many cells wide the colour average for one cell reaches" }
outline = { type = "f32", min = 0.0, max = 4.0, description = "Points of this entity's own pixels, along its silhouette, drawn in full ink (default 1; 0 = off), so legs, rails and wires thinner than a cell keep their shape (#288)" }
min_coverage = { type = "f32", min = 0.0, max = 1.0, description = "The least ink of this entity's pixels in a cell it only grazes, 0..1 (default 0.5)" }
grid = { type = "enum", values = ["screen", "object"], description = "screen: one grid centred on the frame, shared by every styled entity. object: this entity's cells are pinned to its projected origin, so its glyphs hold still while it moves across the screen (they still swim when it turns or comes closer)" }
