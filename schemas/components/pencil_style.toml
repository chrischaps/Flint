[component.pencil_style]
description = "Draws this entity (and its descendants) as a pencil sketch, with hatching, contour lines and paper, while the rest of the scene stays as it is (#273). Every field is optional: one left out comes from the scene's [post_process.styles.pencil] table, then the style's default. Entities with equal settings share one style mask id. Static, procedural and skinned meshes are drawn; particles, sprites, grass, terrain and water are not. A descendant's own pencil_style or style_mask wins over its ancestor's. With [post_process.styles.pencil] on, the whole frame is drawn and `enabled = false` keeps an entity as it is. Book: concepts/stylize-passes.md"

# No field has a default on purpose: the scene loader fills schema defaults
# in, and a filled-in field would hide the scene's own setting (as ascii_style).
[component.pencil_style.fields]
enabled = { type = "bool", description = "false keeps this entity and its subtree out of pencil, even when the scene's style covers the whole frame" }
blend = { type = "f32", min = 0.0, max = 1.0, description = "How much of the pencil look this entity (and its subtree) is drawn with: 0 its own shading, 1 the style's (the default when left out); between, the framework cross-fades (#396). Rides in the style mask beside the id (#278)" }
blend_source = { type = "enum", values = ["own", "tear"], description = "What the blend follows (#397): own (the default) is the blend alone; tear is the blend times the reality tear at each pixel, so the sketch turns only where render modes 1-4 and 6 tear (6 is the tear with no look of its own: only these props show it). With no tear on, the entity draws as at blend 0. Like the blend, the root's, inherited" }
spacing = { type = "f32", min = 2.0, max = 24.0, description = "Hatch line spacing in points" }
thickness = { type = "f32", min = 0.25, max = 4.0, description = "Hatch stroke width in points" }
layers = { type = "f32", min = 0.0, max = 4.0, description = "Hatch layers (0-4); each joins, crossing the last, as the tone darkens" }
angle = { type = "f32", min = 0.0, max = 180.0, description = "The base hatch angle in degrees: every stroke's with direction = screen, the fallback where a surface or tensor direction is unsure" }
direction = { type = "enum", values = ["surface", "screen", "tensor"], description = "Where strokes run: surface (along the surface's iso-depth lines, round a barrel), screen (all at `angle`), tensor (along the picture's luminance edges)" }
brightness = { type = "f32", min = -1.0, max = 1.0, description = "Added to the tone before it picks hatch layers" }
contrast = { type = "f32", min = 0.0, max = 4.0, description = "Tone contrast about mid-grey" }
darkness = { type = "f32", min = 0.0, max = 1.0, description = "How dark one hatch stroke is" }
shade = { type = "f32", min = 0.0, max = 1.0, description = "Soft rubbed graphite under the strokes, in the darks" }
contour = { type = "f32", min = 0.0, max = 2.0, description = "Outline strength (0 = no outlines)" }
contour_width = { type = "f32", min = 0.5, max = 4.0, description = "Outline width in points" }
depth = { type = "f32", min = 0.0, max = 4.0, description = "Sensitivity of outlines to depth steps (silhouettes)" }
grazing = { type = "f32", min = 0.0, max = 1.0, description = "How much a plane seen edge-on is spared silhouette lines: 1 draws a depth step only where the neighbours lie on another surface, so a floor near the horizon is not inked in a band; 0 (the default) draws every depth step (#404)" }
crease = { type = "f32", min = 0.0, max = 4.0, description = "Sensitivity of outlines to creases, where the surface turns" }
detail = { type = "f32", min = 0.0, max = 2.0, description = "Outlines from the picture's own luminance edges (texture detail)" }
wobble = { type = "f32", min = 0.0, max = 8.0, description = "How far lines wander off true, in points" }
sketchy = { type = "f32", min = 0.0, max = 1.0, description = "A second, offset outline beside the first, as quick sketch lines double" }
grain = { type = "f32", min = 0.0, max = 1.0, description = "Paper grain, and how much its tooth breaks the strokes" }
color = { type = "f32", min = 0.0, max = 1.0, description = "0 draws on paper; 1 draws over the entity's own colour (a coloured-pencil look)" }
paper = { type = "vec3", description = "Paper colour, RGB 0-1 display values; sets paper_r, paper_g and paper_b" }
lead = { type = "vec3", description = "Graphite colour, RGB 0-1 display values; sets lead_r, lead_g and lead_b" }
seed = { type = "f32", min = 0.0, max = 9999.0, description = "A different hand: another whole number draws other strokes; the same seed draws the same picture every run" }
boil = { type = "f32", min = 0.0, max = 24.0, description = "Redraws a second, for animated 'boiling' lines (0 = still)" }
grid = { type = "enum", values = ["screen", "object", "world"], description = "screen: hatching fixed to the screen. object: pinned to this entity's projected origin, so its strokes travel with it. world: laid on its surfaces, so they hold as the camera moves (#389)" }
paper_image = { type = "string", description = "A paper image beside the scene (papers/<name>.png, or a path), tiled in points; its relief is the paper's tooth and its hue tints `paper`. \"none\" draws the procedural paper. One paper a frame: the scene table's, else the first entity's (#390)" }
paper_scale = { type = "f32", min = 0.25, max = 8.0, description = "Points one texel of the paper image covers" }
stroke_image = { type = "string", description = "A strip of real pencil strokes (strokes/<name>.png, or a path), stroke_rows of them stacked top to bottom, each drawn left to right; one is stretched along each dash. \"none\" draws the analytic dashes (#390)" }
stroke_rows = { type = "f32", min = 1.0, max = 16.0, description = "How many strokes the stroke image stacks" }
