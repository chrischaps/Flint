[component.collider]
shape = { type = "enum", values = ["box", "sphere", "capsule", "cylinder", "sprite"], default = "box", description = "Collision shape type ('sprite' auto-sizes from sprite component)" }
size = { type = "vec3", default = [1, 1, 1], description = "Shape dimensions (width/height/depth for box, diameter for sphere/capsule, [diameter, height] for a Y-axis cylinder)" }
is_sensor = { type = "bool", default = false, description = "Sensor colliders detect overlap but don't create contacts" }
friction = { type = "f32", default = 0.5, min = 0.0, max = 1.0, description = "Surface friction coefficient" }
restitution = { type = "f32", default = 0.0, min = 0.0, max = 1.0, description = "Bounciness (0 = no bounce, 1 = perfect bounce)" }
offset = { type = "vec3", default = [0, 0, 0], description = "Collider centre offset in the entity local frame (added to the bounds centre)" }
rotation = { type = "vec3", default = [0, 0, 0], description = "Collider rotation offset, Euler degrees (e.g. [0, 0, 90] lays a cylinder on its side as a wheel)" }
