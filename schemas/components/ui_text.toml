# 2D text laid out from a glyph font (flint-render `extract.rs`). Every
# default below is the value the reader falls back to (#792). `layer` is
# read and was never declared.
[component.ui_text]
description = "2D text drawn with a glyph font"

[component.ui_text.fields]
font = { type = "string", default = "", description = "Glyph font: builtin, a glyph set name (fonts/<name>.glyphs.toml), a .glyphs.toml path, or a .font.toml PNG grid (ADR 0113)" }
text = { type = "string", default = "", description = "Text content to display" }
size = { type = "f32", default = 1.0, description = "Text height in world units" }
color = { type = "vec4", default = [1.0, 1.0, 1.0, 1.0], description = "Text tint color (RGBA)" }
align = { type = "enum", values = ["left", "center", "right"], default = "left", description = "Horizontal alignment" }
layer = { type = "i32", default = 0, description = "Draw order among 2D sprites; higher draws on top" }
