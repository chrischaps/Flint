# The renderer reads this table every frame (`LightState::extract`).
# Only `color` and `intensity` carry a `default`: a default is written
# into the component at load, and the others either apply to one type only
# or mean something by being absent (`range` over `radius`,
# `volumetric_color` following `color`, `direction` following the entity's
# rotation). `type` has none so that a light written without one reaches
# the renderer, which says so (#682). Their fallbacks are in the
# descriptions.

[component.light]
description = "A light: `[entities.sun.light]` with a `type`. Point and spot lights sit at the entity's world position and follow its parents; a directional light ignores position. A hidden entity's light is off (`visibility`). The shader takes 4 directional, 16 point and 8 spot lights: past that, the strongest directional lights and the point and spot lights nearest the camera are drawn, and each light left out is named once (`light-cap`). The directional light with the highest intensity casts the cascaded shadows. A scene with no light at all is lit by a built-in key and fill unless `[environment] default_lights = false`. No other table is a light: nothing reads `directional_light`, `point_light` or `spot_light`."

[component.light.fields]
type = { type = "enum", values = ["directional", "point", "spot"], description = "Which kind of light. Any other value lights nothing, and says so. Unset: directional, said once, since a lamp that forgot its type is otherwise a sun." }
color = { type = "vec3", default = [1.0, 1.0, 1.0], description = "Linear RGB." }
intensity = { type = "f32", default = 1.0, description = "Radiance multiplier. A sun is about 3; a point light a few metres from what it lights, 5 to 30." }
direction = { type = "vec3", description = "World space. Directional: the direction TOWARD the light, so a sun overhead is [0, 1, 0] and [0.5, 1.0, 0.3] is high and to one side. Spot: the cone's axis, the way the light shines ([0, -1, 0] is straight down). Not normalized for you. Unset: the light shines down the entity's own -Y and turns with it and its parents (a flashlight in a hand), so an unturned spot points straight down and an unturned directional light is a sun overhead." }
angular_size = { type = "f32", min = 0.0, description = "Directional. Apparent size of the source in degrees (the sun is about 0.5, a softbox 2 to 5): shadows sharpen where things touch and soften with distance (PCSS). Unset or 0: hard 3x3 PCF shadows." }
range = { type = "f32", min = 0.0, description = "Point, spot. Distance in metres at which the light has faded to nothing. Unset: `radius` if that is set, else 10." }
radius = { type = "f32", min = 0.0, description = "Point, spot. An older name for `range`, read only when `range` is unset." }
source_radius = { type = "f32", min = 0.0, description = "Point, spot. Physical radius of the emitter in metres: widens the specular highlight into a disc (an area light). Unset or 0: a point." }
inner_angle_deg = { type = "f32", min = 0.0, max = 90.0, description = "Spot. Half-angle of the full-intensity cone, in degrees, as transforms and `angular_size` are. Wins over `inner_angle`. Unset: `inner_angle`, else about 17.2 (0.3 radians)." }
outer_angle_deg = { type = "f32", min = 0.0, max = 90.0, description = "Spot. Half-angle at which the cone has faded to nothing, in degrees. Wins over `outer_angle`. Unset: `outer_angle`, else about 28.6 (0.5 radians)." }
inner_angle = { type = "f32", min = 0.0, max = 1.5708, description = "Spot. The older form of `inner_angle_deg`, in radians. Unset: 0.3. A value past a quarter turn (1.5708) is almost surely degrees: write `inner_angle_deg`." }
outer_angle = { type = "f32", min = 0.0, max = 1.5708, description = "Spot. The older form of `outer_angle_deg`, in radians. Unset: 0.5." }
cast_shadows = { type = "bool", description = "Spot and point. True: the light casts a shadow from a shadow map of its own, softened by `source_radius` (PCSS) as a sun's is by `angular_size`. A spot's map reaches its `range` and covers a cone up to 80 degrees from the axis; a point light's is a cube of six, every way out to its `range` (#1112). One spot and one point light cast, the first of each by name that asks; the others light without one and say so (`shadow-cap`). A directional light needs none: the strongest casts the cascades, and `false` on it is said not to be honoured. Unset: false." }
volumetric_intensity = { type = "f32", min = 0.0, description = "Directional. God-ray strength for this light (needs `[post_process]` volumetrics). Unset or 0: none." }
volumetric_color = { type = "vec3", description = "Directional. Tint of the god rays. Unset: the light's `color`." }
