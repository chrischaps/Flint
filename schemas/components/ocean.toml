[component.ocean]
description = "Endless Gerstner-wave ocean surface with stylized cel shading. One per scene; the grid follows the camera."

[component.ocean.fields]
# ── Simulation (flint_geometry::ocean::OceanParams) ─────────────────────────
seed = { type = "i32", description = "Wave spectrum RNG seed (same seed = same ocean)", default = 7 }
num_waves = { type = "i32", description = "Number of Gerstner waves, 1-16", default = 12 }
wavelength_min = { type = "f32", description = "Shortest wavelength in meters", default = 4.0 }
wavelength_max = { type = "f32", description = "Longest wavelength in meters", default = 55.0 }
amplitude = { type = "f32", description = "Total wave amplitude in meters (max crest height)", default = 0.85 }
choppiness = { type = "f32", description = "0 = rolling swells, 1 = sharp trochoids (pre-cusp)", default = 0.7 }
direction_deg = { type = "f32", description = "Primary wave travel direction in degrees (0 = +Z)", default = 25.0 }
spread_deg = { type = "f32", description = "Directional spread in degrees; small waves wander more", default = 40.0 }
speed_scale = { type = "f32", description = "Time multiplier: 0 = frozen, 1 = physical speed", default = 1.0 }
wind_speed = { type = "f32", description = "Wind speed m/s: shapes the JONSWAP energy peak (where the height lives)", default = 7.0 }
fetch_km = { type = "f32", description = "Wind fetch in km: longer = energy in longer swells", default = 60.0 }
peak_enhancement = { type = "f32", description = "JONSWAP gamma: 1 = broad sea, 3.3 = typical, higher = single narrow swell", default = 3.3 }

# ── Style (flint_render OceanVisuals) ───────────────────────────────────
deep_color = { type = "color", description = "Water color in wave shadow (RGBA linear)", default = [0.055, 0.22, 0.53, 1.0] }
shallow_color = { type = "color", description = "Water color in full light (RGBA linear)", default = [0.16, 0.51, 0.83, 1.0] }
foam_color = { type = "color", description = "Crest foam color (RGBA linear)", default = [0.96, 0.99, 1.0, 1.0] }
sss_color = { type = "color", description = "Fake subsurface glow through backlit wave flanks", default = [0.10, 0.75, 0.75, 1.0] }
foam_threshold = { type = "f32", description = "Jacobian threshold: higher = more foam", default = 0.62 }
foam_noise_scale = { type = "f32", description = "World-space frequency of foam breakup noise", default = 0.35 }
ramp_steps = { type = "f32", description = "Cel bands in the diffuse ramp (1-8)", default = 3.0 }
specular_strength = { type = "f32", description = "Sun glint intensity (0 disables)", default = 1.0 }
band_wobble = { type = "f32", description = "Ramp edge wobble: noise raggedizes cel band contours (0 = razor edges)", default = 0.2 }
band_dither = { type = "f32", description = "Halftone dither width at band edges: dots grow/merge across the transition (0 = hard line)", default = 0.0 }
rain_ripple = { type = "f32", description = "Rain impact-ring density 0..1 (weather-driven; 0 = off)", default = 0.0 }
band_dither_scale = { type = "f32", description = "Halftone dot grid frequency in dots per meter", default = 1.5 }
foam_glow_color = { type = "color", description = "Bioluminescent foam glow color (RGBA linear, emissive teal-green)", default = [0.35, 0.95, 0.75, 1.0] }
foam_glow = { type = "f32", description = "Bioluminescent glow strength (0 = off; time_of_day.rhai fades it in at night)", default = 0.0 }

# ── Contact foam (splash ring around the scene's ocean_contact hull) ────
splash_strength = { type = "f32", description = "Contact foam overall gain (0 disables)", default = 1.0 }
splash_width = { type = "f32", description = "Max foam band width outward from the hull at full churn (m)", default = 0.35 }
splash_flicker_speed = { type = "f32", description = "Contact foam lapping/flicker animation rate", default = 1.6 }
splash_noise_scale = { type = "f32", description = "World-space frequency of the contact foam scalloped edge", default = 1.8 }
splash_baseline = { type = "f32", description = "Churn floor on calm water (0 = foam vanishes when flat)", default = 0.15 }
splash_response = { type = "f32", description = "Impact speed to churn gain (s/m): how hard waves striking the hull flare the foam", default = 1.0 }

# ── Shoreline foam (where the scene behind the water is shallow) ────────
shore_foam_width = { type = "f32", description = "Foam where the opaque scene behind the water lies within this many metres below the surface: walls, piers, beaches (0 = off; needs post-processing)", default = 0.0 }
shore_foam_strength = { type = "f32", description = "Shoreline foam opacity gain", default = 1.0 }
shore_foam_speed = { type = "f32", description = "Shoreline foam lapping rate (0 = still)", default = 1.0 }
shore_foam_color = { type = "color", description = "Shoreline foam color (RGBA linear)", default = [0.96, 0.99, 1.0, 1.0] }
shore_foam_reach = { type = "f32", description = "Measure the shoreline band across the water, to the nearest solid on screen standing up to this many metres above the surface, so it keeps its width from any angle (0 = off: depth along the view ray only)", default = 0.0 }

# ── Refraction / turbidity (requires post-processing) ───────────────────
turbidity = { type = "f32", description = "Water cloudiness: 0 = glass-clear legs, high = murk in half a meter", default = 0.8 }
refraction_strength = { type = "f32", description = "Screen-space refraction distortion of underwater objects", default = 0.6 }
absorption_color = { type = "vec3", description = "Per-channel absorption rate (red dies first in seawater)", default = [0.9, 0.35, 0.22] }
sky_reflection_strength = { type = "f32", description = "Fresnel-weighted analytic sky reflection (needs a sky component; 0 disables)", default = 0.8 }

# ── Grid ────────────────────────────────────────────────────────────────
grid_scale = { type = "f32", description = "Inner metric scale of the camera-following grid (m)", default = 60.0 }
fade_start = { type = "f32", description = "Distance where wave displacement starts fading (m)", default = 90.0 }
fade_end = { type = "f32", description = "Distance where the ocean is flat (m)", default = 170.0 }

# ── Diagnostics ─────────────────────────────────────────────────────────
show_probe = { type = "bool", description = "Show the CPU/GPU parity buoy (a wave_probe script pins it to ocean_height; parked underwater when false)", default = false }
