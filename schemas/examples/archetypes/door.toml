[archetype.door]
description = "A door entity"
components = ["transform", "door", "audio_trigger"]

[archetype.door.defaults.door]
style = "hinged"
locked = false

[archetype.door.defaults.audio_trigger]
on_interact = "door_open.ogg"

# The box it draws as when it has `bounds` and nothing else to draw (#751)
[archetype.door.visual]
color = [1.0, 0.53, 0.27]
