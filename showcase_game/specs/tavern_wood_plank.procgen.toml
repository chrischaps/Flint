generator = "texture_v1"

[meta]
description = "Worn oak plank flooring for the tavern hub — wide boards with visible wood grain"
name = "tavern_wood_plank"
tags = [
    "texture",
    "wood",
    "floor",
    "tavern",
]
version = "1.2.0"

[params]
height = 1024
output_maps = [
    "albedo",
    "normal",
    "roughness",
]
pattern = "pipeline"
seamless = true
width = 1024

[[params.ops]]
columns = 2
gap_width = 0.008
id = "brick_grid"
rows = 20
stagger = 0.2
type = "brick_grid"

[[params.ops]]
id = "cell_height"
type = "cell_height"
variation = 0.1

[params.ops.inputs]
cell_id = "brick_grid.cell_id"

[[params.ops]]
frequency = 8.0
id = "noise_layer"
noise_type = "perlin"
octaves = 5
output = "grain_height"
scale_x = 1.0
scale_y = 8.0
type = "noise_layer"

[[params.ops]]
id = "blend"
mode = "add"
source = "grain_height"
strength = 0.15
target = "height"
type = "blend"

[params.ops.inputs]
"<source>" = "noise_layer.<output>"
"<target>" = "cell_height.height"

[[params.ops]]
frequency = 16.0
id = "noise_layer_2"
noise_type = "value"
octaves = 3
output = "fine_grain"
scale_x = 1.0
scale_y = 12.0
type = "noise_layer"

[[params.ops]]
id = "blend_2"
mode = "add"
source = "fine_grain"
strength = 0.12
target = "height"
type = "blend"

[params.ops.inputs]
"<source>" = "noise_layer_2.<output>"
"<target>" = "blend.<target>"

[[params.ops]]
depth = 0.3
id = "mortar_groove"
type = "mortar_groove"
width = 0.008

[params.ops.inputs]
edge_dist = "brick_grid.edge_dist"
height = "blend_2.<target>"

[[params.ops]]
base_color = "#7A6248"
id = "cell_color"
type = "cell_color"
variation = 0.06

[params.ops.inputs]
cell_id = "brick_grid.cell_id"

[[params.ops]]
frequency = 8.0
id = "noise_layer_3"
noise_type = "perlin"
octaves = 4
output = "grain_color"
scale_x = 1.0
scale_y = 8.0
type = "noise_layer"

[[params.ops]]
id = "blend_3"
mode = "multiply"
source = "grain_color"
strength = 0.3
target = "r"
type = "blend"

[params.ops.inputs]
"<source>" = "noise_layer_3.<output>"
"<target>" = "cell_color.r"

[[params.ops]]
id = "blend_4"
mode = "multiply"
source = "grain_color"
strength = 0.3
target = "g"
type = "blend"

[params.ops.inputs]
"<source>" = "noise_layer_3.<output>"
"<target>" = "cell_color.g"

[[params.ops]]
id = "blend_5"
mode = "multiply"
source = "grain_color"
strength = 0.3
target = "b"
type = "blend"

[params.ops.inputs]
"<source>" = "noise_layer_3.<output>"
"<target>" = "cell_color.b"

[[params.ops]]
color = "#1A1510"
id = "mortar_color"
threshold = 0.01
type = "mortar_color"

[params.ops.inputs]
b = "blend_5.<target>"
edge_dist = "brick_grid.edge_dist"
g = "blend_4.<target>"
r = "blend_3.<target>"

[[params.ops]]
id = "derive_normal"
strength = 2.0
type = "derive_normal"

[params.ops.inputs]
height = "mortar_groove.height"

[[params.ops]]
base = 0.88
id = "cell_roughness"
mortar = 0.55
mortar_threshold = 0.01
type = "cell_roughness"
variation = 0.05

[params.ops.inputs]
cell_id = "brick_grid.cell_id"
edge_dist = "brick_grid.edge_dist"

[seed]
mode = "fixed"
value = 14001
