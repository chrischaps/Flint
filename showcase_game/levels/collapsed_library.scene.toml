# ================================================================
#  THE OVERGROWN RUINS — Collapsed Library
# ================================================================
#
#  Zone 3: Crumbling interior with warm lamplight. Ancient roots
#  break through sandstone tile floors, and book mites scuttle.
#
#  Procgen showcase:
#    - texture_v1 (tiling_grid): sandstone_tile walls/floor
#    - tree_v1: library_root (leaf_style="none", extreme curve, 3 LODs)
#    - creature_v1: book_mite (8 legs, random seed)
#    - Completes all 3 texture pattern families across the game
# ================================================================

[scene]
name = "The Collapsed Library"
version = "1.0"
description = "Crumbling library with sandstone tiles, twisted roots, and book mites"
input_config = "showcase_game/config/input_ruins.toml"

[post_process]
bloom_enabled = true
bloom_intensity = 0.1
bloom_threshold = 1.0
vignette_enabled = true
vignette_intensity = 0.3
exposure = 1.0
ssao_enabled = true
ssao_radius = 0.5
ssao_intensity = 1.0


# ============================================================
#  PLAYER
# ============================================================

[entities.player]
archetype = "player"

[entities.player.transform]
position = [0, 1.0, 8]

[entities.player.collider]
shape = "capsule"
size = [0.6, 1.8, 0.6]

[entities.player.rigidbody]
body_type = "kinematic"
mass = 80.0
gravity_scale = 0.0

[entities.player.character_controller]
move_speed = 5.0
jump_force = 6.0
height = 1.8
radius = 0.3
camera_mode = "first_person"

[entities.player.audio_listener]
active = true

[entities.player.script]
source = "footsteps.rhai"


# ============================================================
#  CONTROLLERS
# ============================================================

[entities.hud_controller]
[entities.hud_controller.script]
source = "zone_hud.rhai"

[entities.game_controller]
[entities.game_controller.script]
