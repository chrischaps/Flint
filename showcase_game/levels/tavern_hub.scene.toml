# ================================================================
#  THE OVERGROWN RUINS — Tavern Hub
# ================================================================
#
#  Starting area: a weathered tavern at the edge of ancient ruins.
#  The bartender gives hints, patrons share rumors, and three
#  doors lead to the ruin zones. Collect essence to unlock them.
#
#  Procgen showcase: all wall/ceiling textures are procedurally
#  generated via texture_v1 specs (tavern_brick, cracked_plaster).
#
#  Launch:
#    cargo run --bin flint -- play showcase_game/levels/tavern_hub.scene.toml \
#      --schemas schemas --schemas showcase_game/schemas
#
#  Controls:
#    WASD - Move       Space - Jump      Shift - Sprint
#    Mouse - Look      E - Interact      Escape - Pause
# ================================================================

[scene]
name = "The Overgrown Ruins — Tavern Hub"
version = "1.0"
description = "Hub tavern with procgen textures, NPCs, and doors to three ruin zones"
input_config = "showcase_game/config/input_ruins.toml"

[post_process]
bloom_enabled = true
bloom_intensity = 0.12
bloom_threshold = 1.0
vignette_enabled = true
vignette_intensity = 0.35
exposure = 1.1
ssao_enabled = true
ssao_radius = 0.5
ssao_intensity = 0.8


# ============================================================
#  PLAYER
# ============================================================

[entities.player]
archetype = "player"

[entities.player.transform]
position = [0, 1.0, 5]

[entities.player.collider]
shape = "capsule"
size = [0.6, 1.8, 0.6]

[entities.player.rigidbody]
body_type = "kinematic"
mass = 80.0
gravity_scale = 0.0

[entities.player.character_controller]
move_speed = 5.0
jump_force = 6.0
height = 1.8
radius = 0.3
camera_mode = "first_person"

[entities.player.audio_listener]
active = true

[entities.player.script]
source = "footsteps.rhai"


