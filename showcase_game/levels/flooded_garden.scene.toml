# ================================================================
#  THE OVERGROWN RUINS — Flooded Garden
# ================================================================
#
#  Zone 2: Bright outdoor garden overrun by nature. Lush trees,
#  climbing vines, and water strider creatures amid ruined walls.
#
#  Procgen showcase:
#    - texture_v1 (perlin_organic): mossy_stone walls, garden_ground floor
#    - tree_v1: garden_tree (space_colonization, dense, 3 LODs)
#    - tree_v1: garden_vine (climbing, high curve noise, 3 LODs)
#    - creature_v1: water_strider (random seed — each unique)
#    - Runtime: Multiple garden_trees share spec → LRU cache demo
# ================================================================

[scene]
name = "The Flooded Garden"
version = "1.0"
description = "Overgrown outdoor garden with lush procgen trees and water striders"
input_config = "showcase_game/config/input_ruins.toml"

[post_process]
bloom_enabled = true
bloom_intensity = 0.15
bloom_threshold = 1.2
vignette_enabled = true
vignette_intensity = 0.25
exposure = 1.2
ssao_enabled = false
fog_enabled = true
fog_color = [0.55, 0.65, 0.5]
fog_density = 0.003
fog_start = 30.0
fog_end = 120.0


# ============================================================
#  PLAYER
# ============================================================

[entities.player]
archetype = "player"

[entities.player.transform]
position = [0, 1.0, 12]

[entities.player.collider]
shape = "capsule"
size = [0.6, 1.8, 0.6]

[entities.player.rigidbody]
body_type = "kinematic"
mass = 80.0
gravity_scale = 0.0

[entities.player.character_controller]
move_speed = 5.0
jump_force = 6.0
height = 1.8
radius = 0.3
camera_mode = "first_person"

[entities.player.audio_listener]
active = true

[entities.player.script]
source = "footsteps.rhai"


# ============================================================
#  CONTROLLERS
# ============================================================

[entities.hud_controller]
[entities.hud_controller.script]
source = "zone_hud.rhai"

[entities.game_controller]
[entities.game_controller.script]
source = "game_controller.rhai"

[entities.ambient_controller]
[entities.ambient_controller.transform]
position = [0, 0, 0]
[entities.ambient_controller.script]
source = "zone_ambience.rhai"


# ============================================================
#  LIGHTING — bright natural sun
# ============================================================

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.light]
type = "directional"
direction = [0.4, 0.8, 0.3]
color = [1.0, 0.95, 0.85]
intensity = 2.0

# Dappled light through tree canopy
[entities.canopy_light_1]
parent = "garden_main"
[entities.canopy_light_1.transform]
position = [-4, 3, 2]
[entities.canopy_light_1.light]
type = "point"
color = [0.8, 0.9, 0.6]
intensity = 6.0
radius = 8.0

[entities.canopy_light_2]
parent = "garden_main"
[entities.canopy_light_2.transform]
position = [5, 3, -4]
[entities.canopy_light_2.light]
type = "point"
color = [0.85, 0.95, 0.7]
intensity = 5.0
radius = 7.0


# ============================================================
#  ROOM
# ============================================================

[entities.garden_main]
archetype = "room"
[entities.garden_main.transform]
position = [0, 0, 0]


# ============================================================
#  FLOOR — procgen garden_ground
# ============================================================

[entities.ground]
archetype = "floor"
[entities.ground.transform]
position = [0, -0.1, 0]
[entities.ground.bounds]
min = [-25, -0.1, -25]
max = [25, 0.0, 25]
[entities.ground.rigidbody]
body_type = "static"
[entities.ground.collider]
shape = "box"
size = [50, 0.2, 50]
friction = 0.8
[entities.ground.material]
texture = "garden_ground"
roughness = 0.85


