# ================================================================
#  THE OVERGROWN RUINS — Sunken Crypt
# ================================================================
#
#  Zone 1: Dark underground cavern with bioluminescent mushrooms
#  and cave beetles. Heavy fog, low exposure, green-tinted torches.
#
#  Procgen showcase:
#    - texture_v1 (voronoi_brick): dark_stone walls
#    - texture_v1 (perlin_organic): crypt_floor
#    - tree_v1: crypt_mushroom (bioluminescent, 3 LODs)
#    - creature_v1: cave_beetle (random seed — each unique)
#    - creature_v1: boss_beetle (fixed seed — always the same)
#    - Runtime: LRU cache for shared mushroom spec, frame-budget queue
# ================================================================

[scene]
name = "The Sunken Crypt"
version = "1.0"
description = "Dark underground cavern with bioluminescent mushrooms and cave beetles"
input_config = "showcase_game/config/input_ruins.toml"

[post_process]
bloom_enabled = true
bloom_intensity = 0.2
bloom_threshold = 0.6
vignette_enabled = true
vignette_intensity = 0.5
vignette_smoothness = 1.8
exposure = 0.8
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 1.4
fog_enabled = true
fog_color = [0.04, 0.06, 0.03]
fog_density = 0.06
fog_start = 2.0
fog_end = 20.0


# ============================================================
#  PLAYER
# ============================================================

[entities.player]
archetype = "player"

[entities.player.transform]
position = [0, 1.0, 8]

[entities.player.collider]
shape = "capsule"
size = [0.6, 1.8, 0.6]

[entities.player.rigidbody]
body_type = "kinematic"
mass = 80.0
gravity_scale = 0.0

[entities.player.character_controller]
move_speed = 5.0
jump_force = 6.0
height = 1.8
radius = 0.3
camera_mode = "first_person"

[entities.player.audio_listener]
active = true

[entities.player.script]
source = "footsteps.rhai"


# ============================================================
#  CONTROLLERS
# ============================================================

[entities.hud_controller]
[entities.hud_controller.script]
source = "zone_hud.rhai"

[entities.game_controller]
[entities.game_controller.script]
source = "game_controller.rhai"

[entities.ambient_controller]
[entities.ambient_controller.transform]
position = [0, 0, 0]
[entities.ambient_controller.script]
source = "zone_ambience.rhai"


# ============================================================
#  LIGHTING — dim green-tinted torches
# ============================================================

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.light]
type = "directional"
direction = [0.3, 0.7, 0.4]
color = [0.1, 0.12, 0.08]
intensity = 0.5

[entities.torch_entrance]
parent = "crypt_main"
[entities.torch_entrance.transform]
position = [0, 3, 7]
[entities.torch_entrance.light]
type = "point"
color = [0.3, 0.8, 0.4]
intensity = 10.0
radius = 12.0
[entities.torch_entrance.script]
source = "torch_flicker.rhai"

[entities.torch_center]
parent = "crypt_main"
[entities.torch_center.transform]
position = [-4, 2.5, 0]
[entities.torch_center.light]
type = "point"
color = [0.3, 0.9, 0.4]
intensity = 12.0
radius = 14.0
[entities.torch_center.script]
source = "torch_flicker.rhai"

[entities.torch_deep]
parent = "crypt_main"
[entities.torch_deep.transform]
position = [3, 2.5, -6]
[entities.torch_deep.light]
type = "point"
color = [0.2, 0.7, 0.3]
intensity = 8.0
radius = 10.0
[entities.torch_deep.script]
source = "torch_flicker.rhai"

# Boss chamber light — eerie glow
[entities.boss_light]
parent = "crypt_main"
[entities.boss_light.transform]
position = [0, 2, -10]
[entities.boss_light.light]
