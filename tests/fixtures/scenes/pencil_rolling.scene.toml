# Frozen copy of flint-examples/pencil_rolling.scene.toml (#544) for the
# pencil-local golden: the two casks posed mid-roll and the crate turned,
# with no script. The back cask's strokes are the world's, the front
# cask's and the crate's their own (grid = "local").

[scene]
name = "Pencil Rolling"
version = "1.0"
description = "Pencil strokes laid in a prop's own space ride on it as it rolls (#544)"

[camera]
position = [5.6, 2.7, 8.6]
target = [0.5, 0.35, 3.4]
fov = 42.0

[post_process]
exposure = 1.25
vignette_enabled = true
vignette_intensity = 0.25
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7

# The preset every pencil_style starts from: strokes on the surfaces
[post_process.styles.pencil]
scope = "entities"
grid = "world"
spacing = 5.0
wobble = 1.4
contrast = 1.35
layers = 3.0

[entities.sky]
[entities.sky.sky]
zenith_color = [0.16, 0.30, 0.58, 1.0]
horizon_color = [0.86, 0.72, 0.52, 1.0]
haze_color = [0.95, 0.80, 0.60, 0.7]
cloud_coverage = 0.3

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.light]
type = "directional"
direction = [-0.75, 0.55, -0.35]
color = [1.0, 0.86, 0.66]
intensity = 2.4

[entities.fill]
[entities.fill.transform]
position = [0, 30, 0]
[entities.fill.light]
type = "directional"
direction = [0.4, 0.8, 0.4]
color = [0.55, 0.65, 0.85]
intensity = 0.35

[entities.ground]
archetype = "furniture"
[entities.ground.bounds]
min = [-60, -0.2, -60]
max = [60, 0, 60]
[entities.ground.material]
color = [0.13, 0.09, 0.055, 1.0]
roughness = 0.95

[entities.cask_world]
archetype = "furniture"
[entities.cask_world.transform]
position = [1.755, 0.38, 2.4]
rotation = [90, 0, -144]
scale = [0.4, 0.4, 0.4]
[entities.cask_world.model]
asset = "./models/barrel.glb"
[entities.cask_world.pencil_style]

[entities.cask_local]
archetype = "furniture"
[entities.cask_local.transform]
position = [1.755, 0.38, 4.4]
rotation = [90, 0, -144]
scale = [0.4, 0.4, 0.4]
[entities.cask_local.model]
asset = "./models/barrel.glb"
[entities.cask_local.pencil_style]
grid = "local"
lead = [0.34, 0.17, 0.07]
color = 0.5

[entities.crate]
archetype = "furniture"
[entities.crate.transform]
position = [-1.9, 0.0, 3.4]
rotation = [0, 77, 0]
[entities.crate.bounds]
min = [-0.4, 0.0, -0.4]
max = [0.4, 0.8, 0.4]
[entities.crate.material]
texture = "./textures/wood_planks.jpg"
color = [0.9, 0.75, 0.6, 1.0]
roughness = 0.8
[entities.crate.pencil_style]
grid = "local"
