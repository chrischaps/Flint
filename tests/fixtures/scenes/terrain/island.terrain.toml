# An island for any seed (#1694): the noise makes the hills, the falloff says
# where the land is, and the erosion wears the shore it leaves. The book's
# Terrain page shows this recipe; flint-terrain's spec test reads it.

[meta]
name = "island"

[seed]
mode = "fixed"
value = 7

[geometry]
width = 512.0
depth = 512.0
height_scale = 60.0
resolution = 257

# The hills, everywhere
[[height_layers]]
op = "noise"
noise_type = "perlin"
octaves = 6
frequency = 3.0
persistence = 0.5

# Where the land is: whole within 0.25 of the middle, gone by 0.45,
# and always gone at the border
[[height_layers]]
op = "falloff"
shape = "island"
center = [0.5, 0.5]
radius = 0.25
width = 0.2

# Worn after, so the shore is worn too
[[height_layers]]
op = "erosion"
kind = "thermal"
iterations = 30

# Sand at the waterline, grass above, rock on the peaks
[[splat_rules]]
layer = 3
height_max = 0.3
noise_amount = 0.2

[[splat_rules]]
layer = 0
height_min = 0.25
height_max = 0.75
slope_max = 0.6
noise_amount = 0.15

[[splat_rules]]
layer = 2
height_min = 0.6
