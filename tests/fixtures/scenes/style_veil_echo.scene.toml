# Style Veil, echoes: a living oak's echoes in front of a glyph stone (#737).
#
# Echoes (#228) are translucent copies of a living prop's recent poses,
# drawn after the opaques with no depth write. The style mask tests itself
# against the scene's depth, so where an echo of the crown hangs in front
# of the stone, the mask still names the stone, and before #737 the glyph
# pass drew that echo as stone glyphs. The veil (#290) now draws every
# echo's coverage too: the echoes stay leaves, and the stone's glyphs show
# through them only as much as they let through. The oak itself is opaque
# and writes depth, so the mask already left its trunk and crown alone.
#
#   cargo run --bin flint -- render tests/fixtures/scenes/style_veil_echo.scene.toml --no-grid --time 2 -o echo.png
#   cargo run --bin flint -- render tests/fixtures/scenes/style_veil_echo.scene.toml --no-grid --time 2 -o mask.png --debug-mode style
#
# The echoes need a moment of the living clock to exist, hence `--time`.

[scene]
name = "Style Veil Echo"
version = "1.0"
description = "A living oak's echoes in front of a glyph stone (#737)"

[camera]
position = [1.2, 3.4, 11.0]
target = [1.2, 3.2, -2.0]
fov = 50.0

[post_process]
exposure = 1.2
vignette_enabled = true
vignette_intensity = 0.3

[post_process.styles.ascii]
scope = "entities"
cell = 8
background = 0.25
brightness = 0.2
contrast = 1.3

[living]
echoes = { count = 6, spread = 1.6, alpha = 0.35 }

[entities.key]
[entities.key.transform]
position = [0, 20, 0]
[entities.key.light]
type = "directional"
direction = [-0.5, 0.7, 0.6]
color = [1.0, 0.9, 0.76]
intensity = 2.4

[entities.sky]
[entities.sky.sky]
zenith_color = [0.05, 0.07, 0.14, 1.0]
horizon_color = [0.20, 0.18, 0.22, 1.0]
cloud_coverage = 0.1

[entities.ground]
archetype = "furniture"
[entities.ground.transform]
position = [0, 0, 0]
[entities.ground.bounds]
min = [-20, -0.1, -20]
max = [20, 0, 20]
[entities.ground.material]
color = [0.16, 0.14, 0.11, 1.0]
roughness = 0.95

# --- In glyphs: a wall of stone behind the crown ---

[entities.stone]
archetype = "furniture"
[entities.stone.transform]
position = [-0.6, 0, -3.0]
[entities.stone.bounds]
min = [-3.0, 0.0, -0.3]
max = [3.0, 6.0, 0.3]
[entities.stone.material]
color = [0.58, 0.56, 0.52, 1.0]
roughness = 0.9
[entities.stone.ascii_style]
color = "tint"
tint = [0.55, 0.85, 1.0]
ramp = "classic"

# --- Smooth, in front: the oak and its echoes ---

[entities.oak.transform]
position = [3.6, 0.0, 0.0]
rotation = [0.0, 20.0, 0.0]
[entities.oak.model]
asset = "oak_living"
[entities.oak.living_prop]
lineage_seed = 7
