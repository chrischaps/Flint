# ASCII Entities: the mesh meadow's clearing again, with a few props drawn
# in glyphs and the rest of the world left smooth (#266). It renders as is:
#
#   cargo run --bin flint -- render tests/fixtures/scenes/ascii_entities.scene.toml --output ascii.png
#
# The [post_process.styles.ascii] table is the scene's preset for every
# styled prop (scope = "entities" keeps it from covering the whole frame);
# each prop's ascii_style changes only what it needs:
#   bench          amber blocks, banded           a static glTF mesh
#   ybot           the scene's preset             a skinned mesh
#   barrel         normalized, its own grid       grid = "object", normalize = 1
#   crate          phosphor green, inherited by the lantern on it
#   lantern_glass  stays smooth                   enabled = false
# Delete scope = "entities" and the whole frame is glyphs, the lantern's
# glass still smooth. Add silhouette = "cell" to the table (or render with
# --style ascii:silhouette=cell) and every prop's edge is whole glyphs (#338).

[scene]
name = "ASCII Entities"
version = "1.0"
description = "Some props drawn as ASCII glyphs, the meadow left smooth (#266)"

[camera]
position = [4.2, 1.9, 11.5]
target = [0.4, 0.7, 4.6]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 1.2
exposure = 1.25
vignette_enabled = true
vignette_intensity = 0.25
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7

[post_process.styles.ascii]
scope = "entities"
cell = 8
background = 0.3
brightness = 0.15

[entities.sky]
[entities.sky.sky]
zenith_color = [0.16, 0.30, 0.58, 1.0]
horizon_color = [0.86, 0.72, 0.52, 1.0]
haze_color = [0.95, 0.80, 0.60, 0.7]
cloud_tint = [1.0, 0.90, 0.78, 0.8]
cloud_coverage = 0.3
sun_glow = 1.4

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.directional_light]
direction = [0.75, -0.38, 0.35]
color = [1.0, 0.86, 0.66]
intensity = 2.4

[entities.fill]
[entities.fill.transform]
position = [0, 30, 0]
[entities.fill.directional_light]
direction = [-0.4, -0.8, -0.4]
color = [0.55, 0.65, 0.85]
intensity = 0.35

[entities.ground]
archetype = "furniture"
[entities.ground.transform]
position = [0, 0, 0]
[entities.ground.bounds]
min = [-60, -0.2, -60]
max = [60, 0, 60]
[entities.ground.material]
color = [0.13, 0.09, 0.055, 1.0]
roughness = 0.95
metallic = 0.0

[entities.meadow]
[entities.meadow.transform]
position = [-48, 0, -48]
[entities.meadow.grass_ground]
mask = "mesh_meadow/mask.png"
width = 96.0
depth = 96.0
scale_by_mask = true
"grass.density" = 40.0
"grass.max_distance" = 70.0
"grass.fade_start" = 50.0
"grass.blade_width" = 0.2
"grass.blade_height" = 0.45
"grass.height_variation" = 0.4
"grass.color_base" = [0.12, 0.38, 0.08]
"grass.color_tip" = [0.42, 0.70, 0.20]
"grass.color_dry" = [0.62, 0.54, 0.24]
"grass.dry_amount" = 0.3
"grass.wind_direction" = [0.8, 0.0, 0.6]
"grass.wind_speed" = 0.6
"grass.wind_strength" = 0.1
"grass.density_threshold" = 0.05

# --- In glyphs ---

[entities.bench]
archetype = "furniture"
[entities.bench.transform]
position = [0.4, 0.22, 3.0]
rotation = [0, 15, 0]
scale = [0.01, 0.01, 0.01]
[entities.bench.model]
asset = "wooden_bench"
[entities.bench.ascii_style]
ramp = "blocks"
color = "tint"
tint = [1.0, 0.70, 0.30]
levels = 4

# No animator: at rest the skinned mesh renders at the same size in
# `flint render` and the player (#294, #307).
[entities.ybot]
archetype = "character"
[entities.ybot.transform]
position = [-0.9, 0, 4.4]
rotation = [0, 25, 0]
[entities.ybot.model]
asset = "YBotWithIdle"
[entities.ybot.skeleton]
skin = "Armature"
[entities.ybot.ascii_style]

[entities.barrel]
archetype = "furniture"
[entities.barrel.transform]
position = [2.4, 0.48, 5.4]
scale = [0.5, 0.5, 0.5]
[entities.barrel.model]
asset = "barrel"
[entities.barrel.ascii_style]
grid = "object"
# Dark wood: its own tones stretched over the ramp (#289), in place of the
# brightness 0.35 / contrast 1.4 it needed before
normalize = 1.0

[entities.crate]
archetype = "furniture"
[entities.crate.transform]
position = [2.1, 0.0, 2.6]
rotation = [0, 30, 0]
[entities.crate.bounds]
min = [-0.4, 0.0, -0.4]
max = [0.4, 0.8, 0.4]
[entities.crate.material]
color = [0.55, 0.38, 0.22, 1.0]
roughness = 0.8
[entities.crate.ascii_style]
color = "tint"
tint = [0.35, 1.0, 0.45]
ramp = "classic"

# Inherits the crate's green
[entities.lantern]
archetype = "furniture"
parent = "crate"
[entities.lantern.transform]
position = [0.0, 0.8, 0.0]
scale = [0.035, 0.035, 0.035]
[entities.lantern.model]
asset = "Lantern"

# --- Smooth, against its parent's style ---

[entities.lantern_glass]
archetype = "furniture"
parent = "crate"
[entities.lantern_glass.transform]
position = [-0.25, 0.8, 0.25]
[entities.lantern_glass.bounds]
min = [-0.08, 0.0, -0.08]
max = [0.08, 0.16, 0.08]
[entities.lantern_glass.material]
color = [0.9, 0.85, 0.6, 1.0]
[entities.lantern_glass.ascii_style]
enabled = false
