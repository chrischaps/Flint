# Stylize props, following the tear (#397): tests/fixtures/scenes/stylize_props_ascii.scene.toml's
# clearing with its ASCII props' blends following the reality tear
# (`blend_source = "tear"`). The barrel cross-fades (style_mask), the YBot
# dissolves by cells (ascii_style); the cask, crate, lid and tag are plain.
# With no tear on, the props are at blend 0 and the frame is the plain one.
# The clearing is tests/fixtures/scenes/prefabs/stylize_props.prefab.toml.
#
#   cargo run --bin flint -- render tests/fixtures/scenes/stylize_props_tear.scene.toml --no-grid \
#     --render-mode 6 --mode-mix 0.5 --output props.png

[scene]
name = "Stylize Props (tear)"
version = "1.0"
description = "The stylize props with ASCII blends that follow the reality tear, for the tear goldens (#397)"

[camera]
position = [3.4, 1.7, 9.0]
target = [0.7, 0.7, 4.2]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 1.2
exposure = 1.25
vignette_enabled = true
vignette_intensity = 0.25
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.7

[prefabs.props]
template = "stylize_props"
prefix = "props"

[prefabs.props.overrides.barrel.style_mask]
style = "ascii"
blend_source = "tear"
[prefabs.props.overrides.ybot.ascii_style]
blend_source = "tear"
transition = "dissolve"
