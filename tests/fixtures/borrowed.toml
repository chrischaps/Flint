# The examples/ files the frozen fixtures load where they lie (#759, ADR 0121).
#
# tests/fixtures/scenes/ is frozen so goldens don't move when an example
# improves (#763), but a copy of every binary they share would be the same
# bytes tracked twice. So a fixture names the example's file by path
# (`asset = "../../../examples/models/YBot.glb"`) and its bytes are pinned
# here. `scripts/size-check.py` (run by scripts/ci.sh) fails when one
# changes, when a fixture names an examples/ binary that isn't here, and
# when a pin has no borrower left.
#
# Changing a pinned example file (copy on write): first copy the old bytes
# into tests/fixtures/scenes/<folder>/ (`git show HEAD:<path> > ...`),
# point the fixture at the copy and delete its pin here; then change the
# example. To move the fixture with it instead, change both, re-bless the
# goldens that move and update the sha256.
#
# `by` names a test that reads the file by a path the scan can't see
# (a directory and a file name joined in Rust).

