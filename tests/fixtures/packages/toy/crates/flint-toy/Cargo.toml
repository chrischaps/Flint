[package]
name = "flint-toy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The toy package (#1560): a spring pulled each fixed physics step, a script module and a command, on the Package API alone"
publish = false

[features]
# Its player part (`player::PACKAGE`): the spring's subsystem and the `toy`
# module. flint-player's generated `toy` feature turns it on.
player = ["dep:flint-script", "dep:flint-physics"]
# Its command (`cli::extensions()`): `flint toy springs <scene>`.
# flint-cli's generated `toy` feature turns it on.
cli = ["dep:clap", "dep:anyhow", "dep:serde_json"]

[dependencies]
# The Package API (ADR 0137): all this crate builds against
flint-package = { workspace = true }
flint-core = { workspace = true }
flint-script = { workspace = true, optional = true }
# The physics its springs pull, the run's resource since #1616: the API
# names no standard package, so a package that requires one names its crate
flint-physics = { workspace = true, optional = true }
toml = { workspace = true }
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
