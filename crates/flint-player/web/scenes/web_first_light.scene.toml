# The scene a bare web page plays (#99). Everything here is the engine's
# own geometry: a procedural sky, a Gerstner sea and boxes. It needs no
# file beyond itself, so it draws before the vfs (#97) and game bundles
# (#98) can bring models, textures and scripts to the browser.
#
# A small light on a rock at the hour the sun touches the water: the first
# light Flint shows in a browser.

[scene]
name = "First Light"
version = "1.0"
description = "A lighthouse on a rock at golden hour, all procedural: the web player's default scene"

[camera]
position = [-15.0, 3.6, 21.0]
target = [0.0, 3.4, 0.0]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.08
bloom_threshold = 1.1
exposure = 1.15
vignette_enabled = true
vignette_intensity = 0.32

[environment]
ambient_sky = [0.42, 0.40, 0.48]
ambient_ground = [0.16, 0.12, 0.10]

# --- Sky and sun: low in the west, warm ---

[entities.sky]
[entities.sky.sky]
zenith_color = [0.14, 0.22, 0.46, 1.0]
horizon_color = [0.98, 0.66, 0.42, 1.0]
haze_color = [1.0, 0.74, 0.52, 0.75]
cloud_tint = [1.0, 0.78, 0.66, 0.85]
cloud_coverage = 0.38
cloud_density = 0.3
sun_disc_size = 0.04
sun_glow = 1.8

[entities.sun]
[entities.sun.transform]
position = [0, 30, 0]
[entities.sun.directional_light]
direction = [0.55, -0.16, -0.82]
color = [1.0, 0.76, 0.52]
intensity = 2.6

[entities.fill]
[entities.fill.transform]
position = [0, 30, 0]
[entities.fill.directional_light]
direction = [-0.3, -0.8, 0.5]
color = [0.48, 0.56, 0.82]
intensity = 0.3

# --- The sea ---

[entities.sea]
[entities.sea.transform]
