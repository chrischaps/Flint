[package]
name = "flint-player"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone player binary for Flint engine"

[lib]
name = "flint_player"
path = "src/lib.rs"

[[bin]]
name = "flint-player"
path = "src/main.rs"

# Browser entry for the web spike (#95): `trunk serve` in this directory.
[[bin]]
name = "flint-web"
path = "src/bin/flint_web.rs"

[features]
default = ["debug-hud"]
# Summonable debug overlay (Phase 4 F8, ADR 0035). Feature-off builds carry
# zero debug surface and must still compile.
debug-hud = ["dep:flint-debug-ui"]
# The frame profiler (ADR 0109): the frame loop's and the renderer's scopes
# (and wgpu's own) go to Tracy, and each frame is marked. Off, the scopes
# compile to nothing. The client listens on loopback only (no firewall
# prompt) and keeps nothing until a viewer connects.
profile = ["profiling/profile-with-tracy", "dep:tracy-client"]

[dependencies]
flint-core = { workspace = true }
flint-asset = { workspace = true }
flint-schema = { workspace = true }
flint-ecs = { workspace = true }
flint-scene = { workspace = true }
flint-render = { workspace = true }
flint-runtime = { workspace = true }
flint-physics = { workspace = true }
flint-import = { workspace = true }
flint-audio = { workspace = true }
flint-music = { workspace = true }
flint-input-capture = { workspace = true }
serde_json = { workspace = true }
flint-animation = { workspace = true }
flint-particles = { workspace = true }
flint-terrain = { workspace = true }
flint-script = { workspace = true }
rhai = { workspace = true }
profiling = { workspace = true }
tracy-client = { workspace = true, optional = true, features = ["only-localhost", "ondemand"] }
flint-procgen = { workspace = true }
flint-debug-ui = { workspace = true, optional = true }
bytemuck = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
web-time = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
image = { workspace = true }
dirs = { workspace = true }
gilrs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# ahash (egui, hecs, rhai) pulls getrandom 0.3; on the web it needs the JS
# backend, plus the matching cfg in .cargo/config.toml.
getrandom = { version = "0.3", features = ["wasm_js"] }
# egui-winit's default `clipboard` feature pulls arboard, which has no web
# backend. Pinned here rather than inherited so its defaults can go.
egui-winit = { version = "0.30.0", default-features = false }
# Async startup (player_app/web_startup.rs) and the flint-web entry
# (src/bin/flint_web.rs, index.html).
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console", "Document", "Element", "HtmlCanvasElement", "Location",
    "Performance", "Request", "Response", "UrlSearchParams", "Window",
] }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { workspace = true }
