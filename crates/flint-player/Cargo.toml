[package]
name = "flint-player"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone player binary for Flint engine"

[lib]
name = "flint_player"
path = "src/lib.rs"

[[bin]]
name = "flint-player"
path = "src/main.rs"

# A game binary with a procgen generator of its own (#195, ADR 0119).
[[example]]
name = "cave_game"
path = "examples/cave_game/main.rs"
required-features = ["procgen"]

# A game binary with a Rust style of its own, in two passes (#419).
[[example]]
name = "cyanotype"
path = "examples/cyanotype/main.rs"

# The player in a browser (#99): `trunk serve` in this directory.
[[bin]]
name = "flint-web"
path = "src/bin/flint_web.rs"

[features]
default = ["packages", "audio", "gamepad", "frame-history"]
# Written by `scripts/package-sync.py` from packages/*/package.toml (ADR 0137
# section 5, #1560, #1568): `packages` is every package this crate has a
# part of; each package's feature turns on its crate's `player` part (the
# `[rust] player` crate, among the dependencies below), the features of the
# packages it requires, and the `[with.<it>]` parts of the others (living's
# and rhythm's `debug-hud` parts on `debug-hud`); `packages-<device>` is the
# packages' share of a device feature (`[rust.devices]`). `build.rs` lists
# each package's `player::PACKAGE`, so `src/` names none. What each one does
# is its manifest's to say (packages/<name>/package.toml). Don't edit
# between the markers: add or delete a package folder and run the script.
# package-sync:features
packages = ["debug-hud", "living", "music", "procgen", "rhythm"]
packages-audio = ["flint-music?/device", "flint-rhythm-game?/device"]
packages-gamepad = ["flint-rhythm-game?/gamepad"]
debug-hud = [
    "dep:flint-debug-ui", "flint-debug-ui?/player", "flint-living?/debug-hud",
    "flint-rhythm-game?/debug-hud",
]
living = ["procgen", "dep:flint-living", "flint-living?/player"]
music = ["dep:flint-music", "flint-music?/player"]
procgen = ["dep:flint-procgen", "flint-procgen?/player"]
rhythm = ["music", "dep:flint-rhythm-game", "flint-rhythm-game?/player"]
# package-sync:end
# The always-on frame history (#1076): every frame's phases, clock, present,
# physics steps and GPU time kept for the last 600 frames, and each judged
# for a hitch, about 0.65 us a frame. Off (a shipped game that wants none of
# it), frames are recorded only while `--perf` / `?perf=1` is on, as before,
# each of the frame's calls a branch. `FLINT_FRAME_HISTORY=0|1` overrides
# either way at run time.
frame-history = []
# The sound card (kira's cpal backend: ALSA on Linux). Off, the player runs
# silent and a music session's stems don't play, as on a machine without a
# device (its beat still counts, on the game clock).
audio = ["flint-audio/device", "packages-audio"]
# Gamepads (gilrs: libudev on Linux). Off, no pad is ever seen; keyboard,
# mouse, touch and --input-script's pad still work (#221).
gamepad = ["flint-runtime/gamepad", "packages-gamepad"]
# The frame profiler (ADR 0109): the frame loop's and the renderer's scopes
# (and wgpu's own) go to Tracy, and each frame is marked. Off, the scopes
# compile to nothing. The client listens on loopback only (no firewall
# prompt) and keeps nothing until a viewer connects.
profile = ["profiling/profile-with-tracy", "dep:tracy-client"]
# Flint's own scope recorder in a release build (ADR 0128): the same scopes,
# kept in a ring per thread. A debug build always has it; this only forwards
# flint-core's gate, which is where `scope!` decides. Independent of `profile`.
trace = ["flint-core/trace"]

[dependencies]
web-time = { workspace = true }
flint-core = { workspace = true }
flint-geometry = { workspace = true }
flint-asset = { workspace = true }
flint-schema = { workspace = true }
flint-ecs = { workspace = true }
flint-scene = { workspace = true }
flint-query = { workspace = true }
flint-render = { workspace = true }
flint-pixels = { workspace = true }
flint-runtime = { workspace = true, features = ["egui"] }
flint-physics = { workspace = true }
# The Package API (ADR 0137, #1550): the subsystem trait and its contexts
flint-package = { workspace = true }
flint-import = { workspace = true }
flint-audio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
skrifa = { workspace = true }
flint-animation = { workspace = true }
flint-particles = { workspace = true }
flint-terrain = { workspace = true }
flint-script = { workspace = true }
rhai = { workspace = true }
profiling = { workspace = true }
tracy-client = { workspace = true, optional = true, features = ["only-localhost", "ondemand"] }
bytemuck = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
image = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Each package's `[rust] player` crate, written by `scripts/package-sync.py`
# (#1560, #1568)
# package-sync:dependencies
flint-debug-ui = { workspace = true, optional = true }
flint-living = { workspace = true, optional = true }
flint-music = { workspace = true, optional = true }
flint-procgen = { workspace = true, optional = true }
flint-rhythm-game = { workspace = true, optional = true }
# package-sync:end

[build-dependencies]
# The package manifests the launcher's list is read from (#1555)
toml = { workspace = true }

[dev-dependencies]
# The music session test writes its stems (tests/music_session.rs)
hound = { workspace = true }
# run_headless_frame: every test's egui frame clears its texture updates
# (#944), whatever features the tests build with; and the debug-hud
# package's player part, whose layout a game's panel test draws through
# (it runs where the run's launcher lists debug-hud, #1559).
flint-debug-ui = { workspace = true, features = ["player"] }
# The browser's mixer, fed what a scene's scripts sent (#730's bus test).
flint-audio-worklet = { workspace = true }
# The procgen package's player part, named by the tests that make assets
# through it (a game's generators, made meshes as colliders): they run
# only where the run's launcher lists it, which a build without `procgen`
# doesn't.
flint-procgen = { workspace = true, features = ["player"] }
# The living package's player part, named by the living tests, which drive
# its subsystem through the player (`player_app/living_tests/`): they run
# where the run's launcher lists living, as the stock one does with `living`.
flint-living = { workspace = true, features = ["player", "debug-hud"] }
flint-wooze = { workspace = true }

# The hitch log's marks on a sampler's ETW timeline (#1250,
# player_app/sampler_marks.rs)
[target.'cfg(windows)'.dependencies]
tracelogging = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# ahash (egui, rhai) pulls getrandom 0.3; on the web it needs the JS
# backend, plus the matching cfg in .cargo/config.toml.
getrandom = { version = "0.3", features = ["wasm_js"] }
# egui-winit's default `clipboard` feature pulls arboard, which has no web
# backend. Pinned here rather than inherited so its defaults can go.
egui-winit = { version = "0.36.2", default-features = false }
# Async startup (player_app/web_startup.rs), the flint-web entry
# (src/bin/flint_web.rs, index.html) and its Begin gate for sound (#101),
# and localStorage for user files (player_app/user_files.rs).
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# Game bundles stream in chunk by chunk for the progress bar (#98).
js-sys = "0.3"
kira = { workspace = true }
web-sys = { version = "0.3", features = [
    "Blob", "BlobPropertyBag", "console", "Document", "Element", "HtmlAnchorElement",
    "HtmlCanvasElement", "HtmlElement", "Location",
    "MediaQueryList", "Navigator", "Performance", "ReadableStream", "ReadableStreamDefaultReader",
    "Request", "Response", "Storage", "Url", "UrlSearchParams", "Window",
] }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { workspace = true }
# User input overrides live under the OS config directory; on the web they go
# to localStorage instead (player_app/user_files.rs).
dirs = { workspace = true }

# Built-in shader modules and frame acquisition go through flint-render's
# seams; the list is the workspace clippy.toml (#944), denied workspace-wide (#979).
[lints]
workspace = true
