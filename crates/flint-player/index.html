<!doctype html>
<!-- Flint in the browser (#94), and play.chaps.dev (#103). `trunk serve`
     from crates/flint-player. The player draws into #flint;
     ?game=<id> plays a game the site packed, ?bundle=<game.flintpack> one
     packed by `flint bundle` (#98), and ?scene=<url>&msaa=4&width=&height=
     steer it (src/bin/flint_web.rs). ?embed=1 is the iframe view: the world
     and its Begin button. ?perf=1 shows the perf readout (#120), and the
     fingers down once one has touched (#132). A game listed with
     orientation = "landscape" (FlintKart#27) plays sideways on a phone. See
     docs/design/web.md. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flint</title>
    <link rel="icon" href="data:," />
    <!-- Added to a home screen (#135), the page opens without the browser
         around it. The manifest has no start_url, so the game in the
         address (?game=) is the one the icon opens. iPhone Safari has no
         Fullscreen API for a page, so this is its only way to the whole
         screen. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/flint-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d1229" />
    <link data-trunk rel="rust" data-bin="flint-web" data-wasm-opt="z" data-integrity="none" />
    <link data-trunk rel="copy-file" href="../../target/worklet/wasm32-unknown-unknown/worklet/flint_audio_worklet.wasm" />
    <link data-trunk rel="copy-dir" href="web/scenes" />
    <link data-trunk rel="copy-dir" href="web/icons" />
    <link data-trunk rel="copy-file" href="web/manifest.webmanifest" />
    <style>
      html, body {
        margin: 0; height: 100%; background: #0d1229; overflow: hidden;
        overscroll-behavior: none;
      }
      body { display: grid; place-items: center; }
      /* Touch (#132): every finger on the world is the game's. No scroll,
         pull-to-refresh, pinch or double-tap zoom, no callout or text
         selection on a long press. dvh follows a phone's address bar. */
      html:not([data-door]), html:not([data-door]) body {
        touch-action: none; -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      #flint-safe-area {
        position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      canvas#flint { display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; }
      .mark {
        position: fixed;
        left: max(24px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom));
        font: 500 13px/1.4 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: rgba(255, 255, 255, 0.78); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
        pointer-events: none;
      }
      .mark small {
        display: block; letter-spacing: 0.06em; text-transform: none; opacity: 0.7;
        font-variant-numeric: tabular-nums;
      }
      /* Bundle progress (#98): a hairline that fills as the game arrives,
         then fades once the late bundles (audio) are in. */
      #progress {
        width: 220px; height: 2px; margin-top: 8px; border-radius: 1px;
        background: rgba(255, 255, 255, 0.14); overflow: hidden;
        opacity: 0; transition: opacity 0.8s ease 0.4s;
      }
      #progress[data-active] { opacity: 1; transition-delay: 0s; }
      #progress i {
        display: block; height: 100%; background: rgba(255, 236, 214, 0.9);
        transform-origin: left; transform: scaleX(var(--p, 0));
        transition: transform 0.15s linear;
      }

      /* The gate (#102): a browser gives sound and a locked pointer only
         from a gesture, so the world runs silent and softened behind it
         until Begin. One click opens both. */
      .gate {
        position: fixed; inset: 0; display: grid; place-items: center;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        text-align: center; color: #fff;
        background: radial-gradient(ellipse at 50% 62%, rgba(13, 18, 41, 0.18), rgba(13, 18, 41, 0.66));
        backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
        font: 400 15px/1.5 ui-sans-serif, system-ui, sans-serif;
        opacity: 0; pointer-events: none;
        transition: opacity 1.6s ease, backdrop-filter 1.6s ease;
      }
      .gate[data-ready] { opacity: 1; pointer-events: auto; }
      .gate[data-gone] { opacity: 0; backdrop-filter: blur(0); pointer-events: none; }
      .gate h1 {
        margin: 0 0 6px; font: 300 clamp(30px, 6vw, 46px)/1.1 ui-serif, Georgia, serif;
        letter-spacing: 0.05em; text-shadow: 0 2px 24px rgba(0, 0, 0, 0.3);
      }
      .gate p { margin: 0 auto 30px; max-width: 34em; opacity: 0.74; }
      .gate button {
        font: 500 13px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.26em;
        text-transform: uppercase; color: #0d1229; background: rgba(255, 250, 242, 0.92);
        border: 0; border-radius: 999px; padding: 15px 36px; cursor: pointer;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25); transition: transform 0.2s ease;
      }
      @media (hover: hover) { .gate button:hover { transform: translateY(-1px); } }
      .gate button:active { transform: scale(0.97); }
      .gate button:focus { outline: none; }
      .gate button:focus-visible { outline: 1.5px solid rgba(255, 255, 255, 0.6); outline-offset: 4px; }
      .gate small { display: block; margin-top: 18px; font-size: 12px; letter-spacing: 0.04em; opacity: 0.58; }
      /* After Escape frees the pointer: how to take it back. */
      #relook {
        position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%);
        font: 500 12px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.14em;
        text-transform: uppercase; color: rgba(255, 255, 255, 0.82);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45); pointer-events: none;
        opacity: 0; transition: opacity 0.6s ease;
      }
      #relook[data-on] { opacity: 1; transition-delay: 0.4s; }

      /* Full screen (#135). Where the browser has the Fullscreen API, the
         gate offers it with Begin, and a corner button goes in and out at
         any time. iPhone Safari has none for a page: there the gate says
         how to put the game on the home screen instead. */
      .gate .wide {
        display: flex; width: fit-content; align-items: center; gap: 9px; margin: 18px auto 0;
        font-size: 12px; letter-spacing: 0.08em; cursor: pointer; user-select: none;
        opacity: 0.74; transition: opacity 0.2s ease;
      }
      .gate .wide:has(:focus-visible) { opacity: 1; }
      @media (hover: hover) { .gate .wide:hover { opacity: 1; } }
      .gate .wide input {
        appearance: none; -webkit-appearance: none; margin: 0; flex: none;
        width: 26px; height: 15px; border-radius: 999px; cursor: pointer;
        background: rgba(255, 255, 255, 0.2);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
        position: relative; transition: background 0.2s ease;
      }
      .gate .wide input::after {
        content: ""; position: absolute; top: 2px; left: 2px;
        width: 11px; height: 11px; border-radius: 50%; background: #fff;
        transition: transform 0.2s ease;
      }
      .gate .wide input:checked { background: rgba(255, 236, 214, 0.85); }
      .gate .wide input:checked::after { transform: translateX(11px); background: #0d1229; }
      .gate .wide input:focus-visible { outline: 1.5px solid rgba(255, 255, 255, 0.6); outline-offset: 3px; }
      .gate .wide[hidden], .gate .home[hidden] { display: none; }
      .gate .home { margin: 14px auto 0; max-width: 26em; font-size: 12px; line-height: 1.5; opacity: 0.66; }
      .gate .home b { font-weight: 500; }
      .gate .home svg { width: 12px; height: 14px; vertical-align: -2px; margin: 0 1px; }
      #fullscreen {
        position: fixed; z-index: 4; width: 38px; height: 38px; padding: 0;
        right: calc(16px + env(safe-area-inset-right, 0px));
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        display: grid; place-items: center; border: 0; border-radius: 50%; cursor: pointer;
        color: rgba(255, 255, 255, 0.86); background: rgba(9, 13, 32, 0.34);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        opacity: 0.55; transition: opacity 0.25s ease, background 0.25s ease;
        -webkit-tap-highlight-color: transparent;
      }
      #fullscreen:focus-visible, #fullscreen:active { opacity: 1; background: rgba(9, 13, 32, 0.6); outline: none; }
      @media (hover: hover) { #fullscreen:hover { opacity: 1; background: rgba(9, 13, 32, 0.6); } }
      #fullscreen[hidden] { display: none; }
      #fullscreen svg { width: 18px; height: 18px; }
      #fullscreen .out, html[data-fullscreen] #fullscreen .in { display: none; }
      html[data-fullscreen] #fullscreen .out { display: block; }
      /* Locked to the game, nothing in the corner but the world. */
      html[data-looking] #fullscreen { opacity: 0; pointer-events: none; }
      html[data-door] #fullscreen { display: none; }

      /* The perf readout (?perf=1, #120): the player fills it twice a
         second. It sits over the gate so it reads from the first frame,
         and Copy takes the whole of it as one line for an issue. */
      #perf {
        position: fixed; z-index: 5;
        top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
        max-width: calc(100vw - 24px); box-sizing: border-box;
        padding: 10px 12px; border-radius: 8px;
        color: rgba(236, 242, 255, 0.92); background: rgba(9, 13, 32, 0.72);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 10px 30px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        font: 11px/1.45 ui-monospace, "SF Mono", Consolas, monospace;
        font-variant-numeric: tabular-nums;
      }
      #perf[hidden] { display: none; }
      /* On a phone the whole readout would cover Begin: smaller, shorter,
         and scrolled with a finger. */
      @media (max-width: 600px), (max-height: 500px) {
        #perf { font-size: 9px; max-height: 36dvh; overflow: auto; touch-action: pan-y; }
      }
      #perf pre { margin: 0; font: inherit; white-space: pre; overflow-x: auto; }
      #perf button {
        margin-top: 8px; padding: 5px 12px; border: 0; border-radius: 999px; cursor: pointer;
        font: 500 10px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.18em;
        text-transform: uppercase; color: #0d1229; background: rgba(255, 250, 242, 0.88);
      }
      #perf button[data-done] { background: rgba(176, 236, 196, 0.92); }
      html[data-door] #perf { display: none; }

      /* Embed mode (?embed=1, #103): an iframe gets the world and its
         Begin button, nothing else. The hairline stays, centred low, so a
         first visit still sees the game arriving. */
      html[data-embed] .mark { left: 50%; transform: translateX(-50%); font-size: 0; }
      html[data-embed] .mark small { display: none; }
      html[data-embed] .gate h1, html[data-embed] .gate p, html[data-embed] .gate small,
      html[data-embed] .gate .wide, html[data-embed] .gate .home { display: none; }
      html[data-embed] .gate button { padding: 13px 30px; }

      /* The doorway (#103): before any wasm is fetched, the page decides
         whether there is a game to play and a GPU to play it on. If not,
         it shows the games there are, or the game's film and why. */
      html[data-door] canvas#flint, html[data-door] .gate,
      html[data-door] #relook, html[data-door] .mark { display: none; }
      html[data-door], html[data-door] body { overflow: auto; }
      html[data-door] body { display: block; }
      .door {
        position: relative; min-height: 100%; box-sizing: border-box;
        display: grid; color: #fff;
        font: 400 15px/1.55 ui-sans-serif, system-ui, sans-serif;
      }
      .door[hidden] { display: none; }
      .door a { color: inherit; }
      .door .kicker {
        margin: 0 0 14px; font-size: 12px; font-weight: 500;
        letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.62;
      }
      .door h1 {
        margin: 0 0 10px; font: 300 clamp(30px, 6vw, 48px)/1.1 ui-serif, Georgia, serif;
        letter-spacing: 0.04em; text-shadow: 0 2px 24px rgba(0, 0, 0, 0.3);
      }
      .door .why { margin: 0 0 10px; max-width: 36em; opacity: 0.86; }
      .door .where { margin: 0 0 18px; max-width: 36em; opacity: 0.66; font-size: 14px; }
      .door .more {
        display: inline-block; font-size: 12px; font-weight: 500; letter-spacing: 0.16em;
        text-transform: uppercase; text-decoration: none; opacity: 0.82;
        border-bottom: 1px solid rgba(255, 255, 255, 0.35); padding-bottom: 3px;
      }
      @media (hover: hover) { .door .more:hover { opacity: 1; border-color: rgba(255, 255, 255, 0.8); } }
      /* The way home: the kicker reads as a path, chaps.dev / Flint. */
      .door .kicker a { text-decoration: none; border-bottom: 1px solid rgba(255, 255, 255, 0.35); }
      .door .kicker a:focus-visible { outline: 1.5px solid rgba(255, 255, 255, 0.6); outline-offset: 3px; }
      @media (hover: hover) { .door .kicker:has(a:hover) { opacity: 0.9; } .door .kicker a:hover { border-color: rgba(255, 255, 255, 0.8); } }
      .door .kicker .sep { margin: 0 0.5em; opacity: 0.6; }

      /* No WebGPU: the game's film fills the frame, the reason sits low. */
      .door.film { place-items: end start; min-height: 100vh; }
      .door.film video, .door.film > img {
        position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
        background: #0d1229;
      }
      .door.film::before {
        content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
        background: linear-gradient(to top, rgba(13, 18, 41, 0.86), rgba(13, 18, 41, 0.38) 46%, rgba(13, 18, 41, 0) 72%);
      }
      .door.film .words { position: relative; z-index: 2; padding: 0 clamp(16px, 5vw, 56px) clamp(22px, 6vh, 56px); }
      .door.film .caption { margin: 0 0 18px; font-size: 13px; font-style: italic; opacity: 0.6; }
      html[data-embed] .door.film h1 { font-size: clamp(22px, 5vw, 32px); }
      html[data-embed] .door.film .where, html[data-embed] .door.film .caption { display: none; }

      /* No game named: the games there are. */
      .door.list { place-items: center; padding: clamp(28px, 8vh, 80px) 16px; }
      .door.list .words { width: min(100%, 980px); }
      .games {
        list-style: none; margin: 28px 0 0; padding: 0;
        display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      }
      .games a {
        display: block; text-decoration: none; border-radius: 10px; overflow: hidden;
        background: rgba(255, 255, 255, 0.04); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      .games a:focus-visible {
        transform: translateY(-2px); outline: none;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.24), 0 14px 40px rgba(0, 0, 0, 0.35);
      }
      @media (hover: hover) {
        .games a:hover {
          transform: translateY(-2px);
          box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.24), 0 14px 40px rgba(0, 0, 0, 0.35);
        }
      }
      .games a:active { transform: scale(0.985); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3); }
      .games img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #18204a; }
      .games .text { display: block; padding: 16px 18px 18px; }
      .games strong { display: block; font: 300 22px/1.2 ui-serif, Georgia, serif; letter-spacing: 0.04em; }
      .games .line { display: block; margin-top: 6px; font-size: 14px; opacity: 0.7; }
      .games .go {
        display: inline-block; margin-top: 14px; font-size: 11px; font-weight: 500;
        letter-spacing: 0.24em; text-transform: uppercase; opacity: 0.8;
      }
      .games .hands { display: none; }

      /* A finger (#134): hover never comes, so nothing waits on it (the
         hovers above are for a mouse only). Every target is at least 44
         points, the small print is a little larger, a card says how it's
         played by touch. The phone may be held either way (Float#1): the
         gate doesn't ask for it sideways, and full screen doesn't turn it,
         unless the game plays sideways (FlintKart#27, below). */
      @media (pointer: coarse) {
        /* Once playing, the bottom-left corner is the left thumb's: the
           wordmark leaves it to the stick. */
        html:has(.gate[data-gone]) .mark { opacity: 0; transition: opacity 1.2s ease 0.6s; }
        #fullscreen { width: 44px; height: 44px; }
        /* The bottom corners are the game's buttons (SET + DRIFT's scoot
           sat under this one). In full screen a phone's back gesture leaves
           it, so the button goes; out of it, it waits at the bottom centre. */
        html:has(.gate[data-gone]) #fullscreen {
          right: auto; left: calc(50% - 22px); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
        }
        html[data-fullscreen]:has(.gate[data-gone]) #fullscreen { opacity: 0; pointer-events: none; }
        .gate button { padding: 18px 40px; }
        html[data-embed] .gate button { padding: 17px 34px; }
        .gate small { font-size: 13px; opacity: 0.7; }
        .gate .wide { min-height: 44px; padding: 0 10px; margin-top: 8px; }
        .gate .home { font-size: 13px; }
        .door .more { padding: 18px 0 8px; }
        .door .kicker a { display: inline-block; padding: 14px 0 4px; margin-top: -14px; }
        .games .hands {
          display: block; margin-top: 10px; font-size: 13px; line-height: 1.45; opacity: 0.6;
        }
        .games .go { margin-top: 12px; padding: 4px 0; }
      }

      /* Played sideways (FlintKart#27). A game listed with orientation = "landscape"
         turns a phone's full screen to landscape where the browser locks
         it (Chrome on Android). Where it can't (iPhone Safari, the switch
         off, an embed without full screen), once the game has begun and
         while the phone is upright, this covers it and the page holds the
         game (html[data-hold], web_pacing.rs) until it's turned. */
      #turn {
        position: fixed; inset: 0; z-index: 3; display: grid; place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        text-align: center; color: #fff;
        background: radial-gradient(ellipse at 50% 46%, rgba(13, 18, 41, 0.5), rgba(13, 18, 41, 0.9));
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        font: 400 15px/1.5 ui-sans-serif, system-ui, sans-serif;
        opacity: 0; pointer-events: none; visibility: hidden;
        transition: opacity 0.5s ease, visibility 0s linear 0.5s;
      }
      /* A lock being granted turns the phone within a moment: the prompt
         waits that long before it shows, so it doesn't flash. */
      html[data-hold] #turn {
        opacity: 1; pointer-events: auto; visibility: visible;
        transition: opacity 0.6s ease 0.45s, visibility 0s;
      }
      #turn svg { width: 92px; height: 92px; margin: 0 auto 26px; display: block; overflow: visible; }
      #turn .phone { transform-origin: 46px 46px; animation: turn 3.2s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      #turn .arc { opacity: 0.4; stroke-dasharray: 3 5; }
      #turn h2 {
        margin: 0 0 8px; font: 300 clamp(26px, 7vw, 34px)/1.15 ui-serif, Georgia, serif;
        letter-spacing: 0.04em; text-shadow: 0 2px 24px rgba(0, 0, 0, 0.3);
      }
      #turn p { margin: 0 auto; max-width: 20em; opacity: 0.7; }
      @keyframes turn {
        0%, 22% { transform: rotate(0); }
        50%, 80% { transform: rotate(-90deg); }
        100% { transform: rotate(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #turn .phone { animation: none; transform: rotate(-90deg); }
      }
    </style>
  </head>
  <body>
    <canvas id="flint" tabindex="0"></canvas>
    <!-- The safe-area insets, read by the player for its touch controls (#133). -->
    <div id="flint-safe-area" aria-hidden="true"></div>
    <div class="gate" id="gate">
      <div>
        <h1 id="gate-title"></h1>
        <p id="gate-line"></p>
        <button id="begin">Begin</button>
        <label class="wide" id="gate-wide" hidden><input type="checkbox" id="gate-fullscreen" />full screen</label>
        <small id="gate-controls">sound on · mouse to look · Esc frees the pointer</small>
        <p class="home" id="gate-home" hidden>For the whole screen, tap <b>Share</b>
          <svg viewBox="0 0 12 14" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M6 1v8M3 3.5 6 1l3 2.5M3.5 6H1.5v7h9V6h-2"/></svg>
          then <b>Add to Home Screen</b>, and play from there.</p>
      </div>
    </div>
    <div id="turn" role="alertdialog" aria-labelledby="turn-title" aria-describedby="turn-line">
      <div>
        <svg viewBox="0 0 92 92" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
          <path class="arc" d="M18 30a32 32 0 0 1 26-16M74 62a32 32 0 0 1-26 16"/>
          <g class="phone"><rect x="33" y="18" width="26" height="56" rx="5"/><path d="M43 68h6"/></g>
        </svg>
        <h2 id="turn-title">Turn your phone sideways</h2>
        <p id="turn-line"><span id="turn-game">This game</span> plays held sideways. It waits for you.</p>
      </div>
    </div>
    <div id="relook">click to look around</div>
    <button id="fullscreen" type="button" aria-label="Full screen" title="Full screen" hidden>
      <svg class="in" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 6.5V2h4.5M11.5 2H16v4.5M16 11.5V16h-4.5M6.5 16H2v-4.5"/></svg>
      <svg class="out" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6.5 2v4.5H2M16 6.5h-4.5V2M11.5 16v-4.5H16M2 11.5h4.5V16"/></svg>
    </button>
    <div class="mark">Flint<small id="status">starting</small><div id="progress"><i></i></div></div>
    <section class="door" id="door" hidden></section>
    <aside id="perf" hidden>
      <pre id="perf-text"></pre>
      <button id="perf-copy" type="button">Copy line</button>
    </aside>
    <script>
      // The perf readout's Copy (#120): the player keeps the line in
      // data-line. Without clipboard access the line is selected instead.
      document.getElementById("perf-copy").addEventListener("click", async (e) => {
        const button = e.currentTarget;
        const line = document.getElementById("perf").dataset.line || "";
        try {
          await navigator.clipboard.writeText(line);
          button.textContent = "Copied";
        } catch {
          const text = document.getElementById("perf-text");
          text.textContent = line;
          getSelection().selectAllChildren(text);
          button.textContent = "Selected";
        }
        button.dataset.done = "";
        setTimeout(() => {
          button.textContent = "Copy line";
          delete button.dataset.done;
        }, 1600);
      });
    </script>

    <!-- Full screen (#135). The gate's switch rides on the Begin click; the
         corner button goes in and out at any time. Both take the whole
         page, so the gate, the hint and the perf readout come along. -->
    <script>
      (() => {
        const root = document.documentElement;
        const $ = (id) => document.getElementById(id);
        const query = new URLSearchParams(location.search);
        const embed = query.has("embed") && query.get("embed") !== "0";
        const enter = root.requestFullscreen || root.webkitRequestFullscreen;
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        const current = () => document.fullscreenElement || document.webkitFullscreenElement;
        const touch = matchMedia("(pointer: coarse)").matches;
        const installed =
          navigator.standalone === true || matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches;

        // False in an iframe without allowfullscreen, and on iPhone Safari,
        // which can't take a page full screen at all. Only iOS Safari has
        // navigator.standalone: there the home screen is the way.
        if (!enter || !(document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
          if (!embed && !installed && "standalone" in navigator) $("gate-home").hidden = false;
          return;
        }

        const button = $("fullscreen");
        const choice = $("gate-fullscreen");
        button.hidden = false;
        if (!embed && !installed) {
          // Offered on every screen; already on where the browser's bars
          // take the most of it (a phone), or where it was on last time.
          // ?fullscreen=0 (#132) starts it off, for checking a phone in its
          // browser's own frame.
          let kept = null;
          try {
            kept = localStorage.getItem("flint.fullscreen");
          } catch {}
          if (query.get("fullscreen") === "0") kept = "0";
          choice.checked = kept === null ? touch : kept === "1";
          choice.addEventListener("change", () => {
            try {
              localStorage.setItem("flint.fullscreen", choice.checked ? "1" : "0");
            } catch {}
          });
          $("gate-wide").hidden = false;
        }

        function go() {
          let asked;
          try {
            asked = enter.call(root, { navigationUI: "hide" });
          } catch (e) {
            asked = Promise.reject(e);
          }
          // Full screen keeps the way the phone is held, and the phone
          // turns it freely (Float#1). The canvas is 100vw by 100dvh, so a
          // turn resizes it and the surface follows. A game that plays
          // sideways (FlintKart#27) locks it to landscape, where the browser can
          // (Chrome on Android, in full screen only); elsewhere the turn
          // prompt below asks for it.
          Promise.resolve(asked).then(
            () => {
              if (!touch || !("landscape" in root.dataset) || !screen.orientation?.lock) return;
              screen.orientation.lock("landscape").then(
                () => (root.dataset.locked = ""),
                (e) => console.warn("[orientation]", e && e.message),
              );
            },
            (e) => console.warn("[fullscreen]", e && e.message),
          );
        }

        // The Begin click. Its own handler (flint_web.rs) asks for the
        // pointer lock first: a document listener hears the click after the
        // button's. That order matters in Chrome, where entering full screen
        // spends the click's activation and a lock asked for afterwards is
        // refused, while a lock taken first survives the change.
        let begun = false;
        document.addEventListener("click", (e) => {
          if (begun || !(e.target instanceof Element) || !e.target.closest("#begin")) return;
          begun = true;
          if (choice.checked && !current()) go();
        });

        button.addEventListener("click", () => {
          if (current()) {
            Promise.resolve(exit.call(document)).catch(() => {});
          } else {
            // Escape freed a pointer the game wants (the hint says so): take
            // it back in this same click, before full screen spends it.
            if ($("relook").hasAttribute("data-on")) {
              $("flint").requestPointerLock?.()?.catch?.(() => {});
            }
            go();
          }
          // Keys go to the canvas, not to this button.
          if ($("gate").hasAttribute("data-gone")) $("flint").focus({ preventScroll: true });
        });

        const follow = () => {
          const on = !!current();
          if (on) root.dataset.fullscreen = "";
          else delete root.dataset.fullscreen;
          // Out of full screen the lock is gone anyway; say so to the phone.
          if (!on && "locked" in root.dataset) {
            delete root.dataset.locked;
            try {
              screen.orientation.unlock();
            } catch {}
          }
          const label = on ? "Leave full screen" : "Full screen";
          button.setAttribute("aria-label", label);
          button.title = label;
        };
        document.addEventListener("fullscreenchange", follow);
        document.addEventListener("webkitfullscreenchange", follow);
        document.addEventListener("pointerlockchange", () => {
          if (document.pointerLockElement) root.dataset.looking = "";
          else delete root.dataset.looking;
        });
      })();
    </script>

    <!-- Played sideways (FlintKart#27). For a game the doorway marks data-landscape on
         a touch device: once Begin has lifted the gate, a portrait viewport
         holds the game behind the turn prompt, and turning the phone lets
         it go. No reload: the canvas follows the resize. -->
    <script>
      (() => {
        const root = document.documentElement;
        const gate = document.getElementById("gate");
        const upright = matchMedia("(orientation: portrait)");
        const follow = () => {
          const hold = "landscape" in root.dataset && gate.hasAttribute("data-gone") && upright.matches;
          if (hold === "hold" in root.dataset) return;
          if (hold) root.dataset.hold = "";
          else delete root.dataset.hold;
          // Keys go back to the game, not to the prompt.
          if (!hold) document.getElementById("flint").focus({ preventScroll: true });
        };
        upright.addEventListener("change", follow);
        addEventListener("resize", follow);
        new MutationObserver(follow).observe(gate, { attributes: true, attributeFilter: ["data-gone"] });
        new MutationObserver(follow).observe(root, { attributes: true, attributeFilter: ["data-landscape"] });
      })();
    </script>

    <!-- The doorway (#103). Trunk's loader (Trunk.toml) waits on
         window.flintDoorway before it fetches the wasm. It opens when there is
         a game to play and WebGPU to play it on. Otherwise it stays shut and
         the page shows the games there are (no ?game=), or the game's film
         with the reason it can't play here. games.json is written by the
         play.chaps.dev deploy (tools/play-site); without it, as under `trunk
         serve`, the page plays what the query names, as it always has.
         ?webgpu=0 shows the film in any browser, to check it. -->
    <script>
      (() => {
        const query = new URLSearchParams(location.search);
        const root = document.documentElement;
        const embed = query.has("embed") && query.get("embed") !== "0";
        if (embed) root.dataset.embed = "";
        // A phone or a tablet (#132): its main pointer is a finger. The
        // player asks for no pointer lock there (web_page.rs), so the gate
        // says nothing about a mouse or Esc.
        const touchFirst = matchMedia("(pointer: coarse)").matches;
        const TOUCH_CONTROLS = "sound on · the controls come up at a touch · a paired pad plays it all";
        if (touchFirst) {
          root.dataset.touch = "";
          document.getElementById("gate-controls").textContent = TOUCH_CONTROLS;
          // Safari's pinch is a gesture event that touch-action doesn't stop.
          document.addEventListener("gesturestart", (e) => {
            if (!("door" in root.dataset)) e.preventDefault();
          });
          // Begin also asks for fullscreen here: the gate's full screen
          // switch (#135, above) starts on for a finger.
        }
        let open;
        window.flintDoorway = new Promise((resolve) => (open = resolve));

        const BROWSERS =
          "It plays in Chrome and Edge 113 or later, in Safari 26 or later, and in Firefox on Windows.";

        decide().catch((e) => {
          console.warn("[doorway]", e);
          open();
        });

        async function decide() {
          const game = query.get("game");
          const named = game || query.has("bundle") || query.has("scene");
          const games = await listing();
          const entry = games && games.find((g) => g.id === game);
          if (games && games.length && !named) return list(games);
          if (games && game && !entry) return list(games, game);
          const missing = await webgpuMissing();
          if (missing) return film(entry, missing);
          if (entry) {
            // The gate names the game as chaps.dev does, not as its scene file does.
            document.title = `${entry.title} · Flint`;
            document.getElementById("gate-title").textContent = entry.title;
            document.getElementById("gate-line").textContent = entry.line || "";
            // How it's played, when the game says (a kart has no mouse look),
            // and on a touch device how it's played there.
            const controls = touchFirst ? entry.touch : entry.controls;
            if (controls) document.getElementById("gate-controls").textContent = controls;
            // Played sideways on a phone (FlintKart#27): the lock and the turn prompt.
            if (touchFirst && entry.orientation === "landscape") {
              root.dataset.landscape = "";
              document.getElementById("turn-game").textContent = entry.title;
            }
          }
          open();
        }

        async function listing() {
          try {
            const r = await fetch("games.json", { cache: "no-cache" });
            return r.ok ? (await r.json()).games : null;
          } catch {
            return null;
          }
        }

        // "none": no WebGPU at all. "adapter": WebGPU, but no adapter to run it.
        async function webgpuMissing() {
          if (query.get("webgpu") === "0" || !navigator.gpu) return "none";
          try {
            return (await navigator.gpu.requestAdapter()) ? null : "adapter";
          } catch {
            return "adapter";
          }
        }

        function el(tag, props = {}, ...children) {
          const node = Object.assign(document.createElement(tag), props);
          node.append(...children);
          return node;
        }

        function door(kind, ...children) {
          const section = document.getElementById("door");
          section.className = `door ${kind}`;
          section.replaceChildren(...children);
          section.hidden = false;
          root.dataset.door = kind;
        }

        function film(entry, missing) {
          const title = entry ? entry.title : "Flint";
          document.title = `${title} · Flint`;
          const why =
            missing === "adapter"
              ? "This browser has WebGPU, but it offered no graphics adapter to run it. Hardware acceleration may be turned off, or this graphics card may be blocked for WebGPU."
              : `${entry ? title : "This game"} plays in the browser through WebGPU, and this browser doesn't offer it.`;
          const words = el(
            "div",
            { className: "words" },
            el("h1", { textContent: title }),
            el("p", { className: "why", textContent: why }),
            el("p", { className: "where", textContent: BROWSERS }),
          );
          const parts = [];
          if (entry && entry.video) {
            const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
            const video = el("video", {
              src: entry.video,
              poster: entry.poster || "",
              muted: true,
              loop: true,
              playsInline: true,
              autoplay: !still,
              controls: still,
            });
            video.setAttribute("aria-label", `A film of ${title}`);
            parts.push(video);
            if (entry.film) words.append(el("p", { className: "caption", textContent: entry.film }));
          } else if (entry && entry.poster) {
            parts.push(el("img", { src: entry.poster, alt: `${title}, in the game` }));
          }
          if (entry && entry.page) {
            words.append(el("a", { className: "more", href: entry.page, target: "_blank", rel: "noopener", textContent: `About ${title}` }));
          }
          door("film", ...parts, words);
        }

        function list(games, unknown) {
          document.title = "Play · Flint";
          const keep = embed ? "&embed=1" : "";
          const cards = games.map((g) =>
            el(
              "li",
              {},
              el(
                "a",
                { href: `?game=${encodeURIComponent(g.id)}${keep}` },
                g.poster ? el("img", { src: g.poster, alt: "", loading: "lazy" }) : "",
                el(
                  "span",
                  { className: "text" },
                  el("strong", { textContent: g.title }),
                  g.line ? el("span", { className: "line", textContent: g.line }) : "",
                  touchFirst && g.touch ? el("span", { className: "hands", textContent: g.touch }) : "",
                  el("span", { className: "go", textContent: "Play" }),
                ),
              ),
            ),
          );
          const lead = unknown
            ? `There's no game called “${unknown}” here. These are the ones there are.`
            : "Games made with Flint, a game engine written in Rust, playing in your browser.";
          // Back to chaps.dev, except in an iframe, which a chaps.dev page holds.
          const kicker = embed
            ? el("p", { className: "kicker", textContent: "Flint" })
            : el(
                "p",
                { className: "kicker" },
                el("a", { href: "https://chaps.dev/", textContent: "chaps.dev" }),
                el("span", { className: "sep", textContent: "/", ariaHidden: "true" }),
                "Flint",
              );
          door(
            "list",
            el(
              "div",
              { className: "words" },
              kicker,
              el("h1", { textContent: "Play" }),
              el("p", { className: "why", textContent: lead }),
              el("ul", { className: "games" }, ...cards),
            ),
          );
        }
      })();
    </script>
  </body>
</html>
