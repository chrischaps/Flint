[package]
name = "flint-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core types and utilities for the Flint engine"

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
semver = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
web-time = { workspace = true }
# `scope!`'s Tracy half (ADR 0128); nothing without a backend feature.
profiling = { workspace = true }

[features]
# Flint's own scope recorder in a release build (ADR 0128). A debug build
# always has it. Off by default, so a shipped game carries none of it.
trace = []

[lints]
workspace = true
