[package]
name = "flint-terrain"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# A scene's terrain built into a renderer (`scene`, #1615): the chunks, the
# material and its grass, which flint-render built itself until it stopped
# linking this crate. The player, the viewer and `flint render` turn it on;
# physics, scripts and procgen read the heights without it, so they link no
# renderer through this crate.
render = ["dep:flint-render", "dep:wgpu", "dep:tracing"]

[dependencies]
flint-core = { workspace = true }
flint-ecs = { workspace = true }
# The plain data the renderer reads (#1615): `TerrainChunk` and `GrassConfig`
flint-geometry = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
noise = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
flint-render = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[lints]
workspace = true
