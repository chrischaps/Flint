[package]
name = "flint-script"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rhai scripting system for Flint engine"

# `metadata` lists the functions not yet declared through the builder
# (ADR 0116) from Rhai's own metadata, for `flint script api`. Native
# tools only; the player and the web build leave it off.
[features]
metadata = ["rhai/metadata"]
# `check`: `flint script check` (#694) walks a script's syntax tree, which
# Rhai exposes under `internals`, and needs `metadata` for its packages'
# functions. Native tools only, like `metadata`.
check = ["metadata", "rhai/internals"]

[dependencies]
web-time = { workspace = true }
flint-core = { workspace = true }
flint-geometry = { workspace = true }
flint-ecs = { workspace = true }
flint-runtime = { workspace = true }
flint-physics = { workspace = true }
flint-animation = { workspace = true }
flint-terrain = { workspace = true }
rhai = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

# The web player trims rhai (#123): no AST optimizer, no custom syntax and
# i64 as the only integer type. Flint registers no syntax, sets no
# optimization level and hands scripts i64 and f64 only, so scripts mean the
# same; desktop keeps rhai's defaults. docs/design/web.md (Size).
[target.'cfg(target_arch = "wasm32")'.dependencies]
rhai = { workspace = true, features = ["no_optimize", "no_custom_syntax", "only_i64"] }

[dev-dependencies]
flint-core = { workspace = true }
flint-ecs = { workspace = true }
flint-scene = { workspace = true }
flint-schema = { workspace = true }
flint-procgen = { workspace = true }
