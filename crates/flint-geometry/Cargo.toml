[package]
name = "flint-geometry"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Geometry above the core: the Gerstner ocean surface, spline paths, profiles swept along them and rays against drawn meshes"

# Moved out of flint-core (#754) so that an edit here rebuilds only the
# crates that sample a wave, walk a spline or cast a ray.

[dependencies]
flint-core = { workspace = true }
toml = { workspace = true }
# A `.spline.toml` is read through serde, so a mistake carries its line
# and column (#750)
serde = { workspace = true }

[lints]
workspace = true
