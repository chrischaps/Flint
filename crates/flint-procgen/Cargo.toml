[package]
name = "flint-procgen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Procedural generation subsystem for the Flint engine"

[dependencies]
web-time = { workspace = true }
flint-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
image = { workspace = true }
gltf = { workspace = true }

# The procgen cache's disk tier (#181). Native only: the web build has no
# disk to keep it on, and the bytes stay out of the wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bincode = "1.3"
