[package]
name = "flint-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wgpu renderer for Flint"

[features]
default = ["static-dxc"]
# DX12's shader compiler linked into the binary (#947): wgpu's
# `static-dxc`, which links `mach-dxcompiler-rs`, here Flint's own
# vendor/static-dxc (the root Cargo.toml's [patch.crates-io]). On x86_64
# Windows with MSVC only; a no-op everywhere else. Its build fetches one
# archive per machine (vendor/static-dxc/build.rs says from where).
static-dxc = ["wgpu/static-dxc", "dep:mach-dxcompiler-rs"]

[dependencies]
flint-core = { workspace = true }
flint-geometry = { workspace = true }
flint-ecs = { workspace = true }
flint-schema = { workspace = true }
flint-scene = { workspace = true }
flint-import = { workspace = true }
flint-pixels = { workspace = true }
flint-terrain = { workspace = true }
flint-particles = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
# A frame's description (#1084): the drawn post config's values by key
serde_json = { workspace = true }
ab_glyph = { workspace = true }
# `counters`: the device's live buffer and texture memory for F2 and
# `--perf` (#1091, `gpu_counts::device_memory`); a few relaxed atomics in
# wgpu-hal, and nothing on the web, where wgpu-core isn't built.
wgpu = { workspace = true, features = ["counters"] }
winit = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
flint-asset = { workspace = true }
naga = { version = "30.0.2", features = ["wgsl-in", "wgsl-out"] }
epaint_default_fonts = "0.36"
serde_json = { workspace = true }

# Native builds decode every format image does by default (with rayon); the
# web player keeps the workspace's PNG, JPEG and HDR (#123).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { workspace = true, features = ["default"] }
# User-authored styles (#274) are parsed and validated before wgpu sees
# them. wgpu already builds naga natively, so this adds nothing there; the
# web relies on the browser's compiler instead. `wgsl-out` writes the
# module back out with every user loop guarded (#411).
naga = { version = "30.0.2", features = ["wgsl-in", "wgsl-out"] }
# A frame capture's float and depth targets as OpenEXR half / f32 with ZIP
# (#1085, ADR 0126): image's default `exr` feature already builds the crate;
# it's used directly for half floats, u32 channels and the compression.
exr = { version = "1.74", default-features = false }

# DX12's shader compiler (#912, #947): in a build without static DXC,
# `gpu_select` loads dxcompiler.dll by name before wgpu-hal does, to report
# which file it got. Already in the tree through wgpu-hal.
[target.'cfg(windows)'.dependencies]
libloading = "0.8"

# The linked DXC's version and notices (`gpu_select::static_dxc`): the
# same crate wgpu-hal links, on the target it links it on.
#
# `=0.1.947` is Flint's vendor/static-dxc and nothing on crates.io (#982).
# cargo applies [patch] only from the root of the workspace it builds, so a
# game that builds flint-render (a game binary with the engine at engine/)
# names the engine's patches in its own root Cargo.toml, on every platform:
#
#     [patch.crates-io]
#     mach-dxcompiler-rs = { path = "engine/vendor/static-dxc" }
#     egui-winit = { path = "engine/vendor/egui-winit" }
#
# Without it cargo stops with "failed to select a version for the
# requirement `mach-dxcompiler-rs = "=0.1.947"`", pointing here. `flint
# check` on the game names the missing lines too (`missing-cargo-patch`).
[target.'cfg(all(windows, target_arch = "x86_64", target_env = "msvc"))'.dependencies]
mach-dxcompiler-rs = { version = "=0.1.947", optional = true }

# Built-in shader modules and frame acquisition go through flint-render's
# seams; the list is the workspace clippy.toml (#944), denied workspace-wide (#979).
[lints]
workspace = true
