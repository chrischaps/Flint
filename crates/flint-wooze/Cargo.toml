[package]
name = "flint-wooze"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The wooze field: how woozy any place in a scene is, as one function of position and time"

# Moved out of flint-core (#754) so that an edit here rebuilds only what
# reads the field (procgen, the living props, the player and their tools),
# not every crate above the core. The renderer reads none of it (#1330): it
# takes the clocks' answers as `flint_core::field_frame` data.

[dependencies]
flint-core = { workspace = true }
# Shallow wooze's groups are read off the world (`shallow.rs`, #1330)
flint-ecs = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
