[package]
name = "flint-wooze"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The wooze field: how woozy any place in a scene is, as one function of position and time"

# Moved out of flint-core (#754) so that an edit here rebuilds only what
# reads the field (the renderer, procgen, the player and their tools), not
# every crate above the core.

[dependencies]
flint-core = { workspace = true }
toml = { workspace = true }
