[package]
name = "flint-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "egui-based validation viewer for Flint scenes"

[features]
# The wooze field's clocks (#214, #215, #252): the shading boil, shallow
# wooze and woozy grass on a scene's `[wooze]` table (`field_clocks.rs`).
# Off, the viewer links neither flint-wooze (#1330) nor flint-procgen (#1543,
# whose `settle_scene` it read the tables through): a scene with the table is
# drawn still, said once, and its `[living]` / `[wooze]` go unsettled.
default = ["living"]
living = ["dep:flint-wooze", "dep:flint-procgen", "flint-procgen/living"]
# The editors' native file dialogs (`file_dialog`, #221): rfd. Off, the
# Save As / Export / Browse buttons say no dialog opened (a headless build,
# no D-Bus stack on Linux). flint-cli's `dialogs` turns it on.
dialogs = ["dep:rfd"]

[dependencies]
flint-core = { workspace = true }
flint-wooze = { workspace = true, optional = true }
flint-geometry = { workspace = true }
flint-ecs = { workspace = true }
flint-scene = { workspace = true }
flint-procgen = { workspace = true, optional = true }
flint-schema = { workspace = true }
flint-render = { workspace = true }
flint-particles = { workspace = true }
flint-debug-ui = { workspace = true }
flint-import = { workspace = true }
flint-constraint = { workspace = true }
flint-runtime = { workspace = true, features = ["egui"] }
toml = { workspace = true }
serde_json = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }
anyhow = { workspace = true }
rfd = { workspace = true, optional = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
tracing = { workspace = true }
image = { workspace = true }

# Built-in shader modules and frame acquisition go through flint-render's
# seams; the list is this crate's clippy.toml (#944, #761), denied workspace-wide (#979).
[lints]
workspace = true
