[package]
name = "flint-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "egui-based validation viewer for Flint scenes"

[features]
# The editors' native file dialogs (`file_dialog`, #221): rfd. Off, the
# Save As / Export / Browse buttons say no dialog opened (a headless build,
# no D-Bus stack on Linux). flint-cli's `dialogs` turns it on.
dialogs = ["dep:rfd"]

[dependencies]
flint-core = { workspace = true }
flint-geometry = { workspace = true }
flint-ecs = { workspace = true }
flint-scene = { workspace = true }
# The wooze field's clocks and the settle of `[living]` / `[wooze]` are the
# living package's (#1558), registered on the command line
# (`field_clocks::SceneFields`, through flint-package's points): the viewer
# names neither flint-wooze nor flint-procgen
flint-package = { workspace = true }
flint-schema = { workspace = true }
flint-render = { workspace = true }
flint-particles = { workspace = true }
# The widgets, the Rendering & Effects panel (F4) and the style cards: the
# kernel's (#1583), so the viewer links no debug-hud package
flint-widgets = { workspace = true }
flint-import = { workspace = true }
flint-constraint = { workspace = true }
flint-runtime = { workspace = true, features = ["egui"] }
toml = { workspace = true }
serde_json = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }
anyhow = { workspace = true }
rfd = { workspace = true, optional = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
tracing = { workspace = true }
image = { workspace = true }

# Built-in shader modules and frame acquisition go through flint-render's
# seams; the list is this crate's clippy.toml (#944, #761), denied workspace-wide (#979).
[lints]
workspace = true
