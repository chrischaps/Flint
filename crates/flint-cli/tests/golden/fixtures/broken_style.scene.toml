# The broken-style bench (#417): a ramp of boxes from near black to white
# and round the hues, under a sky, so a frame spans the whole display
# range, the sRGB curve's linear toe included. `styles/broken.*` beside it
# fails to compile; rendered with `--style broken` the frame must equal
# the frame rendered without it, pixel for pixel:
#
#   flint render crates/flint-cli/tests/golden/fixtures/broken_style.scene.toml \
#     --schemas schemas --no-grid --style broken
#
# No models, so it finds nothing outside this folder but the schemas.

[scene]
name = "Broken style bench"
version = "1.0"
description = "A user style that fails must draw a passthrough (#417)"

[camera]
position = [0.0, 3.2, 9.5]
target = [0.0, 0.7, 0.0]
fov = 50.0

[post_process]
exposure = 1.1
vignette_enabled = true
vignette_intensity = 0.3

[entities.sky]
[entities.sky.sky]
zenith_color = [0.10, 0.18, 0.42, 1.0]
horizon_color = [0.92, 0.70, 0.48, 1.0]
haze_color = [0.95, 0.78, 0.60, 0.6]
cloud_coverage = 0.25

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
[entities.sun.directional_light]
direction = [0.55, -0.6, -0.5]
color = [1.0, 0.9, 0.75]
intensity = 2.2

[entities.ground]
archetype = "furniture"
[entities.ground.transform]
position = [0, 0, 0]
[entities.ground.bounds]
min = [-30, -0.2, -30]
max = [30, 0, 30]
[entities.ground.material]
color = [0.05, 0.045, 0.04, 1.0]
roughness = 0.9

