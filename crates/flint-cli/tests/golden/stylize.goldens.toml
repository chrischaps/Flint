scene = "tests/fixtures/scenes/stylize_props_plain.scene.toml"
args = ["--no-grid", "--style", "blood"]

[[case]]
name = "reality-drunk"
scene = "tests/fixtures/scenes/stylize_props_plain.scene.toml"
args = ["--no-grid", "--style", "drunk:blend=0.8", "--style-time", "2"]

[[case]]
name = "reality-tron"
scene = "tests/fixtures/scenes/stylize_props_plain.scene.toml"
args = ["--no-grid", "--style", "tron"]

[[case]]
name = "reality-underwater"
