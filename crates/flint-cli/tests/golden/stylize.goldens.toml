# --- user-authored styles (#274, #417) ---------------------------------------
#
# Styles a game writes (tests/fixtures/scenes/styles/*.shader.toml + WGSL), loaded at run time
# by the same `stylize::custom::load_dir` call as `flint render` (the suite
# runs `render::run_in`). These pin what the framework writes around a user's
# function: the prelude's sRGB round trip at the display stage (each reads a
# display colour and returns one), the `params` layout, and the depth and
# mask bindings. All three draw over the scene as authored, hologram on.

# Hologram on the barrel and YBot, as the scene authors it: the mask
# binding and `flint_style_blend`. The two props are about a twentieth of
# the frame, so the share is a quarter of the glyph styles': with the
# params uploaded one slot off, the hologram's own pixels move by up to
# 181 levels yet only 1.25% of the frame passes 48, which 2% let through
[[case]]
name = "user-styles"
scene = "tests/fixtures/scenes/user_styles.scene.toml"
args = ["--no-grid"]
tolerance = { share = 0.005 }

# Risograph over the whole frame: halftone dots by `params.dot`, two inks
# and the paper from nine more params, so a shifted layout moves the inks.
# The YBot and barrel are hologram's, so risograph leaves them (#384)
[[case]]
name = "user-style-risograph"
scene = "tests/fixtures/scenes/user_styles.scene.toml"
args = ["--no-grid", "--style", "risograph"]

# Contour map: lines of equal distance from `flint_view_depth`, the depth binding
# (named `contour` until #599 gave the name to the built-in ink)
[[case]]
name = "user-style-contour-map"
scene = "tests/fixtures/scenes/user_styles.scene.toml"
args = ["--no-grid", "--style", "contour_map"]

# Darkroom: a user style that reads images (#413), the one case that does.
# Its LUT (`[options.grade]`, read by `flint_lut_grade`) is the default
# warm print; its paper is an image option picked from the folder's
# discovered choices, kraft, tiled with mips; gloss is a choice option.
# From #759 to #984 the fixtures' copy borrowed its images by a `../` path
# an image option refuses, so `--style darkroom` was an unknown style and
# no case noticed (#1056)
[[case]]
name = "user-style-darkroom"
scene = "tests/fixtures/scenes/user_styles.scene.toml"
args = ["--no-grid", "--style", "darkroom:paper=papers/kraft.png,finish=gloss"]

# A style whose WGSL fails (tests/golden/fixtures/styles/broken.*) must draw
# its input unchanged and say where it failed. The passthrough runs the
# prelude's round trip (to display on the way in, to linear on the way
# out), so the frame equals the frame without the style only while the two
# curves are each other's inverse: an exact match against a second render,
# not a golden, so it holds on any adapter
[[case]]
name = "user-style-broken"
scene = "crates/flint-cli/tests/golden/fixtures/broken_style.scene.toml"
args = ["--no-grid", "--style", "broken"]
matches = ["--no-grid"]
error = "broken.wgsl:9:9"

# The same at the HDR stage (#563): `broken_hdr` sits before fog, bloom and
# the tonemap and feeds bloom, so its passthrough (`return p.color`, no
# curves) is what bloom's threshold reads. The bench's lamp is linear light
# well above 1 and bloom is on, strong: a passthrough that clamped the HDR
# values, or handed bloom another source, moves the lamp and its halo
[[case]]
name = "user-style-broken-hdr"
scene = "crates/flint-cli/tests/golden/fixtures/broken_style.scene.toml"
args = ["--no-grid", "--set", "post.bloom_enabled=true", "--set", "post.bloom_intensity=0.3", "--style", "broken_hdr"]
matches = ["--no-grid", "--set", "post.bloom_enabled=true", "--set", "post.bloom_intensity=0.3"]
error = "broken_hdr.wgsl:10:16"

# A broken style that asks for every input (#563): depth, the mask and the
# shared edges. Its passthrough is built with none of them, so it must still
# bind, and must leave the one edges pass a frame alone: `edges_view` beside
# it draws that pass, and the frame must equal `edges_view` alone
[[case]]
name = "user-style-broken-inputs"
scene = "crates/flint-cli/tests/golden/fixtures/broken_style.scene.toml"
args = ["--no-grid", "--style", "edges_view", "--style", "broken_inputs"]
matches = ["--no-grid", "--style", "edges_view"]
error = "broken_inputs.wgsl:11:9"

