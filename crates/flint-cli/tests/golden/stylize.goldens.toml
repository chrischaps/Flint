# Stylize goldens (#271): every registered style, pinned.
#
#   cargo run --bin flint -- goldens crates/flint-cli/tests/golden/stylize.goldens.toml
#   cargo run --bin flint -- goldens crates/flint-cli/tests/golden/stylize.goldens.toml --bless
#
# `cargo test -p flint-cli --test render_goldens` runs the same suite. Each
# case is one `flint render`, single-sample unless it says `--msaa 4`, with
# the post clock at 0 (`--style-time` for an animated style). Bless only
# after a deliberate change, and look at what you bless: the out dir's
# index.html (#329) shows every case's old golden, render and diff side by
# side, the ones that moved first.
#
# The props cases use one clearing (tests/fixtures/scenes/prefabs/stylize_props.prefab.toml),
# which loads in a few seconds in a debug build (style_mask.scene.toml's
# grass and 32 MB bench took 20-90 s), and turn the grid off: its far-off
# moire is the part of a frame most likely to shade differently on another
# GPU. Each style has a bench of its own on that clearing (#386), so a
# change to one style moves only its own goldens:
#
#   tests/fixtures/scenes/stylize_props_ascii.scene.toml    barrel and YBot style_mask "ascii"
#   tests/fixtures/scenes/stylize_props_pencil.scene.toml   cask and crate style_mask "pencil"
#   tests/fixtures/scenes/stylize_props_plain.scene.toml    nothing styled: whole-frame styles, looks
#   tests/fixtures/scenes/stylize_props.scene.toml          both, for the mask and styles-mixed only
#
# A new per-entity style gets a bench of its own; a new whole-frame style
# or look goes on the plain one.

# Across adapters (#314): goldens are blessed on an RTX 4070 under Vulkan,
# and CI compares on WARP. The glyph tolerance below held for 29 of the 31
# glyph cases on WARP (worst: edges-view at 1.25% / mean 2.80). The two
# misses were by their mean: ascii-full-msaa4 (3.77; 3.47 on the same RTX
# under DX12: MSAA resolves differ by backend) and style-terrain (3.36,
# glyph flips across a whole hillside). A broken grid reads a mean of
# 15 on WARP, five times its noise. WARP itself is deterministic: its
# variants match byte for byte run to run. The smooth styles' 8-level
# limits can't hold across adapters at all: WARP's drift (kuwahara mean
# 0.71, watercolor-kuwahara 0.89) is the size of a real regression
# (radius 4 against 5 is 0.39). Where a case misses on WARP it has a
# `<golden>.warp.png` variant, taken from CI's stylize-goldens-warp
# artifact; a deliberate change re-blesses those from the next run's.
# The exact text goldens (#317) moved on WARP too: 55 cells of ascii-full
# and 2 of ascii-style-entities, each a neighbour on the ramp (`=` for
# `+`), never a shifted grid. They have `.warp.txt` variants, so each
# adapter stays exact rather than every adapter getting an allowance.

[suite]
name = "stylize"
root = "../../../.."
width = 640
height = 360
# The fixtures are written in the examples' room-builder archetypes
# (`furniture`), which the engine's own set no longer holds (#681).
args = ["--schemas", "schemas", "--schemas", "schemas/examples"]

[tolerance]
level = 48
share = 0.02
mean = 3.0

# --- full-screen ASCII (#265) ---------------------------------------------

# The #265 golden, now reached through --style. Edges (#267) came later and
# are on by default; with them off it is still the same pixels, which is
# what pins "edges = 0 draws what #265 drew"
[[case]]
name = "ascii-full"
scene = "tests/fixtures/scenes/pbr_test.scene.toml"
golden = "ascii_pbr_test.png"
args = ["--style", "ascii:edges=0"]
# The structural golden (#317): the same frame's 80x45 character grid,
# which must match cell for cell. A tone glyph that moved shows as a caret
# in <out>/ascii-full.text.diff, readable without opening an image
text = "ascii_pbr_test.txt"

[[case]]
name = "ascii-full-detailed-tint"
scene = "tests/fixtures/scenes/stylize_props_ascii.scene.toml"
args = ["--no-grid", "--style", "ascii:ramp=detailed,color=tint,cell=10"]

# Cells are in points: at 2x each one is twice the pixels. Edges off here
# and in the next: these pin the glyph grid alone
[[case]]
name = "ascii-full-hidpi"
scene = "tests/fixtures/scenes/pbr_test.scene.toml"
args = ["--style", "ascii:edges=0", "--pixels-per-point", "2"]

# The scene passes at 4x MSAA; the glyph grid must not care
[[case]]
name = "ascii-full-msaa4"
scene = "tests/fixtures/scenes/pbr_test.scene.toml"
args = ["--style", "ascii:edges=0", "--msaa", "4"]

# --- ASCII edges (#267) ---------------------------------------------------
#
# Line glyphs on silhouettes, creases and styled entities' outlines. The
# grid is off in most, to keep the frames plain; since #346 it writes no
# depth, and ascii-edges-pbr-grid holds that it isn't traced.

# The two boxes and the character outlined
[[case]]
name = "ascii-edges-pbr"
scene = "tests/fixtures/scenes/pbr_test.scene.toml"
args = ["--no-grid", "--style", "ascii"]

# The same frame with the editor grid on (#346). The grid is an overlay
# that writes no depth, so the edges must not trace it: its lines lift
# the tone glyphs a step and nothing more. Before #346 every grid line came
# back as a run of `╱ ╲` glyphs: the old renderer misses this golden by
# 9.1% of pixels past the limit, mean 21
[[case]]
name = "ascii-edges-pbr-grid"
scene = "tests/fixtures/scenes/pbr_test.scene.toml"
args = ["--style", "ascii"]

# A styled sphere and box: their outlines must be unbroken glyph lines
# (the scene turns the style on itself)
[[case]]
name = "ascii-edges"
scene = "tests/fixtures/scenes/ascii_edges.scene.toml"
args = ["--no-grid"]

# Edge pixels come from the single-sample depth and mask under MSAA
[[case]]
name = "ascii-edges-msaa4"
scene = "tests/fixtures/scenes/ascii_edges.scene.toml"
args = ["--no-grid", "--msaa", "4"]

# Under a render scale the edges run at the scene's resolution, so a line
# stays one cell wide
[[case]]
name = "ascii-edges-scale05"
scene = "tests/fixtures/scenes/ascii_edges.scene.toml"
args = ["--no-grid", "--render-scale", "0.5"]

# The edge debug view (#349): edge pixels by source, each cell's decision
# and its length bar, with the legend card the render draws
[[case]]
name = "ascii-edges-view"
scene = "tests/fixtures/scenes/ascii_edges.scene.toml"
args = ["--no-grid", "--debug-mode", "edges"]

# Corners (#348): ascii-edges above draws the pillar's top corners `┌ ┐`
# and the tees where the horizon and the box's edges meet it. A font with
# no corner glyphs (halftone names only the four lines) keeps the line
# glyphs it drew before, exactly as with the corner test off
[[case]]
name = "ascii-edges-no-corner-glyphs"
scene = "tests/fixtures/scenes/ascii_edges.scene.toml"
args = ["--no-grid", "--style", "ascii:font=halftone"]
matches = ["--no-grid", "--style", "ascii:font=halftone,edge_corner=0"]

# Edges in an ink of their own (#351): amber outlines over a green tint
# fill, never the fill's colour
[[case]]
name = "ascii-edge-ink-color"
scene = "tests/fixtures/scenes/ascii_edges.scene.toml"
args = ["--no-grid", "--style", "ascii:color=tint,edge_ink=color,edge_color=#ffb347"]

# ...and in the near side's hue: each prop outlined in its own colour, not
# a mix of it and the floor behind (the edge cell pass's packed hue)
[[case]]
name = "ascii-edge-ink-hue"
scene = "tests/fixtures/scenes/pbr_test.scene.toml"
args = ["--no-grid", "--style", "ascii:edge_ink=hue"]

# The grid-fixed ordered dither (#277): the one temporal-stability knob a
# single frame shows (smoothing and hysteresis need a frame before)
[[case]]
name = "ascii-full-dither"
scene = "tests/fixtures/scenes/stylize_props_ascii.scene.toml"
args = ["--no-grid", "--style", "ascii:dither=1"]

# Exposure and normalisation (#289): the whole frame's tones stretched over
# the ramp from this frame's own statistics, then only the styled props,
# each stretched over its own range after half a stop of exposure
[[case]]
name = "ascii-full-normalize"
scene = "tests/fixtures/scenes/stylize_props_ascii.scene.toml"
args = ["--no-grid", "--style", "ascii:normalize=1"]

[[case]]
name = "ascii-entities-normalize"
scene = "tests/fixtures/scenes/stylize_props_ascii.scene.toml"
args = ["--no-grid", "--style", "ascii:scope=entities,normalize=1,exposure=0.5"]

# --- ASCII in motion: the shimmer gate (#478) -------------------------------
#
# Sequence cases: no golden, a budget. Each draws 30 frames of the
# ascii_motion clearing on one renderer under the #277 bench's slow orbit
# and counts, from the style's own grid, the glyphs that flip and the ones
# that flip back (A-B-A reversals, which is what shimmer is). It fails when
# the mean a frame passes its budget. Measured 2026-11-13 at 640x360, RTX
# 4070 under Vulkan (DX12 within 0.1):
#
#                      reversals/frame  flips/frame
#   tone, history on        0.0             9.4      (ascii-motion-tone)
#   tone, hysteresis = 0    2.2            24.1
#   tone, temporal = off   10.5            39.9
#   edges, history on       0.2            19.1      (ascii-motion-edges)
#   edges, hysteresis = 0   3.5            41.7
#   edges, temporal = off  18.8            76.7
#
# So a history that stops holding fails both cases on reversals and flips.
#
# 30 frames, not 60 (#961): a frame is about 1.3 s on CI's WARP, so the two
# cases were 160 s of the job. The means a frame don't depend on the count
# (RTX 4070, Vulkan, 2026-11-20; at 20 / 30 / 60 frames):
#
#                      reversals/frame       flips/frame
#   tone, history on    0.00 0.00 0.00      6.1  7.9  9.4
#   tone, hysteresis 0  2.39 2.32 2.21     23.6 24.2 24.1
#   edges, history on   0.17 0.18 0.12     13.1 15.3 17.6
#   edges, hysteresis 0 3.11 3.46 3.50     38.2 39.8 40.5
#
# WARP at 60 (CI, the first run that read them): tone 0.00 / 9.4, edges
# 0.09 / 17.5, the RTX's numbers.
# A budget is a deliberate number: raise one only with the reason, and the
# new measurement, here.

# The tone glyphs alone (#277): the history removes their shimmer completely
[[case]]
name = "ascii-motion-tone"
scene = "tests/fixtures/scenes/ascii_motion.scene.toml"
args = ["--no-grid", "--style", "ascii:edges=0"]
frames = 30
orbit = 6.8755
max_reversals = 0.5
max_flips = 15.0

# With the edge glyphs, which keep a history of their own since #477
# (38.2 reversals a frame before it, at 1280x720)
[[case]]
name = "ascii-motion-edges"
scene = "tests/fixtures/scenes/ascii_motion.scene.toml"
args = ["--no-grid"]
frames = 30
orbit = 6.8755
max_reversals = 1.0
max_flips = 30.0

# --- per-entity ASCII -----------------------------------------------------

# The entity style mask (#263) the per-entity styles read: one hue a style
[[case]]
name = "style-mask"
scene = "tests/fixtures/scenes/stylize_props.scene.toml"
args = ["--no-grid", "--debug-mode", "style"]

# The shared geometry edges (#301) every edge-reading style sees: hue is
# the direction across the edge, silhouettes solid, creases softer
[[case]]
name = "edges-view"
scene = "tests/fixtures/scenes/stylize_props_plain.scene.toml"
args = ["--no-grid", "--style", "edges_view"]

# A user style reading them (tests/fixtures/scenes/styles/inkline.*, inputs = ["edges"])
# beside edges_view in one frame: the pass runs once for both, and at
# --render-scale 0.5 both read it by UV at the scene's smaller size
[[case]]
name = "edges-inkline-scale05"
scene = "tests/fixtures/scenes/pbr_test.scene.toml"
args = ["--no-grid", "--render-scale", "0.5", "--style", "edges_view", "--style", "inkline"]

# Under MSAA 4 the mask is drawn 4x against the scene's samples and
# resolved, any styled sample winning (#306), so thin edges keep their ids
[[case]]
name = "style-mask-msaa4"
scene = "tests/fixtures/scenes/stylize_props.scene.toml"
args = ["--no-grid", "--debug-mode", "style", "--msaa", "4"]

# Two styles in one frame, as the mixed bench authors them: the barrel and
# YBot in glyphs, the cask and crate sketched, the tag on the crate plain.
# Each style leaves the other's pixels alone. The one props case that moves
# with both ASCII and pencil, on purpose (#386)
[[case]]
name = "styles-mixed"
scene = "tests/fixtures/scenes/stylize_props.scene.toml"
args = ["--no-grid"]

# Per-entity ASCII (#266): the ASCII bench as authored (its two
# style_mask "ascii" props in glyphs, a static mesh and a skinned one), the
# whole frame with those props as variants, and the props on object grids
[[case]]
name = "ascii-style-entities"
scene = "tests/fixtures/scenes/stylize_props_ascii.scene.toml"
args = ["--no-grid"]
# Per entity (#317): the barrel and YBot are glyphs, every other cell is a
# space (the picture passes through)
text = "ascii-style-entities.txt"

# A style a script sets (#371): the same bench, its props held smooth by
# tests/fixtures/scenes/scripts/story_beat.rhai until a beat at 2 s.
# At 3 s the script has given the glyphs back, and the frame is the one the
# scene draws as authored with no script run, byte for byte; at 1 s the
# props are smooth
[[case]]
name = "script-beat-is-the-authored-style"
scene = "tests/fixtures/scenes/stylize_props_scripted.scene.toml"
args = ["--no-grid", "--script-time", "3"]
matches = ["--no-grid", "--time", "3"]

[[case]]
name = "script-beat"
scene = "tests/fixtures/scenes/stylize_props_scripted.scene.toml"
args = ["--no-grid", "--script-time", "3"]
text = "script-beat.txt"

[[case]]
name = "script-before-the-beat"
scene = "tests/fixtures/scenes/stylize_props_scripted.scene.toml"
args = ["--no-grid", "--script-time", "1"]

# Each pixel one style's (#384): whole-frame ASCII leaves the pencil cask,
# crate and lid sketched (pencil draws them from the scene, not from the
# glyphs); the tag, opted out of pencil, is ASCII's
[[case]]
name = "ascii-full-yields-to-pencil"
scene = "tests/fixtures/scenes/stylize_props.scene.toml"
args = ["--no-grid", "--style", "ascii"]

# The same cut snapped to the glyph cells (#534): under `silhouette = "cell"`
# each cell along the pencil cask and crate is all glyph, or all pencil and
# plain scene, never a glyph cut through
[[case]]
name = "ascii-cell-yields-to-pencil"
scene = "tests/fixtures/scenes/stylize_props.scene.toml"
args = ["--no-grid", "--style", "ascii:silhouette=cell"]

[[case]]
name = "ascii-style-screen"
scene = "tests/fixtures/scenes/stylize_props_ascii.scene.toml"
args = ["--no-grid", "--style", "ascii:scope=screen"]

[[case]]
name = "ascii-style-object"
scene = "tests/fixtures/scenes/stylize_props_ascii.scene.toml"
args = ["--no-grid", "--style", "ascii:scope=entities,grid=object"]

# Whole-cell silhouettes (#338): every edge cell of the glyph props is drawn
# whole or shows the scene, on the screen grid and on object grids
[[case]]
name = "ascii-silhouette-cell"
scene = "tests/fixtures/scenes/ascii_entities.scene.toml"
args = ["--no-grid", "--style", "ascii:silhouette=cell"]

[[case]]
name = "ascii-silhouette-cell-object"
scene = "tests/fixtures/scenes/stylize_props_ascii.scene.toml"
args = ["--no-grid", "--style", "ascii:scope=entities,grid=object", "--style", "ascii:silhouette=cell,edges=0"]

# The variant cell pre-pass (#313) sums a variant's cells once, but only at
# a footprint of 2 or more: these pin it on both grids. Blessed with main's
# binary from before #313, so they say the pre-pass draws the same pixels
[[case]]
name = "ascii-style-footprint2"
scene = "tests/fixtures/scenes/stylize_props_ascii.scene.toml"
args = ["--no-grid", "--style", "ascii:footprint=2"]

[[case]]
name = "ascii-style-object-footprint3"
scene = "tests/fixtures/scenes/stylize_props_ascii.scene.toml"
args = ["--no-grid", "--style", "ascii:scope=entities,grid=object", "--style", "ascii:footprint=3"]

# Blend (#278): the barrel half-way dissolved, the YBot a 40% cross-fade,
# both carried in the mask's .g beside their ids (on the ASCII props alone
# since #386: tests/fixtures/scenes/stylize_blend.scene.toml styles no pencil props)
[[case]]
name = "ascii-blend"
scene = "tests/fixtures/scenes/stylize_blend.scene.toml"
args = ["--no-grid"]

# The same through the variant cell pre-pass (#313), blessed as above
[[case]]
name = "ascii-blend-footprint2"
scene = "tests/fixtures/scenes/stylize_blend.scene.toml"
args = ["--no-grid", "--style", "ascii:footprint=2"]

# A blend that follows the tear (#397): tests/fixtures/scenes/stylize_props_tear.scene.toml's
# barrel (cross-fade) and YBot (dissolve) have `blend_source = "tear"`, so
# under the frame's tear alone (`[post_process] tear`, #746; render mode 6
# before it) they are glyphs only where the tear's fbm patches pass and the
# rest of the frame is untouched. With the matrix style following the same
# tear (render mode 1 before #746, whose golden this still is) the same
# holes rain code and the props in them are glyphized from that picture
[[case]]
name = "ascii-tear"
scene = "tests/fixtures/scenes/stylize_props_tear.scene.toml"
args = ["--no-grid", "--set", "post.tear=0.5"]

[[case]]
name = "ascii-tear-matrix"
scene = "tests/fixtures/scenes/stylize_props_tear.scene.toml"
args = ["--no-grid", "--style", "matrix:blend_source=tear,rate=6", "--set", "post.tear=0.5", "--set", "post.tear_scale=3"]

# The deprecated render mode (#746) is that style and tear, pixel for pixel
[[case]]
name = "render-mode-shim-matrix"
scene = "tests/fixtures/scenes/stylize_props_tear.scene.toml"
args = ["--no-grid", "--render-mode", "1", "--mode-mix", "0.5"]
matches = ["--no-grid", "--style", "matrix:blend_source=tear", "--set", "post.tear=0.5"]

# With no tear the torn props are at blend 0: their style is off, pass and
# mask skipped, so the frame is the one with ASCII off everywhere, byte for
# byte. A style that follows the tear is left out of the chain the same way
[[case]]
name = "ascii-tear-calm"
scene = "tests/fixtures/scenes/stylize_props_tear.scene.toml"
args = ["--no-grid", "--set", "post.tear=0", "--style", "matrix:blend_source=tear"]
matches = ["--no-grid", "--style", "ascii:off"]

# The veil (#290): a glyph stone behind a campfire and a glyph crate behind
# glass. The fire stays fire and the glass fades the crate's glyphs by its
# coverage; before #290 both were glyphized as the entity behind them
#
# The fire's alpha emitters and the blaze share an origin, so they tie on
# view distance and draw in entity order, which is name order since #688.
# Before it the ids followed HashMap spawn order and this case drew one of
# two images run to run (#858: 7 and 3 of ten runs; one hash in ten since).
# tests/particle_tie_order.rs holds the tie and its order
[[case]]
name = "style-veil"
scene = "tests/fixtures/scenes/style_veil.scene.toml"
args = ["--no-grid", "--particle-time", "2"]

# Echoes veil too (#737): a living oak's echoes hang in front of a glyph
# stone. They stay leaves, fading the glyphs behind them by their alpha;
# before #737 the veil walked no echo, and the stone's glyphs and inked
# edges were drawn through them
[[case]]
name = "style-veil-echo"
scene = "tests/fixtures/scenes/style_veil_echo.scene.toml"
args = ["--no-grid", "--time", "2"]

# A woozy pane veils where it is drawn (#1241): shallow wooze drifts a pane
# of glass in front of a glyph crate, and the veil moves it as the main pass
# did, so the crate's glyphs fade behind the glass and nowhere else; at its
# rest pose glyphs showed through one side of the pane and its ghost dimmed
# bare crate on the other. The still pane over the stone veils as before.
# A rest-pose veil reads 2.64% past 48 and a mean of 1.68 here (main's
# binary before #1241), close to the suite's glyph limits, so this case
# takes tighter ones: a regression fails on both
[[case]]
name = "style-veil-wooze"
scene = "tests/fixtures/scenes/style_veil_wooze.scene.toml"
args = ["--no-grid", "--time", "2"]
tolerance = { level = 48, share = 0.01, mean = 1.0 }

# Billboards need no veil (#737): their alpha cuts them out and what's
# kept writes depth, so the mask's own depth test leaves the two wisps out
# of the stone behind them. #1011 masks a styled billboard; this one must
# stay byte for byte
[[case]]
name = "style-veil-billboard"
scene = "tests/fixtures/scenes/style_veil_billboard.scene.toml"
args = ["--no-grid"]

# A styled billboard is masked (#1011): the middle wisp asks for ASCII, so
# the mask draws its quad cut out by the same alpha the scene cut it by,
# and only the wisp's shape turns to glyphs, over a pencil stone. The plain
# wisp in front cuts through it by its depth. Before, the mask walked no
# billboard and the wisp stayed a sprite. The mask, at 1x and 4x, then the
# picture
[[case]]
name = "style-mask-billboard"
scene = "tests/fixtures/scenes/style_mask_billboard.scene.toml"
args = ["--no-grid", "--debug-mode", "style"]

[[case]]
name = "style-mask-billboard-msaa4"
scene = "tests/fixtures/scenes/style_mask_billboard.scene.toml"
args = ["--no-grid", "--debug-mode", "style", "--msaa", "4"]

[[case]]
name = "style-billboard-ascii"
scene = "tests/fixtures/scenes/style_mask_billboard.scene.toml"
args = ["--no-grid"]

# A woozy mesh's mask (#737): shallow wooze moves a slab's and a skinned
# figure's vertices, and the mask moves them the same way, so each id
# fills what the scene drew (at rest pose it had holes and spill); the
# still slab behind them is masked as before. At 4x too, its own stages
[[case]]
name = "style-mask-wooze"
scene = "tests/fixtures/scenes/style_mask_wooze.scene.toml"
args = ["--no-grid", "--time", "2", "--debug-mode", "style"]

[[case]]
name = "style-mask-wooze-msaa4"
scene = "tests/fixtures/scenes/style_mask_wooze.scene.toml"
args = ["--no-grid", "--time", "2", "--debug-mode", "style", "--msaa", "4"]

# --- pencil sketch (#273) ---------------------------------------------------
#
# Strokes are thin, hard-edged and everywhere, so a GPU that rounds one
# hash's float differently moves a stroke a pixel: the glyph tolerance.
# The pencil bench's cask and crate carry style_mask "pencil"; the other
# benches leave them plain (#386).

# The whole frame: surface hatching, contours, paper (styles-mixed holds
# that pencil leaves another style's pixels alone)
[[case]]
name = "pencil-full"
scene = "tests/fixtures/scenes/stylize_props_pencil.scene.toml"
args = ["--no-grid", "--style", "pencil"]

# Another hand: a seed and screen hatching at one angle, at 2x (sizes in points)
[[case]]
name = "pencil-screen-seed-hidpi"
scene = "tests/fixtures/scenes/stylize_props_pencil.scene.toml"
args = ["--no-grid", "--style", "pencil:direction=screen,seed=7,angle=35", "--pixels-per-point", "2"]

[[case]]
name = "pencil-tensor"
scene = "tests/fixtures/scenes/pencil_sketch.scene.toml"
args = ["--no-grid", "--style", "pencil:direction=tensor,scope=screen"]

# Strokes laid on the surfaces (#389): triplanar stripes in octaves of
# metres, each picked by its on-screen spacing; the sky keeps the screen's
[[case]]
name = "pencil-world"
scene = "tests/fixtures/scenes/pencil_sketch.scene.toml"
args = ["--no-grid", "--style", "pencil:grid=world,scope=screen"]

# Strokes in each prop's own space (#544): the back cask on the world's
# strokes, the front cask (rolled) and the crate (turned) on their own
[[case]]
name = "pencil-local"
scene = "tests/fixtures/scenes/pencil_rolling.scene.toml"
args = ["--no-grid"]

# Per-entity pencil_style variants (coloured, screen, object grid, blue
# lead, an opt-out) as the demo scene authors them
[[case]]
name = "pencil-entities"
scene = "tests/fixtures/scenes/pencil_sketch.scene.toml"
args = ["--no-grid"]

# Boiling lines: the post clock moves the seed, in whole steps
[[case]]
name = "pencil-boil"
scene = "tests/fixtures/scenes/pencil_sketch.scene.toml"
