[[case]]
name = "selection-billboard"
scene = "tests/fixtures/scenes/selection_outline.scene.toml"
args = ["--no-grid", "--no-shadows", "--select", "wisp"]
tolerance = { level = 40, share = 0.0005, mean = 1.0 }

[[case]]
name = "selection-transparent"
scene = "tests/fixtures/scenes/selection_outline.scene.toml"
args = ["--no-grid", "--no-shadows", "--select", "glass"]
tolerance = { level = 40, share = 0.0005, mean = 1.0 }

# Selecting what draws nothing (a light) leaves the frame as it was, byte
# for byte: the mask and outline passes do nothing without the selection's
# draws, so an editor's frame with nothing outlined is the game's
[[case]]
name = "selection-nothing-drawn"
scene = "tests/fixtures/scenes/selection_outline.scene.toml"
args = ["--no-grid", "--no-shadows", "--select", "sun"]
matches = ["--no-grid", "--no-shadows"]

# A tear with no scale given (#395): `tear_scale` defaults to 3 (#746 named
# it), and a scale of 0 or less still draws as 3, so a partial tear tears in
# patches. Before #395 the scale sat at ~0, the fbm was one value over the
# whole screen, and a mix of 0.55 tore nothing at all
[[case]]
name = "tear-default-params"
scene = "tests/fixtures/scenes/stylize_props_plain.scene.toml"
args = ["--no-grid", "--style", "matrix:blend_source=tear", "--set", "post.tear=0.55", "--set", "post.tear_scale=0"]
matches = ["--no-grid", "--style", "matrix:blend_source=tear", "--set", "post.tear=0.55"]

# The reality styles (#746): render modes 1-5 of the composite until then,
# each a display style with named params now. Whole frame, on the plain bench
[[case]]
name = "reality-matrix"
scene = "tests/fixtures/scenes/stylize_props_plain.scene.toml"
args = ["--no-grid", "--style", "matrix"]

[[case]]
