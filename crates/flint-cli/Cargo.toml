[package]
name = "flint-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI application for Flint engine"

[[bin]]
name = "flint"
path = "src/main.rs"

# The device crates are default-on features (#221). Off, `cargo build -p
# flint-cli --no-default-features` builds every command with no ALSA or
# libudev headers, and without rfd's async D-Bus stack; `flint render`,
# `gen`, `bundle` and the rest never needed them. What each costs when off:
#   audio    `play` runs silent; `music calibrate` and `music chart play`
#            won't start (`music render` renders offline either way)
#   gamepad  no pads; the rumble spike reports it
#   dialogs  the editors' Save As / Export / Browse buttons say so instead
#
# The package features (#1333, ADR 0136) are default-on too: each is the
# one its package's `[build] features` names (`packages/<name>/package.toml`)
# and forwards to flint-player's. Off, the crates go and their commands
# stay in the parser as stubs that exit 2 naming the package
# (`commands/absent.rs`); `flint package list --built` says which are in:
#   living   the living props and wooze field `render` and `check` read,
#            `gen --strip`, `render --sweep wooze.*|living.*`, the
#            viewer's boil and sway: the package's own crate's `cli` part
#            since #1558 (`packages/living/crates/flint-living`), which
#            fills the kernel commands' points, listed by `build.rs`
#   music    `music validate`, `music play`, `music render`: the package's
#            own crate's `cli` part since #1555, so without it the parser
#            has no `music` at all, and a line asking is told to add it
#   rhythm   `music calibrate`, `music chart`, a suite's chart checks: an
#            extension under music's `music` (#1555), with no stubs
#   procgen  the player's procgen at load, `flint gen` for a spec and the
#            spec editors (`flint edit x.procgen.toml`, `gen-preview`,
#            `tex-edit`) and check's spec passes: the package's own crate,
#            flint-procgen-cli (#1557), which registers each with the
#            kernel; `build.rs` lists it from the manifest's `[rust] cli`.
#            `flint gen x.glyphs.toml` and `flint edit x.terrain.toml` are
#            the kernel's and stay in. `[living]` / `[wooze]` are settled
#            at load with `living`, whose tables they are
#   ai      the paid calls: `gen --ai-*`, `render --ai-refine`, `asset
#            resolve --strategy ai_*`; and `asset generate` and the rest,
#            which are the package's own extension (`stock()`, #1553): out,
#            they leave the parser, and asking for one names the package
#            from its manifest
#
# `packages` is all five: CI's headless job checks the book against
# `--no-default-features --features packages`, every command and script
# module with no device crate.
[features]
default = ["audio", "gamepad", "dialogs", "packages"]
packages = ["living", "music", "rhythm", "procgen", "ai"]
audio = ["flint-player/audio", "flint-music?/device", "flint-rhythm-game?/device"]
gamepad = ["flint-player/gamepad", "flint-rhythm-game?/gamepad"]
dialogs = ["flint-viewer/dialogs", "flint-procgen-cli?/dialogs"]
living = ["procgen", "flint-player/living", "dep:flint-living", "flint-living?/cli"]
music = ["flint-player/music", "dep:flint-music", "flint-music?/cli"]
rhythm = ["music", "flint-player/rhythm", "dep:flint-rhythm-game", "flint-rhythm-game?/cli"]
procgen = ["flint-player/procgen", "dep:flint-procgen", "dep:flint-procgen-cli"]
ai = ["procgen", "dep:flint-asset-gen", "flint-asset-gen?/cli", "dep:flint-procgen-ai", "dep:flint-ai-core"]

[dependencies]
flint-core = { workspace = true }
flint-geometry = { workspace = true }
flint-schema = { workspace = true }
flint-ecs = { workspace = true }
flint-scene = { workspace = true }
flint-query = { workspace = true }
flint-render = { workspace = true }
flint-constraint = { workspace = true }
flint-asset = { workspace = true }
flint-asset-gen = { workspace = true, optional = true }
flint-import = { workspace = true }
flint-animation = { workspace = true }
flint-runtime = { workspace = true }
flint-physics = { workspace = true }
flint-player = { workspace = true, features = ["debug-hud", "frame-history"] }
# `CliExtension` and the one output path (#1553): a package's commands
# build against it, and `run_with` composes them
flint-package = { workspace = true, features = ["gif"] }
# `metadata`: `flint script api` lists the functions not yet declared
# through the builder from Rhai's metadata (ADR 0116); `check` (which has
# it) is `flint script check` (#694). Both stay on with
# `--no-default-features`
flint-script = { workspace = true, features = ["metadata", "check"] }
flint-terrain = { workspace = true }
flint-particles = { workspace = true }
# What `living` and `ai` read of procgen's (its living tables, a spec the
# AI writes); `flint gen` itself is flint-procgen-cli's
flint-procgen = { workspace = true, optional = true }
flint-procgen-cli = { workspace = true, optional = true }
# The living package (#1558): its `cli` part fills `render`'s, `check`'s,
# `gen --strip`'s and the viewer's points; this crate's source names none
# of it (`build.rs` lists its extension from the manifest)
flint-living = { workspace = true, optional = true }
flint-procgen-ai = { workspace = true, optional = true }
flint-ai-core = { workspace = true, optional = true }
flint-viewer = { workspace = true }
flint-debug-ui = { workspace = true }
flint-music = { workspace = true, optional = true }
flint-rhythm-game = { workspace = true, optional = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
anyhow = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
glam = { workspace = true }
image = { workspace = true, features = ["gif"] }
# A frame capture's float and depth targets (#1087): flint-render writes them
# with this crate (#1085), so `flint frame` reads them with it, same version
exr = { version = "1.74", default-features = false }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
bytemuck = { workspace = true }
egui-snarl = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# `flint capture` asks the disk under `out` for its free space (#1196): std
# has no call for it. Both already in the tree, these features included.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `build.rs` reads the package manifests' `[build]` and `[rust]` and this
# crate's `[features]` to write the CLI launcher's list (#1554)
[build-dependencies]
toml = { workspace = true }

[dev-dependencies]
naga ={ version = "30.0.2", features = ["wgsl-in"] }
# A JSON Schema validator, for the test that `flint schema --format json-schema`
# describes every example scene (#684). Tests only.
boon = "0.6"
# Reads the WAV `music render` writes, for the music-suite test (#745).
hound = { workspace = true }
# The engine a script's sound plays on, with no device: the check's test that
# a sound passes exactly when the engine finds it (#975).
flint-audio = { workspace = true }
# `tests/gen_validate_cli.rs` reads what `flint gen` wrote with it: here as
# well, so the test builds without the procgen package (#1543) and
# `cargo tree -e normal` shows none
flint-procgen = { workspace = true }
# `check::LIVING_PROP` is the living package's component name, held to its
# crate's (#1558), in every build
flint-living = { workspace = true }

# A game binary with commands of its own (#1140): the test is the binary,
# so its `main` is its own
[[test]]
name = "cli_extension"
harness = false

# Built-in shader modules and frame acquisition go through flint-render's
# seams; the list is this crate's clippy.toml (#944, #761), denied workspace-wide (#979).
[lints]
workspace = true
