[package]
name = "flint-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI application for Flint engine"

[[bin]]
name = "flint"
path = "src/main.rs"

[dependencies]
flint-core = { workspace = true }
flint-schema = { workspace = true }
flint-ecs = { workspace = true }
flint-scene = { workspace = true }
flint-query = { workspace = true }
flint-render = { workspace = true }
flint-constraint = { workspace = true }
flint-asset = { workspace = true }
flint-asset-gen = { workspace = true }
flint-import = { workspace = true }
flint-animation = { workspace = true }
flint-runtime = { workspace = true }
flint-physics = { workspace = true }
flint-player = { workspace = true }
flint-terrain = { workspace = true }
flint-particles = { workspace = true }
flint-procgen = { workspace = true }
flint-viewer = { workspace = true }
flint-debug-ui = { workspace = true }
flint-music = { workspace = true }
flint-input-capture = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
anyhow = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
image = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
bytemuck = { workspace = true }
egui-snarl = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rfd = { workspace = true }

[dev-dependencies]
naga = { version = "23", features = ["wgsl-in"] }
