# {{name}}: a game on the Flint engine.
#
# This file marks the project root. Every flint command, the viewer and the
# player read it, from any folder of the project, so none of them needs a
# --schemas flag.

[project]
# Names the web bundle; saves and user files are keyed on it.
id = "{{id}}"
# Schema directories in override order: the game's come last and win.
schemas = {{schemas}}
# What `flint play` opens when no scene is named.
scene = "scenes/main.scene.toml"
# The game's input layer, over the engine's built-in bindings.
input = "config/input.toml"

# The engine's packages the game uses (ADR 0136). The kernel and the
# standard packages (procgen, debug-hud) are in unless set to false; a
# feature package is in only when it is listed here, as `living = "*"`
# (living props), `music`, `rhythm` or `ai`. Leaving one out leaves out its
# components, scene tables and script functions, and `flint check` names
# the line to add for a scene that uses them. `flint package list` shows
# every package; `flint package used --write` lists what the game uses.
[packages]
