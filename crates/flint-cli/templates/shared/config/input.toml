# {{name}}'s input layer. The engine's built-in actions sit under it:
# move_forward / move_backward / move_left / move_right (WASD), jump (Space),
# interact (E), sprint (Left Shift) and fire. An action named here replaces
# the built-in of the same name; a new name adds one. Scripts read them with
# is_action_pressed("name"), is_action_just_pressed("name") and
# action_value("name").

version = 1
game_id = "{{id}}"

# H shows and hides the controls panel that scripts/hud.rhai draws.
[actions.toggle_help]
kind = "button"
[[actions.toggle_help.bindings]]
type = "key"
code = "KeyH"

# Escape and a pad's Start open and close the pause menu (scripts/hud.rhai,
# ui/pause.ui.toml). With Escape bound here the window stays open on it: the
# menu's Quit, Alt+F4 or the close button leave. Inside the menu the
# engine's own ui_* actions move focus (arrows, d-pad, left stick), press
# (Enter, Space, A) and go back (Backspace, B).
[actions.pause]
kind = "button"
[[actions.pause.bindings]]
type = "key"
code = "Escape"
[[actions.pause.bindings]]
type = "gamepad_button"
button = "Start"
