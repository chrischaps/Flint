# Synthetic Milestone 1 manifest: a tempo AND meter change mid-suite
# (120 BPM 4/4 -> 90 BPM 3/4 at sample 960000 = bar 11 displayed).
# Stems are synthesized by the test's StemResolver; the file names here are
# labels, never opened. Lives in tests/data (crate-local), NOT fixtures/ —
# the pinned fixtures are the validator contract and stay untouched.
# A suite that only plays music: any buses, named as it likes, two of them
# silent. The rhythm layer's six-bus copy, with its seam table, is
# crates/flint-rhythm/tests/data/tempo_change.suite.toml (#1041).
schema_version = 0

[suite]
id = "tempo-change-test"
title = "Tempo Change Test Suite"

[audio]
sample_rate = 48000

[[tempo]]
sample = 0
bpm = 120.0
time_signature = [4, 4]

[[tempo]]
sample = 960000
bpm = 90.0
time_signature = [3, 4]

[[sections]]
name = "before"
start_sample = 0

[[sections]]
name = "after"
start_sample = 960000

[buses.pad]
file = "synth/pad-220hz.flac"

[buses.strings]
silent = true

[buses.bell]
file = "synth/bell-880hz.flac"

[buses.choir]
silent = true

[buses.rain]
file = "synth/rain-8000hz.flac"
