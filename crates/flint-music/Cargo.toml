[package]
name = "flint-music"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Music for Flint games: suite manifests with manifest-named stem buses, tempo maps, the conductor, scheduled bus events, realtime and offline playback, latency calibration"

[features]
default = ["device"]
# Realtime playback through the sound card (kira's cpal backend, ALSA on
# Linux). Off, a realtime session fails to start as with no device; offline
# rendering (`render-suite`) never needs it (#221).
device = ["kira/cpal"]

[dependencies]
web-time = { workspace = true }
flint-core = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
symphonia = { workspace = true }
kira = { workspace = true }
hound = { workspace = true }
