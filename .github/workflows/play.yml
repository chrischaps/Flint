# play.chaps.dev (#103, epic #94): the web player and every game in
# tools/play-site/games.toml, published as this repo's GitHub Pages site.
#
# A push to main that could change what the site plays builds and deploys
# it. A pull request touching the site builds it as a trial and publishes
# nothing: the site it would have deployed is the run's `github-pages`
# artifact. Pages takes the upload from Actions (actions/deploy-pages), so
# there is no Pages repo, no deploy key, and no history of 15 MB wasm files
# growing with every push. docs/design/web.md has the details.
name: Play site

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "schemas/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "tools/play-site/**"
      - ".github/workflows/play.yml"
  pull_request:
    paths:
      - "crates/flint-player/index.html"
      - "crates/flint-player/src/bin/flint_web.rs"
      - "crates/flint-cli/src/commands/bundle.rs"
      - "tools/play-site/**"
      - ".github/workflows/play.yml"
  workflow_dispatch:

# One deploy at a time; a newer push cancels an older build in flight.
concurrency:
  group: play-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build play.chaps.dev
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The flint CLI packs the games. It links the desktop player, so it
      # needs the native audio, gamepad and windowing headers to build.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: play

      # trunk fetches wasm-bindgen and wasm-opt itself
      - name: Install trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv trunk /usr/local/bin/

      - name: Build the web player
        working-directory: crates/flint-player
        run: trunk build --release --dist "$GITHUB_WORKSPACE/play-dist"

      - name: Build the flint CLI
        run: cargo build -p flint-cli --bin flint

      - name: Pack the games and assemble the site
        run: python3 tools/play-site/build.py --player play-dist --flint target/debug/flint --out site

      - name: What the site holds
        run: |
          cat site/built-from.txt
          du -ah site | sort -h | tail -n 12

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
