# Windows links binaries with a 1 MB main-thread stack. Link with 8 MB
# instead, matching the default on Linux/macOS shells. Cargo reads this file
# only when it runs in this checkout (or below it), so `flint` and
# `flint-player` don't rely on it: their build scripts ask for the same 8 MB
# (#990), which reaches a game building the engine from its own root too.
# This entry covers the rest of the checkout's builds: other crates' tests,
# examples and tools (flint-arch-analyzer). A debug `flint --help` once
# overflowed 1 MB in clap's derived parser (#708 cut it to about 600 KB).

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-Wl,--stack,8388608"]

# The web player (docs/design/web.md). getrandom 0.3 needs both this cfg and
# its `wasm_js` feature (set in flint-player's wasm32 dependencies) to reach
# crypto.getRandomValues; without either it refuses to compile.
# simd128 (#137): every WebGPU browser runs wasm SIMD, glam's math switches
# to v128 lanes under it, and it costs nothing in size (web.md, Size). It
# reaches the AudioWorklet's wasm too, which is built for this target.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\"", "-C", "target-feature=+simd128"]
