[package]
name = "flint-asset-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI-powered asset generation pipeline for Flint engine"

[dependencies]
flint-ai-core = { workspace = true }
flint-core = { workspace = true }
flint-asset = { workspace = true }
flint-import = { workspace = true }
flint-procgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
dirs = { workspace = true }
image = { workspace = true }
tracing = { workspace = true }
# The ai package's commands (#1553): `flint asset generate` and the rest,
# registered with the CLI launcher as a `CliExtension` (`cli::extensions`)
flint-package = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[features]
cli = ["dep:flint-package", "dep:clap", "dep:anyhow"]

[dev-dependencies]
uuid = { workspace = true }

[lints]
workspace = true
