# AI asset generation and every paid call's meter (Phase 5's pipeline,
# #721). A feature: a game that never generates links none of it. Its spec
# writer builds on procgen's generators, so procgen comes with it.
#
# Its crates are this folder's `crates/` (#1554): the workspace takes
# `packages/*/crates/*`, so they joined with no member line of their own.
#
# Its `asset` subcommands below are its own `CliExtension`
# (`flint_asset_gen::cli`, #1553), which the CLI launcher lists because
# `[rust] cli` names the crate (flint-cli's build.rs writes the list): a
# flint without the package has none of them, and the launcher names this
# package for one from the list below.
#
# Its flags on commands it doesn't own are `[provides] flags` (#1572).
# `render`'s refine group is its own, a `clap::Args` its extension adds at
# the slot `render` declares (`flint_package::cli::flags`), so a flint
# without the package has none of them, and the launcher names this
# package for one from the list below. `gen --ai-*` and `asset resolve
# --strategy ai_*` are declared by their command (procgen's `gen` args, the
# kernel's `resolve`) and run through points this package registers
# (procgen's `AiPoint`, the kernel's `BatchResolve`); a run without it
# refuses them, naming this package from the same list.

[package]
name = "ai"
version = "0.1.0"
tier = "feature"
summary = "AI asset generation, AI-written procgen specs and the cost ledger"
engine = "^0.1"

[requires]
procgen = "*"

[build]
features = ["ai"]

[rust]
cli = "flint-asset-gen"

[provides]
crates = ["flint-asset-gen", "flint-procgen-ai", "flint-ai-core"]
commands = [
    "asset generate", "asset regenerate", "asset validate", "asset manifest",
    "asset costs", "asset job",
]
flags = [
    "render --ai-refine", "render --refine-rounds", "render --refine-candidates",
    "render --refine-out", "render --ai-provider", "render --ai-model", "render --max-cost",
    "gen --ai-create", "gen --ai-assist", "gen --ai-refine", "gen --cost-report",
    "gen --style-guide",
    "asset resolve --strategy ai_generate", "asset resolve --strategy human_task",
    "asset resolve --strategy ai_then_human",
]
