# The rhythm game (ADR 0117 decision 2, #745): a `music_session` with a
# `chart` is judged, and the pad is read at 1 kHz against the audio clock.
# It judges a session's chart, so it owns no component and brings music.
#
# Its crates are in this folder (#1556): crates/flint-rhythm (the judging),
# crates/flint-input-capture (the pad capture) and crates/flint-rhythm-game,
# whose `player` feature fills music's chart judge
# (`flint_rhythm_game::player::PACKAGE`) and `cli` adds `flint music
# calibrate|chart` (`flint_rhythm_game::cli::extensions()`), named by
# `[rust]` below. The `conducted` module is declared by music's crate, which
# enables it neutral for a chart nothing judges; it is listed here because
# rhythm is what fills it.
#
# `[provides] fields` (#1581) are the `music_session` fields only rhythm
# reads: a scene that writes one uses rhythm, though the component is
# music's, so `flint package used` names rhythm for it and `flint check`
# says `unlisted-package` when [packages] leaves rhythm out.

[package]
name = "rhythm"
version = "0.1.0"
tier = "feature"
summary = "Charts judged against the music, with 1 kHz pad capture"
engine = "^0.1"

[requires]
music = "*"

[build]
features = ["rhythm"]

[rust]
player = "flint-rhythm-game"
cli = "flint-rhythm-game"

# Sound and pads (#221, #1568): the launchers' `audio` and `gamepad` turn on
# the crate's `device` and `gamepad`, the 1 kHz capture's devices.
[rust.devices]
audio = ["flint-rhythm-game/device"]
gamepad = ["flint-rhythm-game/gamepad"]

# With the debug-hud package listed too (ADR 0137 decision 9): the Music
# Guide and Manifest Map panels and the session's debug keys.
[with.debug-hud]
features = ["flint-rhythm-game/debug-hud"]

[provides]
crates = ["flint-rhythm", "flint-input-capture", "flint-rhythm-game"]
script_modules = ["conducted"]
commands = ["music calibrate", "music chart"]
fields = [
    "music_session.chart",
    "music_session.lean_mode",
    "music_session.input_map",
    "music_session.coherence_config",
    "music_session.ladder_config",
    "music_session.gradient_config",
    "music_session.haptics_config",
    "music_session.bars",
    "music_session.quit_on_finish",
    "music_session.tuning_config",
    "music_session.bindings",
]
