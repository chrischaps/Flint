# The vehicle package's test track (#1629, epic #1626): one small lap that
# a playtest drives, and that keeps `vehicle` honest without a game's art,
# items or race logic. A start straight north (-Z), a hairpin, a back
# straight with a ramp on it, a patch of sand, and a closing turn.
#
#   flint play packages/vehicle/examples/test_track/test_track.scene.toml
#   flint playtest packages/vehicle/examples/test_track/test_track.scene.toml \
#     --input-script packages/vehicle/examples/test_track/playtests/lap.input \
#     --test-script packages/vehicle/examples/test_track/playtests/referee.rhai
#
# W / S or a pad's triggers drive, A / D or the left stick steer, Space is
# the handbrake. Every piece a wheel stands on is a static box whose top is
# at y = 0 (the ramp rises from it); the runoff around it is 5 cm lower, and
# a wheel on it has left the track. The pieces after the kart were written
# by a script, two boxes a 15 degree step of each turn: the road and, on
# the inside, its kerb, which has no collider. Every other kerb piece stands
# 5 mm higher, so where two overlap the higher one draws on every GPU rather
# than the two fighting for the depth (#1629's golden caught it on WARP).

[scene]
name = "Vehicle Test Track"
version = "1.0"
description = "The vehicle package's example: a lap with a straight, a hairpin, a ramp and a change of surface"
input_config = "input.toml"

# The whole lap from above the closing turn; the kart's chase camera
# (the package's `chase_camera`, #1631) takes over once the game runs.
[camera]
position = [18.0, 34.0, 38.0]
target = [-7.0, 0.0, -24.0]
fov = 50.0

[post_process]
bloom_enabled = true
bloom_intensity = 0.04
exposure = 1.1
vignette_enabled = true
vignette_intensity = 0.2
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 0.6

# Late afternoon
[entities.sky]
sky = { zenith_color = [0.20, 0.36, 0.62, 1.0], horizon_color = [0.92, 0.74, 0.52, 1.0], haze_color = [0.96, 0.82, 0.62, 0.2], cloud_coverage = 0.25, sun_glow = 1.2 }

[entities.sun]
transform = { position = [0.0, 50.0, 0.0] }
light = { type = "directional", direction = [-0.55, 0.45, 0.7], color = [1.0, 0.88, 0.70], intensity = 2.6 }

[entities.fill]
transform = { position = [0.0, 30.0, 0.0] }
light = { type = "directional", direction = [0.5, 0.8, -0.3], color = [0.55, 0.65, 0.85], intensity = 0.35 }

# What isn't track: a wheel on it has left the track (playtests/referee.rhai)
[entities.runoff]
transform = { position = [-7.0, -0.25, -25.0] }
bounds = { min = [-60.0, -0.2, -70.0], max = [60.0, 0.2, 70.0] }
material = { color = [0.30, 0.45, 0.22, 1.0], roughness = 0.95 }
rigidbody = { body_type = "static" }
collider = { shape = "box", size = [120.0, 0.4, 140.0], friction = 0.8 }

# The start and finish line, painted on the start straight (no collider)
[entities.start_line]
transform = { position = [0.0, 0.005, 0.0] }
bounds = { min = [-3.5, -0.005, -0.3], max = [3.5, 0.005, 0.3] }
material = { color = [0.95, 0.94, 0.90, 1.0], roughness = 0.5 }

# The kart: ADR 0140's prototype, player-driven, 4 m behind the line facing
# north. Its children are its wheels (posed by the package) and two boxes
# that ride on the chassis: a seat back and a nose.
[entities.kart]
transform = { position = [0.0, 0.7, 4.0] }
bounds = { min = [-0.6, -0.25, -1.0], max = [0.6, 0.25, 1.0] }
material = { color = [0.08, 0.58, 0.62, 1.0], roughness = 0.35, metallic = 0.2 }
rigidbody = { body_type = "dynamic", gravity_scale = 2.04 }
collider = { shape = "box", size = [1.2, 0.5, 2.0], friction = 0.3 }
vehicle = { top_speed = 24.0 }
vehicle_input = {}
# The camera follows it, closer than FlintKart's 8 m for a smaller kart
chase_camera = { distance = 7.0, height = 3.2 }

[entities.kart_seat]
parent = "kart"
transform = { position = [0.0, 0.45, 0.45] }
bounds = { min = [-0.35, -0.2, -0.12], max = [0.35, 0.2, 0.12] }
material = { color = [0.95, 0.93, 0.88, 1.0], roughness = 0.5 }

[entities.kart_nose]
parent = "kart"
transform = { position = [0.0, 0.0, -1.15] }
bounds = { min = [-0.7, -0.12, -0.15], max = [0.7, 0.12, 0.15] }
material = { color = [0.95, 0.42, 0.16, 1.0], roughness = 0.4 }

[entities.wheel_fl]
