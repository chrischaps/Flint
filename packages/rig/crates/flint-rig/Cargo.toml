[package]
name = "flint-rig"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The rig package (ADR 0139, #1621): skeletons, node clips, blending, two-bone IK and bone probes as clip kinds on the animation package's clock, and the model previewer"
publish = false

[features]
default = []
# Its player part (`player::PACKAGE`): the skeletal and node kinds on
# animation's `ClipKinds` point, a spawned model's skeleton, and the
# `StillPose` point. flint-player's generated `rig` feature turns it on.
player = [
    "flint-animation/player", "dep:flint-package", "dep:flint-render", "dep:tracing",
]
# Its CLI part (`cli::extensions()`): the model previewer, `flint edit
# <model>.glb` and the hidden `preview`, through the viewer's
# `ModelEditors` point, and the `ModelStill` point. flint-cli's generated
# `rig` feature turns it on.
cli = [
    "player", "dep:anyhow", "dep:clap", "dep:egui", "dep:flint-viewer", "dep:image",
    "dep:wgpu", "dep:winit",
]

# The kernel and the animation package it requires (#1624's rule)
[dependencies]
flint-animation = { workspace = true }
flint-core = { workspace = true }
flint-ecs = { workspace = true }
flint-import = { workspace = true }
flint-runtime = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
flint-package = { workspace = true, optional = true }
flint-render = { workspace = true, optional = true }
flint-viewer = { workspace = true, optional = true }
image = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

[dev-dependencies]
flint-animation = { workspace = true, features = ["player"] }
flint-script = { workspace = true }
flint-scene = { workspace = true }
flint-schema = { workspace = true }

# `play_clip` / `stop_clip` from a real script: the module is the animation
# package's player part
[[test]]
name = "skeletal_clip_calls"
required-features = ["player"]

[lints]
workspace = true
