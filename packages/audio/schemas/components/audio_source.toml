# A sound on an entity (flint-audio `sync.rs`). Every default below is the
# value the reader falls back to (#792).
[component.audio_source]
description = "A sound that plays from the entity, spatial or not"

[component.audio_source.fields]
file = { type = "asset", kind = "audio", description = "The sound file: a path from the scene (`audio/hit.ogg`), else a file in an `audio/` folder the scene can see (`flint asset where audio <name>` shows the search)" }
volume = { type = "f32", default = 1.0, min = 0.0, max = 2.0, description = "Volume multiplier" }
pitch = { type = "f32", default = 1.0, min = 0.1, max = 4.0, description = "Playback rate multiplier" }
loop = { type = "bool", default = false, description = "Loop continuously" }
spatial = { type = "bool", default = true, description = "3D positioned sound (uses entity transform)" }
min_distance = { type = "f32", default = 1.0, min = 0.0, description = "Distance at full volume" }
max_distance = { type = "f32", default = 25.0, min = 0.0, description = "Distance at silence" }
autoplay = { type = "bool", default = true, description = "Start playing on load" }
bus = { type = "string", default = "sfx", description = "Mixer bus: sfx, music, or one the game declares in flint.toml under [audio.buses] (#730); an unknown name is reported once and plays on sfx" }
