# Procedural generation at run time and from the CLI (ADR 0136 decision 7).
# Standard: on unless a game writes `procgen = false`. A `model.asset` or a
# texture that names a `*.procgen.toml` spec is made through it, so it owns
# no component of its own.

[package]
name = "procgen"
version = "0.1.0"
tier = "standard"
summary = "Models and textures made from procgen specs, at load and with flint gen"
engine = "^0.1"

[build]
features = ["procgen"]

# Its Rust (ADR 0137 decision 10, #1557): the crate whose `player::PACKAGE`
# the player's launcher lists (its `player` feature holds that side), and the
# crate whose `cli::extensions()` the CLI launcher lists.
[rust]
player = "flint-procgen"
cli = "flint-procgen-cli"

[provides]
crates = ["flint-procgen", "flint-procgen-cli"]
# `flint edit` on a `.procgen.toml` opens its previewers, the two hidden
# aliases below
commands = ["gen", "gen-preview", "tex-edit"]
# The spec files it makes models and textures from (#1595): a scene, chunk
# or prefab naming one (a path, or the name a spec states) uses this
# package, which is how `flint package used` sees it.
specs = ["*.procgen.toml"]
