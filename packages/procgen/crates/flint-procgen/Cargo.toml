[package]
name = "flint-procgen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Procedural generation subsystem for the Flint engine"

[features]
# The wooze field (#1516): `WoozeDef::field`, the knob ranges and built-in
# presets `[wooze]`, `[living.species]` and a preset file are checked against,
# and `LivingKnob::in_sample`. The workspace takes this crate with default
# features off: flint-living asks for it, and the player's, viewer's,
# debug panels' and CLI's `living` features. Off, the tables still read,
# settle and write back, a preset file is still laid in, and `WoozeDef::check`
# is its schema half; what only the field can say goes unsaid.
default = ["living"]
living = ["dep:flint-wooze"]
# The package's part of the player (#1557, ADR 0137): its `PACKAGE`, the
# asset maker the kernel calls at a scene's load and each frame, and the
# upload of what a generator made (`src/player/`). flint-player's `procgen`
# feature turns it on; the CLI's `gen` and the specs' own checks need none
# of it.
# The `[with.terrain]` part (#1623): the `terrain_v1` generator, which wraps
# the terrain package's bake (#1168), so a `.terrain.toml` is a spec like any
# other. The launchers turn it on when a game lists both packages.
terrain = ["dep:flint-terrain"]
player = ["dep:flint-package", "dep:flint-render", "dep:flint-ecs", "dep:flint-asset", "dep:wgpu"]

[dependencies]
web-time = { workspace = true }
flint-core = { workspace = true }
flint-wooze = { workspace = true, optional = true }
flint-geometry = { workspace = true }
flint-import = { workspace = true }
flint-package = { workspace = true, optional = true }
flint-render = { workspace = true, optional = true }
flint-ecs = { workspace = true, optional = true }
flint-asset = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
# The scene tables living props own (`[living]`, `[wooze]`; #686) are read out
# of a `SceneFile`, checked against their `[table.*]` schemas, and written back
# through a `SceneDocument`.
flint-scene = { workspace = true }
flint-schema = { workspace = true }
# terrain_v1 (#1168) wraps the terrain bake: the `terrain` feature
flint-terrain = { workspace = true, optional = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
image = { workspace = true }
gltf = { workspace = true }

# The procgen cache's disk tier (#181). Native only: the web build has no
# disk to keep it on, and the bytes stay out of the wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bincode = "1.3"

# `tests/scene_table_schemas.rs` holds the `[table.wooze]` schema's zone keys
# to the field's in every build
[dev-dependencies]
flint-wooze = { workspace = true }

[lints]
workspace = true
