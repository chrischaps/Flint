# Living props and the wooze field (#211-#252). A feature: off unless a game
# lists `living = "*"`. Procgen makes the props' poses, so it comes with it.
# Its `debug` script module (the A/B and commit calls) runs only where the
# debug-hud package is in the build too.

[package]
name = "living"
version = "0.1.0"
tier = "feature"
summary = "Props that hold and glide, and the wooze field"
engine = "^0.1"

[requires]
procgen = "*"

[build]
features = ["living"]

# Its Rust (ADR 0137 decision 10, #1558): the crate whose `player::PACKAGE`
# the player's launcher lists (its `player` feature holds that side), and
# the crate whose `cli::extensions()` the CLI launcher lists (its `cli`
# feature).
[rust]
player = "flint-living"
cli = "flint-living"

# With the debug-hud package listed too (ADR 0137 decision 9): the Living
# Props panel, F8's pick and the `debug` module's A/B and commit calls
# (#854). The launchers turn the feature on when a game lists both.
[with.debug-hud]
features = ["flint-living/debug-hud"]

[provides]
crates = ["flint-living", "flint-wooze"]
components = ["living_prop", "shallow_wooze"]
scene_tables = ["living", "wooze"]
script_modules = ["living", "wooze", "debug"]

# What a player built without it still knows (ADR 0137 decision 8, #1585):
# a scene with the components or tables above hears once that they `does`,
# and a game state may name the `living` policy in any build (#727). The
# player's kernel reads both from here, so it names no package.
[without]
does = "stand still"
policies = ["living"]
