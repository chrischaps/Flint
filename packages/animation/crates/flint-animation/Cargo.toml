[package]
name = "flint-animation"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The animation package's core (ADR 0139, #1620): clips on one clock, sequences and cues, property clips and tween, and the clip-kind seam the rig's skeletons and the flipbooks use"
publish = false

[features]
default = []
# Its player part (`player::PACKAGE`): the subsystem that plays every scene's
# clips at `Stage::Animate`, runs the kinds' poses at `Stage::Pose` and steps
# tweens at `Stage::Tweens`, the `animation` and `tween` script modules, the
# `ClipKinds` point, and a capture's `HeadlessAnimation` (the
# `CapturePoses` point). flint-player's
# generated `animation` feature turns it on.
player = [
    "dep:flint-package", "dep:flint-render", "dep:flint-script", "dep:rhai",
    "dep:tracing", "dep:wgpu",
]

# The kernel only (#1624's rule): flint-package is the Package API.
[dependencies]
flint-core = { workspace = true }
flint-ecs = { workspace = true }
flint-runtime = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
flint-package = { workspace = true, optional = true }
flint-render = { workspace = true, optional = true }
flint-script = { workspace = true, optional = true }
rhai = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
# The script calls' tests run the package's modules on a bare engine
flint-script = { workspace = true }
flint-scene = { workspace = true }
flint-schema = { workspace = true }

[lints]
workspace = true
