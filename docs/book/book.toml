[book]
title = "Flint Engine"
description = "Documentation for the Flint CLI-first, AI-agent-optimized 3D game engine"
authors = ["Chris Chaps"]
language = "en"
src = "src"

[build]
build-dir = "book"
# A page SUMMARY.md links that isn't there is an error, not an empty page:
# a package's pages are copied in by scripts/book-collect.py (#1563)
create-missing = false

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
additional-css = ["theme/css/custom.css"]
git-repository-url = "https://github.com/chrischaps/flint"
site-url = "/flint/"
no-section-label = false

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
